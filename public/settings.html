<!doctype html>
<html lang="zh-CN">
<head>
<script>(function(){try{var isP=/\/(player|stream)/.test(location.pathname);var k=isP?'bili_player_theme':'bili_theme';var d=isP?'dark':'light';var t=localStorage.getItem(k)||d;if(t!=='dark'&&t!=='light')t=d;document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设置 - B站视频搜索器</title>
<style>
  :root {
    --pink: #FB7299;
    --blue: #00A1D6;
    --bg: #F1F2F3;
    --card: #FFFFFF;
    --text: #18191C;
    --text-2: #61666D;
    --text-3: #9499A0;
    --border: #E3E5E7;
    --header-h: 64px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* ============ 顶栏（与 account.html 一致，不含搜索框） ============ */
  .site-header { position: sticky; top: 0; z-index: 100; height: var(--header-h); background: var(--card); color: var(--text); box-shadow: 0 1px 8px rgba(0, 0, 0, .06); }
  .header-inner { max-width: 1400px; height: 100%; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 20px; }
  .logo { display: flex; align-items: center; flex-shrink: 0; white-space: nowrap; user-select: none; color: var(--pink); }
  .logo-svg { display: block; height: 28px; width: auto; }
  .top-nav { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .top-nav-item { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: none; background: none; border-radius: 8px; color: inherit; font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer; transition: background .15s ease, color .15s ease; opacity: .9; }
  .top-nav-item:hover { background: rgba(0, 0, 0, .05); opacity: 1; }
  .user-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .user-icon { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; padding: 0; border: none; background: none; border-radius: 50%; color: inherit; font-family: inherit; cursor: pointer; transition: background .15s ease; }
  .user-icon:hover { background: rgba(0, 0, 0, .05); }
  .user-icon svg { display: block; }
  .login-btn { width: auto; height: 34px; padding: 0 16px; border-radius: 17px; background: var(--pink); color: #fff; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; transition: filter .15s ease; }
  .login-btn:hover { filter: brightness(.94); }
  .avatar-btn { width: 34px; height: 34px; padding: 0; border-radius: 50%; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text-2); font-weight: 600; font-size: 14px; }
  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ============ 内容 ============ */
  .settings-wrap { max-width: 680px; margin: 0 auto; padding: 24px 24px 60px; }
  .page-title { font-size: 20px; font-weight: 700; margin: 4px 0 20px; }
  .settings-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px 22px; margin-bottom: 20px; }
  .settings-card h2 { font-size: 15px; font-weight: 700; margin: 0 0 4px; }
  .settings-card .desc { font-size: 12px; color: var(--text-3); margin: 0 0 6px; line-height: 1.6; }

  .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--bg); gap: 16px; }
  .settings-row:last-child { border-bottom: none; }
  .settings-row-label { font-size: 14px; font-weight: 600; }
  .settings-row-desc { font-size: 12px; color: var(--text-3); margin-top: 3px; }

  /* 开关 */
  .switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch .slider { position: absolute; inset: 0; background: #ccc; border-radius: 999px; transition: background .2s ease; cursor: pointer; }
  .switch .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .2s ease; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .switch input:checked + .slider { background: var(--pink); }
  .switch input:checked + .slider::before { transform: translateX(20px); }

  /* Banner 单选卡片 */
  .radio-group { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .radio-option { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: border-color .15s ease, background .15s ease; }
  .radio-option:hover { border-color: var(--pink); }
  .radio-option.active { border-color: var(--pink); background: #fdeef2; }
  .radio-option input { margin-top: 3px; accent-color: var(--pink); flex-shrink: 0; }
  .radio-option-body { min-width: 0; flex: 1; }
  .radio-option-title { font-size: 14px; font-weight: 600; }
  .radio-option-desc { font-size: 12px; color: var(--text-3); margin-top: 2px; line-height: 1.6; }

  .custom-url-box { margin-top: 10px; padding-left: 30px; display: none; }
  .custom-url-box.show { display: block; }
  .settings-input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; outline: none; background: var(--card); color: var(--text); }
  .settings-input:focus { border-color: var(--pink); }
  .preview-img { margin-top: 10px; width: 100%; max-height: 150px; object-fit: cover; border-radius: 8px; display: none; background: var(--bg); }
  .preview-img.show { display: block; }
  .field-actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .btn-clear { background: none; border: 1px solid var(--border); color: var(--text-2); border-radius: 16px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
  .btn-clear:hover { border-color: var(--pink); color: var(--pink); }
  .save-hint { font-size: 12px; color: #2ecc71; opacity: 0; transition: opacity .3s ease; }
  .save-hint.show { opacity: 1; }

  @media (max-width: 640px) {
    :root { --header-h: 56px; }
    .header-inner { padding: 0 14px; gap: 10px; }
    .logo-svg { height: 24px; }
    .user-actions .user-icon:not(.always-show) { display: none; }
    .settings-wrap { padding: 18px 14px 50px; }
  }

  /* ============ 深色模式 ============ */
  :root[data-theme="dark"] {
    --bg: #141414;
    --card: #1f2022;
    --text: #e6e6e8;
    --text-2: #9a9da3;
    --text-3: #6f7278;
    --border: #2c2d30;
  }
  :root[data-theme="dark"] .top-nav-item:hover,
  :root[data-theme="dark"] .user-icon:hover { background: rgba(255,255,255,.08); }
  :root[data-theme="dark"] .avatar-btn { background: var(--card); }
  :root[data-theme="dark"] .radio-option.active { background: #3a2229; }
  :root[data-theme="dark"] .switch .slider { background: #444; }
</style>

<div class="settings-wrap">
  <h1 class="page-title">设置</h1>

  <div class="settings-card">
    <h2>外观</h2>
    <p class="desc">仅保存在本浏览器（localStorage），换个设备或清除浏览器数据后需要重新设置。</p>
    <div class="settings-row">

  </div>

  <div class="settings-card">
    <h2>首页 Banner 图源</h2>

    <div class="radio-group" id="bannerRadioGroup">
      <label class="radio-option" data-value="auto">
        <input type="radio" name="bannerMode" value="auto">
        <div class="radio-option-body">
          <div class="radio-option-title">默认（自动降级规则）</div>
          <div class="radio-option-desc">季节头图里有视频 → 播视频；没有则用轮播图；都没有则用静态头图</div>
        </div>
      </label>
      <label class="radio-option" data-value="header">
        <input type="radio" name="bannerMode" value="header">
        <div class="radio-option-body">
          <div class="radio-option-title">季节头图</div>
          <div class="radio-option-desc">固定使用 B 站当前的季节头图（有视频播视频，没有则用静态图），不使用轮播图</div>
        </div>
      </label>
      <label class="radio-option" data-value="carousel">
        <input type="radio" name="bannerMode" value="carousel">
        <div class="radio-option-body">
          <div class="radio-option-title">轮播图</div>
          <div class="radio-option-desc">固定使用首页轮播 banner，5 秒自动切换</div>
        </div>
      </label>
      <label class="radio-option" data-value="custom">
        <input type="radio" name="bannerMode" value="custom">
        <div class="radio-option-body">
          <div class="radio-option-title">自定义链接图片</div>
          <div class="radio-option-desc">用你自己提供的图片链接作为首页 Banner</div>
          <div class="custom-url-box" id="bannerCustomBox">
            <input type="text" class="settings-input" id="bannerCustomUrl" placeholder="https://example.com/banner.jpg">
            <img class="preview-img" id="bannerPreview" alt="预览" referrerpolicy="no-referrer">
            <div class="field-actions">
              <button type="button" class="btn-clear" id="bannerClearBtn">清除链接</button>
              <span class="save-hint" id="bannerSaveHint">已保存</span>
            </div>
          </div>
        </div>
      </label>
    </div>
  </div>

  <div class="settings-card">
    <h2>消息页背景图</h2>
    <p class="desc">给整个"消息"页面设置一张背景图，留空则使用默认背景。</p>
    <input type="text" class="settings-input" id="msgBgUrl" placeholder="https://example.com/background.jpg">
    <img class="preview-img" id="msgBgPreview" alt="预览" referrerpolicy="no-referrer">
    <div class="field-actions">
      <button type="button" class="btn-clear" id="msgBgClearBtn">清除背景</button>
      <span class="save-hint" id="msgBgSaveHint">已保存</span>
    </div>
  </div>
</div>

<script>
// cookie 拦截：和其他页面一致，把 localStorage 里的 cookie 通过 X-Bili-Cookie 头带给后端
(function(){
  try {
    const raw = localStorage.getItem('bili_creds');
    const creds = raw ? JSON.parse(raw) : {};
    const ch = Object.keys(creds).map(k => `${k}=${creds[k]}`).join('; ');
    let devId = localStorage.getItem('bili_device_id') || '';
    if (!devId) { devId = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('bili_device_id', devId); }
    const of = window.fetch;
    window.fetch = function(input, opts) {
      opts = opts || {};
      opts.headers = Object.assign({}, opts.headers);
      if (devId) opts.headers['X-Device-Id'] = devId;
      if (ch) opts.headers['X-Bili-Cookie'] = ch;
      return of(input, opts);
    };
  } catch(e) {}
})();

function faceUrl(f) { f = String(f || ''); return f.startsWith('//') ? 'https:' + f : f; }

function applyHeaderLogin(m) {
  const cur = document.getElementById('loginEntry');
  if (!cur) return;
  const a = document.createElement('a');
  a.id = 'loginEntry';
  a.href = '/account';
  if (m.loggedIn && m.user) {
    a.className = 'avatar-btn';
    a.title = m.user.uname || '';
    if (m.user.face) {
      const img = document.createElement('img');
      img.src = faceUrl(m.user.face);
      img.referrerPolicy = 'no-referrer';
      a.appendChild(img);
    } else {
      a.textContent = (m.user.uname || '我').slice(0, 1);
    }
  } else {
    a.className = 'login-btn';
    a.textContent = '登录';
  }
  cur.replaceWith(a);
}
(async function () {
  try {
    const r = await fetch('/api/me');
    applyHeaderLogin(await r.json());
  } catch (e) {}
})();

function flashSaved(el) {
  if (!el) return;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1500);
}

/* ============ 深色模式（全站 + 播放器独立） ============ */
const themeToggle = document.getElementById('themeToggle');
const playerThemeToggle = document.getElementById('playerThemeToggle');
let curTheme = 'light', curPTheme = 'dark';
try { curTheme = localStorage.getItem('bili_theme') || 'light'; } catch (e) {}
try { curPTheme = localStorage.getItem('bili_player_theme') || 'dark'; } catch (e) {}
themeToggle.checked = curTheme === 'dark';
playerThemeToggle.checked = curPTheme === 'dark';
themeToggle.addEventListener('change', () => {
  curTheme = themeToggle.checked ? 'dark' : 'light';
  try { localStorage.setItem('bili_theme', curTheme); } catch (e) {}
  if (!/\/(player|stream)/.test(location.pathname))
    document.documentElement.setAttribute('data-theme', curTheme);
});
playerThemeToggle.addEventListener('change', () => {
  curPTheme = playerThemeToggle.checked ? 'dark' : 'light';
  try { localStorage.setItem('bili_player_theme', curPTheme); } catch (e) {}
});

/* ============ 首页 Banner 图源 ============ */
const bannerGroup = document.getElementById('bannerRadioGroup');
const bannerCustomBox = document.getElementById('bannerCustomBox');
const bannerCustomUrlInput = document.getElementById('bannerCustomUrl');
const bannerPreview = document.getElementById('bannerPreview');
const bannerSaveHint = document.getElementById('bannerSaveHint');

let bannerMode = 'auto';
try { bannerMode = localStorage.getItem('bili_banner_mode') || 'auto'; } catch (e) {}
let bannerCustomUrl = '';
try { bannerCustomUrl = localStorage.getItem('bili_banner_custom_url') || ''; } catch (e) {}
bannerCustomUrlInput.value = bannerCustomUrl;

function updateBannerRadioUI() {
  bannerGroup.querySelectorAll('.radio-option').forEach(opt => {
    const active = opt.dataset.value === bannerMode;
    opt.classList.toggle('active', active);
    opt.querySelector('input').checked = active;
  });
  bannerCustomBox.classList.toggle('show', bannerMode === 'custom');
}
function updateBannerPreview() {
  if (bannerCustomUrl) {
    bannerPreview.src = bannerCustomUrl;
    bannerPreview.classList.add('show');
  } else {
    bannerPreview.classList.remove('show');
    bannerPreview.removeAttribute('src');
  }
}
updateBannerRadioUI();
updateBannerPreview();

bannerGroup.querySelectorAll('input[name="bannerMode"]').forEach(input => {
  input.addEventListener('change', () => {
    bannerMode = input.value;
    try { localStorage.setItem('bili_banner_mode', bannerMode); } catch (e) {}
    updateBannerRadioUI();
    if (bannerMode === 'custom') bannerCustomUrlInput.focus();
  });
});
// 点击整张卡片也能选中（label 本身已经能触发，这里只是防止点到说明文字时没反应）
bannerGroup.querySelectorAll('.radio-option').forEach(opt => {
  opt.addEventListener('click', (e) => {
    if (e.target === bannerCustomUrlInput || e.target.closest('.custom-url-box')) return;
    const input = opt.querySelector('input');
    if (!input.checked) { input.checked = true; input.dispatchEvent(new Event('change')); }
  });
});

let bannerUrlTimer = null;
bannerCustomUrlInput.addEventListener('input', () => {
  clearTimeout(bannerUrlTimer);
  bannerUrlTimer = setTimeout(() => {
    bannerCustomUrl = bannerCustomUrlInput.value.trim();
    try { localStorage.setItem('bili_banner_custom_url', bannerCustomUrl); } catch (e) {}
    updateBannerPreview();
    flashSaved(bannerSaveHint);
  }, 500);
});
document.getElementById('bannerClearBtn').addEventListener('click', () => {
  bannerCustomUrlInput.value = '';
  bannerCustomUrl = '';
  try { localStorage.removeItem('bili_banner_custom_url'); } catch (e) {}
  updateBannerPreview();
  flashSaved(bannerSaveHint);
});

/* ============ 消息页背景 ============ */
const msgBgInput = document.getElementById('msgBgUrl');
const msgBgPreview = document.getElementById('msgBgPreview');
const msgBgSaveHint = document.getElementById('msgBgSaveHint');
let msgBg = '';
try { msgBg = localStorage.getItem('bili_msg_bg') || ''; } catch (e) {}
msgBgInput.value = msgBg;
function updateMsgBgPreview() {
  if (msgBg) { msgBgPreview.src = msgBg; msgBgPreview.classList.add('show'); }
  else { msgBgPreview.classList.remove('show'); msgBgPreview.removeAttribute('src'); }
}
updateMsgBgPreview();

let msgBgTimer = null;
msgBgInput.addEventListener('input', () => {
  clearTimeout(msgBgTimer);
  msgBgTimer = setTimeout(() => {
    msgBg = msgBgInput.value.trim();
    try { localStorage.setItem('bili_msg_bg', msgBg); } catch (e) {}
    updateMsgBgPreview();
    flashSaved(msgBgSaveHint);
  }, 500);
});
document.getElementById('msgBgClearBtn').addEventListener('click', () => {
  msgBgInput.value = '';
  msgBg = '';
  try { localStorage.removeItem('bili_msg_bg'); } catch (e) {}
  updateMsgBgPreview();
  flashSaved(msgBgSaveHint);
});
</script>
</body>
</html>
