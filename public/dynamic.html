<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="/auth.js"></script>
<script>(function(){try{var isP=/\/(player|stream)/.test(location.pathname);var k=isP?'bili_player_theme':'bili_theme';var d=isP?'dark':'light';var t=localStorage.getItem(k)||d;if(t!=='dark'&&t!=='light')t=d;document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>动态 - B站视频搜索器</title>
<style>
  :root {
    --pink: #FB7299;
    --blue: #00A1D6;
    --bg: #F1F2F3;
    --card: #FFFFFF;
    --text: #18191C;
    --text-2: #61666D;
    --text-3: #9499A0;
    --border: #E3E5E7;
    --header-h: 64px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--card); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* ============ 顶栏（同其它页面，无搜索框） ============ */
  .site-header { position: sticky; top: 0; z-index: 100; height: var(--header-h); background: var(--card); color: var(--text); box-shadow: 0 1px 8px rgba(0,0,0,.06); }
  .header-inner { max-width: 1400px; height: 100%; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 20px; }
  .logo { display: flex; align-items: center; flex-shrink: 0; user-select: none; color: var(--pink); }
  .logo-svg { display: block; height: 28px; width: auto; }
  .top-nav { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .top-nav-item { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: none; background: none; border-radius: 8px; color: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s ease; opacity: .9; }
  .top-nav-item:hover { background: rgba(0,0,0,.05); opacity: 1; }
  .user-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .user-icon { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; padding: 0; border: none; background: none; border-radius: 50%; color: inherit; cursor: pointer; transition: background .15s ease; position: relative; }
  .user-icon:hover { background: rgba(0,0,0,.05); }
  .user-icon.active { color: var(--pink); }
  .user-icon svg { display: block; }
  .login-btn { height: 34px; padding: 0 16px; border-radius: 17px; background: var(--pink); color: #fff; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }
  .avatar-btn { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text-2); font-weight: 600; font-size: 14px; }
  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ============ 动态流 ============ */
  .dy-wrap { max-width: 740px; margin: 0 auto; padding: 18px 16px 80px; }
  .dy-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .dy-tab { padding: 7px 18px; border: 1px solid var(--border); border-radius: 18px; background: var(--card); color: var(--text-2); font-size: 14px; cursor: pointer; transition: all .15s; }
  .dy-tab:hover { color: var(--pink); border-color: var(--pink); }
  .dy-tab.active { background: var(--pink); border-color: var(--pink); color: #fff; font-weight: 600; }
  .dy-refresh { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border: 1px solid var(--border); border-radius: 18px; background: var(--card); color: var(--text-2); font-size: 13px; cursor: pointer; }
  .dy-refresh:hover { color: var(--pink); border-color: var(--pink); }
  .dy-refresh.spin svg { animation: dySpin .8s linear infinite; }
  @keyframes dySpin { to { transform: rotate(360deg); } }

  .dy-newpill { display: none; position: sticky; top: calc(var(--header-h) + 8px); z-index: 20; margin: 0 auto 12px; width: fit-content; padding: 8px 18px; border: none; border-radius: 18px; background: var(--pink); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 3px 12px rgba(251,114,153,.45); }
  .dy-newpill.show { display: block; }

  .dy-item { padding: 20px 0 4px; border-bottom: 1px solid var(--border); }
  .dy-item:last-child { border-bottom: none; }
  .dy-head { display: flex; align-items: center; gap: 12px; }
  .dy-avatar { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--bg); }
  .dy-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dy-author { min-width: 0; flex: 1; }
  .dy-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .dy-name:hover { color: var(--pink); }
  .dy-sub { margin-top: 3px; font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .dy-tag { padding: 0 6px; border-radius: 3px; font-size: 11px; line-height: 17px; background: var(--bg); color: var(--text-2); }
  .dy-tag.pink { background: rgba(251,114,153,.14); color: var(--pink); }

  .dy-body { margin-top: 10px; padding-left: 56px; }
  .dy-title { font-size: 16px; font-weight: 700; margin: 0 0 6px; line-height: 1.5; word-break: break-all; }
  .dy-text { font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
  .dy-text.clamp { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  .dy-text a { color: var(--blue); }
  .dy-text a:hover { text-decoration: underline; }
  .dy-emote { height: 22px; width: auto; vertical-align: -5px; margin: 0 1px; }
  .dy-more { margin-top: 4px; padding: 0; border: none; background: none; color: var(--blue); font-size: 13px; cursor: pointer; }
  .dy-fold { margin-bottom: 8px; padding: 6px 10px; border-radius: 6px; background: var(--bg); color: var(--text-3); font-size: 12px; }

  /* 图片九宫格 */
  .dy-images { margin-top: 10px; display: grid; gap: 4px; max-width: 480px; }
  .dy-images.count-1 { grid-template-columns: 1fr; max-width: 340px; }
  .dy-images.count-2, .dy-images.count-4 { grid-template-columns: 1fr 1fr; max-width: 340px; }
  .dy-images.count-3, .dy-images.count-5, .dy-images.count-6, .dy-images.count-7, .dy-images.count-8, .dy-images.count-9 { grid-template-columns: repeat(3, 1fr); }
  .dy-img { position: relative; padding: 0; border: none; background: var(--bg); border-radius: 6px; overflow: hidden; cursor: zoom-in; aspect-ratio: 1; display: block; }
  .dy-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dy-images.count-1 .dy-img { aspect-ratio: auto; max-height: 420px; }
  .dy-images.count-1 .dy-img img { height: auto; max-height: 420px; object-fit: contain; }
  .dy-img-more { margin-top: 6px; font-size: 12px; color: var(--text-3); }

  /* 视频 / 直播：和搜索页一致的竖向卡片（封面 + 左下播放/弹幕 + 右下时长 + 两行标题 + UP 行） */
  .vcard { display: block; width: 280px; max-width: 100%; margin-top: 10px; color: inherit; cursor: pointer; transition: transform .12s ease; }
  .vcard:hover { transform: translateY(-3px); }
  .vcard:hover .vcard-title { color: var(--pink); }
  .vcard-thumb { position: relative; display: block; width: 100%; aspect-ratio: 16 / 10; background: var(--border); border-radius: 8px; overflow: hidden; }
  .vcard-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vcard-thumb::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0)); pointer-events: none; }
  .vcard-stats { position: absolute; left: 6px; bottom: 6px; display: flex; gap: 8px; color: #fff; font-size: 12px; z-index: 1; }
  .vcard-stat { display: flex; align-items: center; gap: 3px; }
  .vcard-stat svg { flex-shrink: 0; }
  .vcard-dur { position: absolute; right: 6px; bottom: 6px; z-index: 1; padding: 1px 5px; border-radius: 3px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; }
  .vcard-live { position: absolute; left: 6px; top: 6px; z-index: 1; padding: 1px 7px; border-radius: 4px; background: var(--pink); color: #fff; font-size: 11px; font-weight: 600; }
  .vcard-body { display: block; padding: 8px 2px 2px; }
  .vcard-title { margin: 0 0 4px; font-size: 14px; line-height: 1.4; max-height: 2.8em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: var(--text); }
  .vcard-author { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; }
  .vcard-author svg { flex-shrink: 0; }
  .vcard-author span { overflow: hidden; text-overflow: ellipsis; }

  /* 专栏 / 番剧 / 课程等：横向通用卡片 */
  .dy-card { margin-top: 10px; display: flex; gap: 12px; padding: 10px; border-radius: 10px; background: var(--bg); color: inherit; }
  .dy-card:hover .dy-card-title { color: var(--pink); }
  .dy-card-cover { position: relative; flex-shrink: 0; width: 160px; aspect-ratio: 16/10; border-radius: 6px; overflow: hidden; background: var(--border); }
  .dy-card-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dy-card-info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .dy-card-title { font-size: 14px; font-weight: 600; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .dy-card-brief { font-size: 12px; color: var(--text-2); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .dy-badge { align-self: flex-start; padding: 0 6px; border-radius: 3px; font-size: 11px; line-height: 17px; background: rgba(251,114,153,.14); color: var(--pink); }
  .dy-none { margin-top: 10px; padding: 14px; border-radius: 8px; background: var(--bg); color: var(--text-3); font-size: 13px; text-align: center; }
  .dy-opus-link { display: inline-block; margin-top: 8px; font-size: 13px; color: var(--blue); }
  .dy-opus-link:hover { text-decoration: underline; }

  /* 转发 */
  .dy-forward { margin-top: 10px; padding: 12px 14px 14px; border-radius: 8px; background: var(--bg); }
  .dy-forward-author { font-size: 14px; margin-bottom: 6px; }
  .dy-forward-author a { color: var(--blue); font-weight: 600; }
  .dy-forward .dy-card { background: var(--card); }
  .dy-forward .vcard { width: 260px; }
  .dy-forward .dy-images { max-width: 420px; }

  /* 底部统计 */
  .dy-foot { margin: 8px 0 0 56px; padding: 4px 0 10px; display: flex; align-items: center; gap: 4px; }
  .dy-stat { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px 6px 0; margin-right: 12px; border: none; background: none; color: var(--text-3); font-size: 13px; cursor: pointer; }
  .dy-stat svg { width: 19px; height: 19px; display: block; }
  .dy-stat:hover { color: var(--pink); }
  .dy-stat.active { color: var(--pink); }
  .dy-stat.active svg path { fill: currentColor; }
  .dy-stat.busy { opacity: .5; pointer-events: none; }
  .dy-stat.open { color: var(--pink); }
  .dy-comments-slot { margin: 0 0 14px 56px; }

  .dy-state { text-align: center; color: var(--text-3); font-size: 13px; padding: 26px 0; }
  .dy-state .btn { margin-top: 10px; padding: 7px 22px; border: none; border-radius: 16px; background: var(--pink); color: #fff; font-size: 13px; cursor: pointer; }
  .dy-empty { padding: 60px 20px; text-align: center; color: var(--text-3); font-size: 14px; }
  .dy-login { padding: 60px 20px; text-align: center; }
  .dy-login h2 { margin: 0 0 8px; font-size: 18px; }
  .dy-login p { margin: 0 0 18px; color: var(--text-2); font-size: 13px; }
  .dy-login a { display: inline-block; padding: 9px 26px; border-radius: 18px; background: var(--pink); color: #fff; font-size: 14px; font-weight: 600; }

  /* 骨架屏 */
  .sk { background: linear-gradient(90deg, var(--bg) 25%, var(--border) 37%, var(--bg) 63%); background-size: 400% 100%; animation: skShine 1.4s ease infinite; border-radius: 6px; }
  @keyframes skShine { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  .sk-item { padding: 20px 0 22px; border-bottom: 1px solid var(--border); }
  .sk-row { display: flex; gap: 12px; align-items: center; }
  .sk-avatar { width: 44px; height: 44px; border-radius: 50%; }

  .bvid-toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px); background: rgba(24,25,28,.9); color: #fff; font-size: 14px; padding: 10px 18px; border-radius: 8px; z-index: 1200; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; }
  .bvid-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 640px) {
    :root { --header-h: 56px; }
    .header-inner { padding: 0 14px; gap: 10px; }
    .logo-svg { height: 24px; }
    .user-actions .user-icon:not(.always-show):not(.active) { display: none; }
    .dy-wrap { padding: 12px 10px 70px; }
    .dy-item { padding: 16px 0 4px; }
    .dy-body { padding-left: 0; }
    .dy-foot { margin-left: 0; }
    .dy-card { flex-direction: column; }
    .dy-card-cover { width: 100%; }
    .dy-comments-slot { margin-left: 0; }
    .vcard { width: 100%; }
  }

  /* ============ 深色模式 ============ */
  :root[data-theme="dark"] { --bg: #141414; --card: #1f2022; --text: #e6e6e8; --text-2: #9a9da3; --text-3: #6f7278; --border: #2c2d30; }
  :root[data-theme="dark"] .top-nav-item:hover, :root[data-theme="dark"] .user-icon:hover { background: rgba(255,255,255,.08); }
  :root[data-theme="dark"] .avatar-btn { background: var(--card); }
</style>
</head>

<script>
// ============ 登录凭证 / 设备 ID（与其它页面一致） ============
let _credsMem = {};
try { const raw = localStorage.getItem('bili_creds'); if (raw) _credsMem = JSON.parse(raw) || {}; } catch (e) {}
function _cookieHeader() { return Object.keys(_credsMem || {}).map(k => `${k}=${_credsMem[k]}`).join('; '); }
let _deviceId = '';
try { _deviceId = localStorage.getItem('bili_device_id') || ''; if (!_deviceId) { _deviceId = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('bili_device_id', _deviceId); } } catch (e) {}
const _origFetch = window.fetch.bind(window);
window.fetch = (input, opts) => {
  opts = opts || {};
  const ch = _cookieHeader();
  const setH = (k, v) => { if (opts.headers instanceof Headers) opts.headers.set(k, v); else opts.headers = Object.assign({}, opts.headers), opts.headers[k] = v; };
  if (_deviceId) setH('X-Device-Id', _deviceId);
  if (ch) setH('X-Bili-Cookie', ch);
  return _origFetch(input, opts);
};

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function faceUrl(f) { f = String(f || ''); return f.startsWith('//') ? 'https:' + f : f; }
function fmtCount(n) {
  n = Number(n) || 0;
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, '') + '亿';
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  return String(n);
}
let toastTimer = null;
function showToast(text) {
  const t = document.getElementById('bvidToast');
  t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}
function absTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function applyHeaderLogin(m) {
  const cur = document.getElementById('loginEntry');
  if (!cur) return;
  const a = document.createElement('a');
  a.id = 'loginEntry'; a.href = '/account';
  if (m.loggedIn && m.user) {
    a.className = 'avatar-btn'; a.title = m.user.uname || '';
    if (m.user.face) {
      const img = document.createElement('img');
      img.src = faceUrl(m.user.face); img.referrerPolicy = 'no-referrer'; img.alt = m.user.uname || '';
      a.appendChild(img);
    } else { a.textContent = (m.user.uname || '我').slice(0, 1); }
  } else { a.className = 'login-btn'; a.textContent = '登录'; }
  cur.replaceWith(a);
}

/* ============ 渲染 ============ */
// 服务端已对上游文本做过转义（正文里的 <a>/<img> 也是服务端拼的），这里直接按 HTML 输出
const IC = {
  forward: '<svg viewBox="0 0 24 24" fill="none"><path d="M14 5l7 6.5-7 6.5v-4c-5 0-8.5 1.2-11 4.5.6-5.5 4-9.5 11-10V5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  comment: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H11l-4.5 4v-4h-1A1.5 1.5 0 0 1 4 14.5v-9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  like: '<svg viewBox="0 0 24 24" fill="none"><path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3Zm0 0l4.5-8a2 2 0 0 1 3.5 1.5V9h4.2a2 2 0 0 1 1.97 2.3l-1.1 7A2 2 0 0 1 18.1 20H10a3 3 0 0 1-3-3v-6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  play: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="4" stroke="currentColor" stroke-width="1.6"/><path d="M4 4.5C4 3.6 4.99 3.05 5.75 3.52L19.5 12L5.75 20.48C4.99 20.95 4 20.4 4 19.5V4.5Z" fill="currentColor" transform="translate(6.6,6) scale(0.5)"/></svg>',
  dm: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="4" stroke="currentColor" stroke-width="1.6"/><line x1="6" y1="9.5" x2="15" y2="9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="6" y1="14.5" x2="18" y2="14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  up: '<svg width="16" height="13" viewBox="0 0 24 20"><rect x="0.5" y="0.5" width="23" height="19" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/><text x="12" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" font-family="-apple-system,BlinkMacSystemFont,\'PingFang SC\',\'Microsoft YaHei\',Roboto,sans-serif">UP</text></svg>',
};
const img = (url) => `<img src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer">`;

function imagesHTML(images, extra, idPrefix) {
  if (!images || !images.length) return '';
  const cells = images.map((im, i) => `<button type="button" class="dy-img" data-lb="${idPrefix}" data-i="${i}">${img(im.url)}</button>`).join('');
  const more = extra > 0 ? `<div class="dy-img-more">共 ${images.length + extra} 张，这里显示前 ${images.length} 张</div>` : '';
  return `<div class="dy-images count-${Math.min(images.length, 9)}">${cells}</div>${more}`;
}

// 视频 / 直播：搜索页同款竖向卡片；其余类型走横向通用卡片
function cardHTML(c, authorName) {
  if (!c) return '';
  if (c.kind === 'none') return `<div class="dy-none">${c.tips}</div>`;
  if (c.kind === 'video' || (c.kind === 'live' && c.roomId)) {
    const isVideo = c.kind === 'video';
    const href = isVideo ? `/player?bv=${encodeURIComponent(c.bvid || '')}${c.bvid ? '' : '&av=' + c.aid}` : `/stream?room_id=${c.roomId}`;
    const stats = isVideo
      ? `<span class="vcard-stats">${c.play ? `<span class="vcard-stat">${IC.play}${esc(c.play)}</span>` : ''}${c.danmaku ? `<span class="vcard-stat">${IC.dm}${esc(c.danmaku)}</span>` : ''}</span>`
      : (c.desc ? `<span class="vcard-stats"><span class="vcard-stat">${c.desc}</span></span>` : '');
    return `<a class="vcard" href="${esc(href)}">
      <span class="vcard-thumb">${c.cover ? img(c.cover) : ''}${stats}${isVideo && c.duration ? `<span class="vcard-dur">${esc(c.duration)}</span>` : ''}${!isVideo && c.liveState ? '<span class="vcard-live">直播中</span>' : ''}</span>
      <span class="vcard-body"><p class="vcard-title">${c.title || ''}</p>${authorName ? `<span class="vcard-author">${IC.up}<span>${authorName}</span></span>` : ''}</span>
    </a>`;
  }
  let href = '', target = '';
  if (c.url) { href = c.url; target = ' target="_blank" rel="noreferrer noopener"'; }
  const tag = href ? 'a' : 'div';
  const hrefAttr = href ? ` href="${esc(href)}"${target}` : '';
  const cover = c.cover ? `<span class="dy-card-cover">${img(c.cover)}</span>` : '';
  const brief = c.desc ? `<span class="dy-card-brief">${c.desc}</span>` : '';
  const badge = c.badge || c.label ? `<span class="dy-badge">${c.badge || c.label}</span>` : '';
  return `<${tag} class="dy-card"${hrefAttr}>${cover}<span class="dy-card-info"><span class="dy-card-title">${c.title || ''}</span>${brief}${badge}</span></${tag}>`;
}

function authorHref(a) { return a.mid ? `/account?mid=${a.mid}` : '#'; }

function forwardHTML(f, idPrefix) {
  if (!f) return `<div class="dy-none">原动态已被删除或不可见</div>`;
  const a = f.author || {};
  return `<div class="dy-forward">
    <div class="dy-forward-author">@<a href="${esc(authorHref(a))}">${a.name || '原动态'}</a></div>
    ${f.title ? `<div class="dy-title">${f.title}</div>` : ''}
    ${f.text ? `<div class="dy-text">${f.text}</div>` : ''}
    ${imagesHTML(f.images, f.extraImageCount, idPrefix)}
    ${cardHTML(f.card, a.name)}
  </div>`;
}

let items = [];            // 已加载的动态模型（点赞状态等会改里面的字段）
const lbGroups = {};       // 灯箱图片组：key -> images
let myMid = 0;

function itemHTML(it, index) {
  const a = it.author;
  const meta = [a.time, a.pubAction].filter(Boolean).join(' · ');
  const tags = [it.pinned ? '<span class="dy-tag pink">置顶</span>' : '', it.visible === false ? '<span class="dy-tag">已折叠</span>' : ''].join('');
  lbGroups['m' + index] = it.images;
  if (it.forward) lbGroups['f' + index] = it.forward.images;
  const hasBody = it.text || it.title || it.images.length || it.card || it.forward;
  const fallback = !hasBody ? `<div class="dy-none">这条动态暂不支持在此显示，<a href="${esc(it.url)}" target="_blank" rel="noreferrer noopener" style="color:var(--blue)">去 B 站查看</a></div>` : '';
  const opusLink = it.type === 'DYNAMIC_TYPE_DRAW' && it.images.length ? `<a class="dy-opus-link" href="/opus?id=${esc(it.id)}">查看图文 &rsaquo;</a>` : '';
  return `<article class="dy-item" data-index="${index}">
    <div class="dy-head">
      <a class="dy-avatar" href="${esc(authorHref(a))}">${a.face ? img(a.face) : ''}</a>
      <div class="dy-author">
        <a class="dy-name" href="${esc(authorHref(a))}">${a.name || '未知用户'}</a>
        <div class="dy-sub" title="${esc(absTime(a.ts))}"><span>${esc(meta)}</span>${tags}</div>
      </div>
    </div>
    <div class="dy-body">
      ${it.dispute ? `<div class="dy-fold">${it.dispute}</div>` : ''}
      ${it.title ? `<div class="dy-title">${it.title}</div>` : ''}
      ${it.text ? `<div class="dy-text clamp">${it.text}</div><button type="button" class="dy-more" style="display:none">展开全文</button>` : ''}
      ${imagesHTML(it.images, it.extraImageCount, 'm' + index)}
      ${cardHTML(it.card, a.name)}
      ${it.forward !== undefined ? forwardHTML(it.forward, 'f' + index) : ''}
      ${fallback}
      ${opusLink}
      ${it.foldStatement ? `<div class="dy-fold" style="margin-top:8px">${it.foldStatement}</div>` : ''}
    </div>
    <div class="dy-foot">
      <button type="button" class="dy-stat" data-forward="${index}" title="转发">${IC.forward}<span>${it.stat.forward ? fmtCount(it.stat.forward) : '转发'}</span></button>
      <button type="button" class="dy-stat" data-comment="${index}" title="评论">${IC.comment}<span>${it.stat.comment ? fmtCount(it.stat.comment) : '评论'}</span></button>
      <button type="button" class="dy-stat dy-like${it.stat.liked ? ' active' : ''}" data-like="${index}" title="点赞">${IC.like}<span>${it.stat.like ? fmtCount(it.stat.like) : '点赞'}</span></button>
    </div>
    <div class="dy-comments-slot" data-slot="${index}"></div>
  </article>`;
}

// 把"超过 6 行"的正文标出来，给展开按钮
function bindClamp(root) {
  root.querySelectorAll('.dy-text.clamp').forEach(el => {
    const btn = el.nextElementSibling;
    if (!btn || !btn.classList.contains('dy-more')) return;
    if (el.scrollHeight > el.clientHeight + 2) {
      btn.style.display = '';
      btn.onclick = () => {
        const open = el.classList.toggle('clamp') === false;
        btn.textContent = open ? '收起' : '展开全文';
      };
    }
  });
}

/* ============ 数据加载 ============ */
const feedEl = document.getElementById('feed');
const stateEl = document.getElementById('feedState');
const sentinel = document.getElementById('sentinel');
let curType = 'all', offset = '', hasMore = true, loading = false, loggedIn = false, baseline = '', gen = 0;

function skeleton() {
  const one = `<div class="sk-item"><div class="sk-row"><div class="sk sk-avatar"></div><div style="flex:1"><div class="sk" style="height:14px;width:120px;margin-bottom:8px"></div><div class="sk" style="height:11px;width:80px"></div></div></div><div class="sk" style="height:14px;margin:16px 0 8px"></div><div class="sk" style="height:14px;width:70%"></div><div class="sk" style="height:150px;margin-top:14px"></div></div>`;
  return one + one;
}
function showLogin() {
  feedEl.innerHTML = '';
  stateEl.innerHTML = `<div class="dy-login"><h2>登录后查看关注的动态</h2><p>动态流需要登录 B 站账号</p><a href="/account">去登录</a></div>`;
  document.getElementById('toolbar').style.display = 'none';
}

async function load(reset) {
  if (loading) return;
  if (!reset && !hasMore) return;
  loading = true;
  const myGen = gen;
  if (reset) {
    feedEl.innerHTML = skeleton(); stateEl.innerHTML = '';
    offset = ''; hasMore = true; items = [];
    for (const k of Object.keys(lbGroups)) delete lbGroups[k];
    for (const k of Object.keys(cmHandles)) delete cmHandles[k];
  } else {
    stateEl.innerHTML = '<div class="dy-state">加载中…</div>';
  }
  try {
    const q = new URLSearchParams({ type: curType });
    if (offset) q.set('offset', offset);
    const r = await fetch('/api/dynamics?' + q);
    const d = await r.json().catch(() => ({}));
    if (myGen !== gen) return;                      // 切换了标签，丢掉过期响应
    if (r.status === 401) { loggedIn = false; showLogin(); return; }
    if (!r.ok) throw new Error(d.error || '加载失败');
    const start = items.length;
    if (reset) feedEl.innerHTML = '';
    d.list.forEach(it => items.push(it));
    feedEl.insertAdjacentHTML('beforeend', d.list.map((it, i) => itemHTML(it, start + i)).join(''));
    bindClamp(feedEl);
    offset = d.offset || '';
    hasMore = !!d.hasMore;
    if (reset && d.baseline && curType === 'all') {
      baseline = d.baseline;
      try { localStorage.setItem('bili_dyn_baseline', baseline); } catch (e) {}
      hideNewPill();
    }
    if (!items.length) stateEl.innerHTML = '<div class="dy-empty">暂时没有动态，去关注更多 UP 主吧~</div>';
    else stateEl.innerHTML = hasMore ? '' : '<div class="dy-state">已经到底啦</div>';
  } catch (e) {
    if (myGen !== gen) return;
    if (reset) feedEl.innerHTML = '';
    stateEl.innerHTML = `<div class="dy-state">${esc(e.message || '加载失败')}<br><button type="button" class="btn" id="retryBtn">重试</button></div>`;
    document.getElementById('retryBtn').onclick = () => load(reset);
  } finally {
    if (myGen === gen) loading = false;
  }
}

function reload() { gen++; loading = false; load(true); window.scrollTo({ top: 0 }); }

document.querySelectorAll('.dy-tab').forEach(btn => btn.addEventListener('click', () => {
  if (btn.dataset.type === curType) return;
  curType = btn.dataset.type;
  document.querySelectorAll('.dy-tab').forEach(b => b.classList.toggle('active', b === btn));
  reload();
}));
const refreshBtn = document.getElementById('refreshBtn');
refreshBtn.addEventListener('click', async () => {
  refreshBtn.classList.add('spin');
  reload();
  setTimeout(() => refreshBtn.classList.remove('spin'), 800);
});

// 滚到底自动加载下一页
new IntersectionObserver((es) => { if (es[0].isIntersecting && loggedIn && !loading) load(false); }, { rootMargin: '500px' }).observe(sentinel);

/* ============ 新动态提示 ============ */
const newPill = document.getElementById('newPill');
function hideNewPill() { newPill.classList.remove('show'); }
newPill.addEventListener('click', () => { hideNewPill(); reload(); });
async function checkUpdate() {
  if (!loggedIn || !baseline || curType !== 'all' || document.hidden) return;
  try {
    const r = await fetch('/api/dynamics/update?baseline=' + encodeURIComponent(baseline));
    const d = await r.json();
    if (r.ok && d.updateNum > 0) { newPill.textContent = `有 ${d.updateNum > 99 ? '99+' : d.updateNum} 条新动态，点击刷新`; newPill.classList.add('show'); }
  } catch (e) {}
}
setInterval(checkUpdate, 60000);

/* ============ 点赞 ============ */
feedEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-like]');
  if (!btn) return;
  const it = items[Number(btn.dataset.like)];
  if (!it || btn.classList.contains('busy')) return;
  const want = !it.stat.liked;
  const apply = (liked) => {
    it.stat.like = Math.max(0, it.stat.like + (liked ? 1 : -1));
    it.stat.liked = liked;
    btn.classList.toggle('active', liked);
    btn.querySelector('span').textContent = it.stat.like ? fmtCount(it.stat.like) : '点赞';
  };
  apply(want);                                      // 乐观更新，失败再回滚
  btn.classList.add('busy');
  try {
    const r = await fetch('/api/dynamics/like', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dynId: it.id, like: want }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      apply(!want);
      showToast(d.error || (want ? '点赞失败' : '取消点赞失败'));
      if (r.status === 401) setTimeout(() => location.href = '/account', 1200);
    }
  } catch (err) { apply(!want); showToast('网络异常，请重试'); }
  finally { btn.classList.remove('busy'); }
});

/* ============ 转发（先只保留接口） ============ */
// 服务端 POST /api/dynamics/forward 目前固定返回 501；等真的要做转发弹窗时，在这里弹出输入框再把 content 一并提交即可。
async function forwardDynamic(it) {
  try {
    const r = await fetch('/api/dynamics/forward', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dynId: it.id, content: '' }) });
    const d = await r.json().catch(() => ({}));
    showToast(d.error || '转发成功');
  } catch (e) { showToast('转发功能暂未开放'); }
}
feedEl.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-forward]');
  if (btn) forwardDynamic(items[Number(btn.dataset.forward)]);
});

/* ============ 评论：点"评论"在这条动态下面展开（评论面板见 /dyn-comments.js） ============ */
const cmHandles = {};   // 动态 index -> 面板句柄
feedEl.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-comment]');
  if (!btn) return;
  const index = Number(btn.dataset.comment);
  const it = items[index];
  const slot = feedEl.querySelector(`[data-slot="${index}"]`);
  if (!it || !slot) return;
  if (cmHandles[index]) {                         // 已展开 -> 收起
    cmHandles[index].destroy(); delete cmHandles[index]; btn.classList.remove('open'); return;
  }
  btn.classList.add('open');
  cmHandles[index] = DynComments.mount(slot, {
    oid: it.comment.oid, type: it.comment.type, myMid, toast: showToast,
    onCountDelta: (d) => {
      it.stat.comment = Math.max(0, it.stat.comment + d);
      btn.querySelector('span').textContent = it.stat.comment ? fmtCount(it.stat.comment) : '评论';
    },
  });
});

/* ============ 配图大图（共享 lightbox.js；评论附图由评论面板自己绑定） ============ */
BiliLightbox.bind(feedEl, '.dy-img[data-lb]', (el) => ({
  list: (lbGroups[el.dataset.lb] || []).map(i => i.url), index: Number(el.dataset.i),
}));

/* ============ 入口 ============ */
(async function init() {
  let m = { loggedIn: false };
  try { const r = await fetch('/api/me'); m = await r.json(); } catch (e) {}
  applyHeaderLogin(m);
  loggedIn = !!m.loggedIn;
  myMid = Number(m.user && m.user.mid) || 0;
  if (!loggedIn) { showLogin(); return; }
  load(true);
})();
</script>
<script src="/msg-badge.js" defer></script>
</body>
</html>
