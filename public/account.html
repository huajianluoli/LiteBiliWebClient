<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的 - B站视频搜索器</title>
<style>
  :root {
    --pink: #FB7299;
    --pink-dark: #E4547E;
    --blue: #00A1D6;
    --bg: #F1F2F3;
    --card: #FFFFFF;
    --text: #18191C;
    --text-2: #61666D;
    --text-3: #9499A0;
    --border: #E3E5E7;
    --shadow: 0 2px 12px rgba(0,0,0,.05);
    --radius: 10px;
    --header-h: 64px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
      "Segoe UI", Roboto, sans-serif;
  }
  a { color: inherit; text-decoration: none; }

  /* ============ 顶栏（与 search.html 一致，固定为"滚动后"的不透明样式） ============ */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    height: var(--header-h);
    background: #fff;
    color: var(--text);
    box-shadow: 0 1px 8px rgba(0, 0, 0, .06);
  }
  .header-inner {
    max-width: 1400px;
    height: 100%;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .logo {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    white-space: nowrap;
    user-select: none;
    color: var(--pink);
  }
  .logo-svg { display: block; height: 28px; width: auto; }

  .top-nav { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .top-nav-item {
    display: inline-flex;
    align-items: center;
    height: 32px;
    padding: 0 12px;
    border: none;
    background: none;
    border-radius: 8px;
    color: inherit;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
    opacity: .9;
  }
  .top-nav-item:hover { background: rgba(0, 0, 0, .05); opacity: 1; }
  .top-nav-item.active { opacity: 1; font-weight: 650; }

  .search-wrap {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    max-width: 480px;
    margin: 0 auto;
  }
  .search-box {
    display: flex;
    width: 100%;
    height: 40px;
    background: var(--bg);
    border-radius: 20px;
    overflow: hidden;
  }
  .search-box input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    padding: 0 18px;
    font-size: 14px;
    color: var(--text);
    background: transparent;
  }
  .search-box input::placeholder { color: var(--text-3); }
  .search-box button {
    border: none;
    background: var(--pink);
    color: #fff;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: filter .15s ease;
    flex-shrink: 0;
  }
  .search-box button:hover { filter: brightness(.94); }

  .user-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .user-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    padding: 0;
    border: none;
    background: none;
    border-radius: 50%;
    color: inherit;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s ease;
  }
  .user-icon:hover { background: rgba(0, 0, 0, .05); }
  .user-icon svg { display: block; }
  .login-btn {
    width: auto;
    height: 34px;
    padding: 0 16px;
    border-radius: 17px;
    background: var(--pink);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: filter .15s ease;
  }
  .login-btn:hover { filter: brightness(.94); }
  .avatar-btn {
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 50%;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text-2);
    font-weight: 600;
    font-size: 14px;
  }
  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .bvid-toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(24, 25, 28, .9);
    color: #fff;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 8px;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    white-space: nowrap;
  }
  .bvid-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============ 页面内容 ============ */
  .content { max-width: 1100px; margin: 0 auto; padding: 20px 24px 60px; }

  /* 个人信息卡片 */
  .hero {
    background: linear-gradient(120deg, #fff0f4 0%, #fff7f9 48%, #fff 100%);
    border: 1px solid #fbd9e2;
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 28px 32px;
    display: flex;
    align-items: center;
    gap: 22px;
    flex-wrap: wrap;
  }
  .avatar-big {
    display: block;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    object-fit: cover;
    background: #eee;
    border: 4px solid rgba(255,255,255,.9);
    box-shadow: 0 3px 15px rgba(0,0,0,.1);
  }
  .avatar-big-link {
    position: relative;
    display: inline-block;
    width: 88px;
    height: 88px;
    flex-shrink: 0;
    cursor: default;
  }
  .avatar-big-link.is-live .avatar-big { box-shadow: 0 3px 15px rgba(0,0,0,.1), 0 0 0 3px var(--pink); }
  .avatar-big-link.is-live { cursor: pointer; }
  .avatar-live-badge {
    display: none;
    position: absolute;
    left: 50%;
    bottom: -4px;
    transform: translateX(-50%);
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    background: var(--pink);
    padding: 1px 7px;
    border-radius: 8px;
    white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,.2);
  }
  .avatar-big-link.is-live .avatar-live-badge { display: block; }
  .hero-main { min-width: 0; flex: 1 1 260px; }
  .hero-name { font-size: 22px; font-weight: 700; }
  .hero-badges { display: inline-flex; gap: 6px; margin-left: 8px; vertical-align: middle; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--pink);
    color: #fff;
  }
  .badge.level { background: var(--blue); }
  .hero-sign {
    margin-top: 6px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-2);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-all;
  }
  .hero-stats { display: flex; gap: 22px; margin-top: 12px; flex-wrap: wrap; }
  .stat-block { display: flex; flex-direction: column; gap: 2px; }
  .stat-num { font-size: 16px; font-weight: 700; color: var(--text); }
  .stat-label { font-size: 12px; color: var(--text-3); }
  .hero-actions { margin-left: auto; align-self: flex-start; }
  .btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 16px;
    padding: 8px 18px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .btn:hover { border-color: var(--pink); color: var(--pink); }
  .btn.primary { background: var(--pink); border-color: var(--pink); color: #fff; }
  .btn.primary:hover { background: var(--pink-dark); border-color: var(--pink-dark); color: #fff; }
  .btn:disabled { opacity: .6; cursor: default; }
  /* 已关注：灰底 + 深灰字 */
  .btn.followed,
  .btn.followed:hover { background: #E3E5E7; border-color: #E3E5E7; color: #4E535A; }
  .btn.followed:hover { background: #D8DADD; border-color: #D8DADD; }

  /* Tabs */
  .tabs { display: flex; align-items: center; gap: 6px; margin: 22px 0 14px; flex-wrap: wrap; }
  .tab {
    border: 0;
    background: transparent;
    padding: 9px 18px;
    border-radius: 16px;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    color: var(--text-2);
    font-weight: 500;
  }
  .tab:hover { background: #fff; color: var(--pink); }
  .tab.active { background: #fff; color: var(--pink); box-shadow: var(--shadow); font-weight: 650; }
  .tab-count { font-size: 12px; font-weight: 400; color: var(--text-3); margin-left: 2px; }

  .panel {
    min-height: 300px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px 16px; }
  .card { min-width: 0; cursor: pointer; }
  .thumb { position: relative; aspect-ratio: 16/10; border-radius: 8px; overflow: hidden; background: #e7e8ea; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .18s; }
  .dur {
    position: absolute;
    right: 6px;
    bottom: 6px;
    background: rgba(0, 0, 0, .65);
    color: #fff;
    font-size: 11px;
    line-height: 1;
    padding: 3px 5px;
    border-radius: 4px;
  }
  .card:hover .thumb img { transform: scale(1.03); }
  .card:hover .title { color: var(--pink); }
  .title {
    font-size: 14px; line-height: 1.4; margin: 8px 0 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; color: var(--text);
  }
  .meta { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more-wrap { text-align: center; margin-top: 22px; }

  .chips, .fav-list { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .chip, .fav-item {
    padding: 8px 14px; border: 1px solid var(--border); border-radius: 18px;
    background: #fff; color: var(--text-2); cursor: pointer; font-size: 13px; font-family: inherit;
  }
  .chip:hover, .fav-item:hover { border-color: var(--pink); color: var(--pink); }
  .chip.active, .fav-item.active { color: #fff; background: var(--pink); border-color: var(--pink); }

  .empty, .loading { text-align: center; padding: 70px 20px; color: var(--text-3); font-size: 14px; }

  .login-wrap { max-width: 460px; margin: 55px auto; }
  .login-card {
    background: #fff; border: 1px solid var(--border); border-radius: 12px;
    padding: 34px; box-shadow: var(--shadow); text-align: center;
  }
  .login-card h2 { margin: 0 0 10px; font-size: 22px; }
  .hint { font-size: 13px; line-height: 1.7; color: var(--text-2); }
  .qr { display: block; width: 260px; height: 260px; margin: 22px auto 14px; border-radius: 6px; }
  .login-url {
    font-size: 12px; word-break: break-all; text-align: left; background: #f7f8f9;
    border-radius: 7px; padding: 10px; color: var(--text-2); display: none;
  }
  .status { min-height: 22px; color: var(--text-2); font-size: 13px; }

  @media (max-width: 900px) {
    .top-nav { display: none; }
  }
  @media (max-width: 780px) {
    .content { padding: 16px 14px 40px; }
    .hero { padding: 22px; }
    .avatar-big { width: 72px; height: 72px; }
    .hero-name { font-size: 19px; }
    .hero-actions { margin-left: 0; }
    .hero-stats { gap: 16px; }
    .grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 13px; }
    .panel { padding: 14px; }
    .qr { width: 220px; height: 220px; }
  }
  @media (max-width: 640px) {
    :root { --header-h: 56px; }
    .header-inner { padding: 0 14px; gap: 10px; }
    .logo-svg { height: 24px; }
    .user-actions { gap: 0; }
    .user-icon { width: 34px; height: 34px; }
    .user-actions .user-icon:not(.always-show) { display: none; }
  }
</style>
</head>

<script>
// —— 登录凭证：完整 B 站 cookies 存 localStorage，请求用 X-Bili-Cookie 头带给服务端 ——
// 服务端不落盘；换电脑/换服务器只要浏览器有这份 localStorage，登录态就不丢。
let _credsMem = {};
try {
  const raw = localStorage.getItem('bili_creds');
  if (raw) _credsMem = JSON.parse(raw) || {};
} catch (e) {}

function _getCreds() { return _credsMem || {}; }
function _setCreds(obj) {
  _credsMem = obj || {};
  try {
    if (obj && Object.keys(obj).length) localStorage.setItem('bili_creds', JSON.stringify(obj));
    else localStorage.removeItem('bili_creds');
  } catch (e) {}
}
function _clearCreds() { _setCreds(null); }
function _cookieHeader() {
  const c = _getCreds();
  return Object.keys(c).map(k => `${k}=${c[k]}`).join('; ');
}

const _origFetch = window.fetch.bind(window);
window.fetch = (input, opts) => {
  opts = opts || {};
  const ch = _cookieHeader();
  if (opts.headers instanceof Headers) {
    if (ch) opts.headers.set('X-Bili-Cookie', ch);
  } else {
    opts.headers = Object.assign({}, opts.headers);
    if (ch) opts.headers['X-Bili-Cookie'] = ch;
  }
  return _origFetch(input, opts);
};

// ============ 基础工具 ============
const app = document.getElementById('app');
const urlParams = new URLSearchParams(location.search);
const qMid = parseInt(urlParams.get('mid'), 10) || 0;   // ?mid=xxx 查看别人的主页；不带则是自己的主页
const qTab = urlParams.get('tab') || '';                // 自己的主页：history / fav

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtCount(n) {
  if (n == null) return '-';
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, '') + '亿';
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  return String(n);
}
function faceUrl(f) { f = String(f || ''); return f.startsWith('//') ? 'https:' + f : f; }
function fmtDur(sec) {
  const t = parseInt(sec, 10) || 0;
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
}
function fmtDate(ts) {
  const d = new Date(Number(ts) * 1000);
  if (isNaN(d.getTime())) return '';
  const mm = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() === new Date().getFullYear() ? `${mm}-${dd}` : `${d.getFullYear()}-${mm}-${dd}`;
}

let toastTimer = null;
function showToast(text) {
  const t = document.getElementById('bvidToast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ============ 顶栏 ============
document.querySelectorAll('[data-placeholder]').forEach(el => {
  el.addEventListener('click', () => showToast((el.dataset.placeholder || '该功能') + '功能开发中，敬请期待'));
});
// 登录态：未登录显示"登录"，已登录显示头像
function applyHeaderLogin(m) {
  const cur = document.getElementById('loginEntry');
  if (!cur) return;
  const a = document.createElement('a');
  a.id = 'loginEntry';
  a.href = '/account';
  if (m.loggedIn && m.user) {
    const uname = m.user.uname || '';
    a.className = 'avatar-btn';
    a.title = uname;
    if (m.user.face) {
      const img = document.createElement('img');
      img.src = faceUrl(m.user.face);
      img.referrerPolicy = 'no-referrer';
      img.alt = uname;
      a.appendChild(img);
    } else {
      a.textContent = uname.slice(0, 1) || '我';
    }
  } else {
    a.className = 'login-btn';
    a.textContent = '登录';
  }
  cur.replaceWith(a);
}

// ============ 视频卡片 ============
function card(v, o = {}) {
  const meta = [];
  if (o.author !== false && v.author) meta.push(esc(v.author));
  if (v.play != null) meta.push(Number(v.play).toLocaleString() + '播放');
  if (o.date && v.pubdate) meta.push(fmtDate(v.pubdate));
  const dur = v.duration > 0 ? `<span class="dur">${fmtDur(v.duration)}</span>` : '';
  return `<div class="card" data-bvid="${esc(v.bvid)}">
    <div class="thumb"><img src="${esc(v.pic || '')}" referrerpolicy="no-referrer" loading="lazy">${dur}</div>
    <div class="title">${esc(v.title || '')}</div>
    <div class="meta">${meta.join(' · ')}</div>
  </div>`;
}

// 在 host 里建一个"网格 + 加载更多"，返回控制器（追加卡片 / 更新"加载更多"按钮）
function makeGrid(host, cardOpts) {
  host.innerHTML = '<div class="grid"></div><div class="more-wrap"></div>';
  const g = host.querySelector('.grid'), m = host.querySelector('.more-wrap');
  const bindMore = (label, onClick) => {
    m.innerHTML = `<button class="btn">${label}</button>`;
    const b = m.querySelector('button');
    b.onclick = () => { b.disabled = true; b.textContent = '加载中…'; onClick(); };
  };
  return {
    append(list) { g.insertAdjacentHTML('beforeend', list.map(v => card(v, cardOpts)).join('')); },
    more(show, onClick) { if (show) bindMore('加载更多', onClick); else m.innerHTML = ''; },
    moreError(onClick) { bindMore('加载失败，点击重试', onClick); },
  };
}

function showPanelError(host, msg, retry) {
  host.innerHTML = `<div class="empty">${esc(msg || '加载失败')}<br>
    <button class="btn" style="margin-top:12px" id="panelRetry">重试</button></div>`;
  host.querySelector('#panelRetry').onclick = retry;
}

async function me() { const r = await fetch('/api/me'); return r.json(); }

// ============ 登录 ============
function renderLogin() {
  app.innerHTML = `<div class="login-wrap"><section class="login-card">
    <h2>登录 B 站账号</h2>
    <p class="hint">使用哔哩哔哩 App 扫描二维码登录。登录后可以同步历史记录、收藏夹，并获得个性化推荐。</p>
    <button class="btn primary" id="getQr">生成二维码</button>
    <div id="qrArea"></div>
  </section></div>`;
  document.getElementById('getQr').onclick = startQR;
}

async function startQR() {
  const btn = document.getElementById('getQr'), area = document.getElementById('qrArea');
  btn.disabled = true; btn.textContent = '正在生成…';
  area.innerHTML = '<div class="loading">正在生成登录二维码…</div>';
  try {
    const r = await fetch('/api/auth/qr'); const d = await r.json();
    if (!r.ok || !d.qr) throw new Error(d.error || '二维码生成失败');
    area.innerHTML = `<img class="qr" src="${d.qr}" alt="B站登录二维码">
      <div class="status" id="qrStatus">等待扫码…（二维码 180 秒后失效）</div>
      <div class="login-url"><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.url)}</a></div>`;
    pollQR(d.login_id);
  } catch (e) {
    area.innerHTML = `<div class="empty">${esc(e.message || '二维码生成失败')}<br>
      <button class="btn primary" style="margin-top:12px" onclick="location.reload()">重新尝试</button></div>`;
  }
}

async function pollQR(id) {
  const el = document.getElementById('qrStatus');
  for (let i = 0; i < 60; i++) {
    await new Promise(r => setTimeout(r, 3000));
    if (!document.getElementById('qrStatus')) return;
    try {
      const r = await fetch('/api/auth/poll?login_id=' + encodeURIComponent(id));
      const d = await r.json();
      if (d.status === 'waiting') el.textContent = '等待扫码…';
      else if (d.status === 'scanned') el.textContent = '已扫码，请在手机上确认登录…';
      else if (d.status === 'success') { _setCreds(d.cookies); el.textContent = '登录成功，正在进入个人中心…'; setTimeout(load, 500); return; }
      else if (d.status === 'expired') {
        el.innerHTML = '二维码已过期。<button class="btn primary" style="margin-left:8px" onclick="startQR()">重新生成</button>'; return;
      } else if (d.status === 'error') { el.textContent = d.message || '登录失败'; return; }
    } catch (e) { el.textContent = '网络请求失败，正在重试…'; }
  }
}

// ============ 主页（自己 / 别人） ============
let ctx = { mid: 0, isSelf: false, profile: null };
let panelToken = 0;   // 切换标签页后，丢弃上一个标签页还没返回的请求

const panelEl = () => document.getElementById('panel');

function statHTML(id, num, label) {
  return `<div class="stat-block"><span class="stat-num" id="${id}">${num}</span><span class="stat-label">${label}</span></div>`;
}

function setFollowBtn(btn, followed) {
  btn.classList.toggle('followed', followed);
  btn.classList.toggle('primary', !followed);
  btn.textContent = followed ? '已关注' : '关注+';
}

async function toggleFollow(btn) {
  if (btn.disabled) return;
  const followed = btn.classList.contains('followed');
  if (followed && !confirm(`确定不再关注「${ctx.profile.uname || 'TA'}」吗？`)) return;
  btn.disabled = true;
  try {
    const r = await fetch('/api/follow', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fid: ctx.mid, act: followed ? 2 : 1 }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { showToast(d.error || '操作失败'); return; }
    setFollowBtn(btn, !followed);
    if (typeof ctx.profile.follower === 'number') {
      ctx.profile.follower = Math.max(0, ctx.profile.follower + (followed ? -1 : 1));
      const el = document.getElementById('statFollower');
      if (el) el.textContent = fmtCount(ctx.profile.follower);
    }
    showToast(followed ? '已取消关注' : '关注成功');
  } catch (e) {
    showToast('网络异常，请稍后再试');
  } finally {
    btn.disabled = false;
  }
}

function addTab(key, label) {
  const tabs = document.getElementById('tabs');
  if (!tabs || tabs.querySelector(`[data-tab="${key}"]`)) return;
  const b = document.createElement('button');
  b.className = 'tab';
  b.dataset.tab = key;
  b.textContent = label;
  tabs.appendChild(b);
}

function setTabCount(key, count) {
  const b = document.querySelector(`.tab[data-tab="${key}"]`);
  if (!b || typeof count !== 'number') return;
  const label = b.dataset.label || b.textContent;
  b.dataset.label = label;
  b.innerHTML = `${esc(label)} <span class="tab-count">${fmtCount(count)}</span>`;
}

function activateTab(key) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === key));
  ({ videos: loadVideos, history: loadHistory, fav: loadFavs })[key]();
}

function renderProfile(u, isSelf) {
  ctx = { mid: Number(u.mid), isSelf, profile: u };
  const name = u.uname || 'B站用户';
  document.title = (isSelf ? '我的' : name + ' 的个人空间') + ' - B站视频搜索器';

  const stats = [
    statHTML('statMid', esc(u.mid || ''), 'UID'),
    statHTML('statFollower', fmtCount(u.follower), '粉丝数'),
    statHTML('statFollowing', fmtCount(u.following), '关注数'),
  ];
  if (isSelf) stats.push(statHTML('statCoin', fmtCount(u.coin), '硬币数'));

  app.innerHTML = `<section class="hero">
    <a class="avatar-big-link" id="avatarBigLink" href="javascript:void(0)">
      <img class="avatar-big" src="${esc(faceUrl(u.face))}" referrerpolicy="no-referrer">
      <span class="avatar-live-badge">直播中</span>
    </a>
    <div class="hero-main">
      <span class="hero-name">${esc(name)}</span>
      <span class="hero-badges">
        ${u.level != null ? `<span class="badge level">Lv.${esc(u.level)}</span>` : ''}
        ${u.vipStatus ? '<span class="badge">大会员</span>' : ''}
      </span>
      ${u.sign ? `<div class="hero-sign">${esc(u.sign)}</div>` : ''}
      <div class="hero-stats">${stats.join('')}</div>
    </div>
    <div class="hero-actions">${isSelf
      ? '<button class="btn" id="logout">退出登录</button>'
      : '<button class="btn primary" id="followBtn">关注+</button>'}</div>
  </section>
  <div class="tabs" id="tabs"></div>
  <section class="panel" id="panel"></section>`;

  if (isSelf) {
    document.getElementById('logout').onclick = async () => {
      await fetch('/api/logout', { method: 'POST' });
      _clearCreds();
      if (qMid) location.href = '/account'; else load();
    };
  } else {
    const fb = document.getElementById('followBtn');
    setFollowBtn(fb, !!u.isFollowed);
    fb.onclick = () => toggleFollow(fb);
  }

  // 卡片点击：整个面板只绑一次（事件委托）
  panelEl().addEventListener('click', (e) => {
    const c = e.target.closest('.card');
    if (c && c.dataset.bvid) location.href = '/player?bv=' + encodeURIComponent(c.dataset.bvid);
  });
  document.getElementById('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('.tab');
    if (b) activateTab(b.dataset.tab);
  });

  // 该用户是否正在直播：拿到直播间号后头像可点击直接进直播间
  (async () => {
    if (!ctx.mid) return;
    try {
      const r = await fetch(`/api/live/status?uids=${ctx.mid}`);
      const d = await r.json();
      const info = d[String(ctx.mid)];
      const link = document.getElementById('avatarBigLink');
      if (!link || !info || info.liveStatus !== 1 || !info.roomId) return;
      link.classList.add('is-live');
      link.href = `/stream?room_id=${encodeURIComponent(info.roomId)}`;
    } catch (e) {}
  })();

  // 默认显示"投稿视频"；自己的主页可通过 ?tab=history / ?tab=fav 直达
  addTab('videos', '投稿视频');
  let start = 'videos';
  if (isSelf) {
    addTab('history', '历史记录');
    addTab('fav', '收藏夹');
    if (qTab === 'history' || qTab === 'fav') start = qTab;
  } else {
    probeExtraTabs(ctx.mid);
  }
  activateTab(start);
}

// 别人的主页：先尝试访问历史记录 / 收藏夹，拿不到数据就不显示对应按钮
async function probeExtraTabs(mid) {
  const probe = async (url) => {
    try {
      const r = await fetch(url);
      if (!r.ok) return null;
      const d = await r.json();
      // 服务端会回带数据所属的 mid，校验一致才算"拿到了这个人的数据"
      return String(d.mid) === String(mid) ? d : null;
    } catch (e) { return null; }
  };
  const [h, f] = await Promise.all([
    probe(`/api/history?mid=${mid}&ps=1`),
    probe(`/api/favorites?mid=${mid}`),
  ]);
  if (ctx.mid !== mid) return;
  if (h && (h.list || []).length) addTab('history', '历史记录');
  if (f && (f.list || []).length) addTab('fav', '收藏夹');
  // addTab 追加在末尾，标签的 active 状态无需重置
}

// ---- 投稿视频 ----
const VIDEO_ORDERS = [['pubdate', '最新发布'], ['click', '最多播放'], ['stow', '最多收藏']];
let videoOrder = 'pubdate';

async function loadVideos() {
  const p = panelEl();
  const token = ++panelToken;
  p.innerHTML = `<div class="chips" id="vChips">${VIDEO_ORDERS.map(([k, l]) =>
    `<button class="chip ${k === videoOrder ? 'active' : ''}" data-order="${k}">${l}</button>`).join('')}</div>
    <div id="vBody"><div class="loading">正在加载投稿视频…</div></div>`;
  p.querySelectorAll('.chip').forEach(c => c.onclick = () => { videoOrder = c.dataset.order; loadVideos(); });
  const body = p.querySelector('#vBody');

  let pn = 0, grid = null;
  const fetchPage = async () => {
    try {
      const r = await fetch(`/api/user/${ctx.mid}/videos?pn=${pn + 1}&ps=30&order=${videoOrder}`);
      const d = await r.json();
      if (token !== panelToken) return;
      if (!r.ok) {
        if (!grid) showPanelError(body, d.error || '投稿视频加载失败', loadVideos);
        else grid.moreError(fetchPage);
        return;
      }
      pn++;
      const list = (d.list || []).filter(v => v.bvid);
      if (!grid) {
        if (!list.length) { body.innerHTML = `<div class="empty">${ctx.isSelf ? '你' : 'TA'}还没有投稿视频</div>`; return; }
        grid = makeGrid(body, { author: false, date: true });
        if (d.page) setTabCount('videos', d.page.count);
        if (d.fallback) p.querySelector('#vChips').style.display = 'none';  // 回退数据不支持排序
      }
      grid.append(list);
      grid.more(!!d.hasMore, fetchPage);
    } catch (e) {
      if (token !== panelToken) return;
      if (!grid) showPanelError(body, e.message || '投稿视频加载失败', loadVideos);
      else grid.moreError(fetchPage);
    }
  };
  fetchPage();
}

// ---- 历史记录（仅自己） ----
// 新版 cursor 接口由上一页返回 { max, view_at, business }，下一次请求原样回传即可翻下一页。
async function loadHistory() {
  const p = panelEl();
  const token = ++panelToken;
  p.innerHTML = '<div class="loading">正在加载历史记录…</div>';

  let cursor = null, grid = null;
  const fetchPage = async () => {
    const params = new URLSearchParams({ ps: '30' });
    if (cursor) {
      params.set('max', String(cursor.max));
      params.set('view_at', String(cursor.view_at));
      if (cursor.business) params.set('business', cursor.business);
    }
    try {
      const r = await fetch('/api/history?' + params.toString());
      const d = await r.json();
      if (token !== panelToken) return;
      if (!r.ok) {
        if (!grid) showPanelError(p, d.error || '加载失败', loadHistory);
        else grid.moreError(fetchPage);
        return;
      }
      const list = (d.list || []).filter(x => x.bvid);
      cursor = d.hasMore ? d.cursor : null;
      if (!grid) {
        if (!list.length && !cursor) { p.innerHTML = '<div class="empty">暂无历史记录</div>'; return; }
        grid = makeGrid(p);
      }
      grid.append(list);
      grid.more(!!cursor, fetchPage);
    } catch (e) {
      if (token !== panelToken) return;
      if (!grid) showPanelError(p, e.message || '加载失败', loadHistory);
      else grid.moreError(fetchPage);
    }
  };
  fetchPage();
}

// ---- 收藏夹（自己：全部；别人：对方公开的） ----
async function loadFavs() {
  const p = panelEl();
  const token = ++panelToken;
  p.innerHTML = '<div class="loading">正在加载收藏夹…</div>';
  try {
    const r = await fetch('/api/favorites' + (ctx.isSelf ? '' : '?mid=' + ctx.mid));
    const d = await r.json();
    if (token !== panelToken) return;
    if (!r.ok) { showPanelError(p, d.error || '加载失败', loadFavs); return; }
    if (!d.list?.length) { p.innerHTML = '<div class="empty">暂无收藏夹</div>'; return; }
    p.innerHTML = `<div class="fav-list">${d.list.map((f, i) =>
      `<button class="fav-item ${i === 0 ? 'active' : ''}" data-id="${esc(f.id)}">${esc(f.title)} <small>(${esc(f.media_count)})</small></button>`).join('')}</div>
      <div id="favContent"></div>`;
    let selected = String(d.list[0].id);
    p.querySelectorAll('.fav-item').forEach(b => b.onclick = () => {
      p.querySelectorAll('.fav-item').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      selected = b.dataset.id;
      loadFavContent(selected, () => token === panelToken && selected === b.dataset.id);
    });
    loadFavContent(selected, () => token === panelToken && selected === String(d.list[0].id));
  } catch (e) {
    if (token === panelToken) showPanelError(p, e.message || '加载失败', loadFavs);
  }
}

async function loadFavContent(id, stillCurrent) {
  const box = document.getElementById('favContent');
  if (!box) return;
  box.innerHTML = '<div class="loading">正在加载…</div>';
  try {
    const r = await fetch('/api/favorites/' + encodeURIComponent(id));
    const d = await r.json();
    if (!stillCurrent()) return;
    if (!r.ok) { box.innerHTML = `<div class="empty">${esc(d.error || '加载失败')}</div>`; return; }
    box.innerHTML = d.list?.length ? `<div class="grid">${d.list.map(v => card(v)).join('')}</div>` : '<div class="empty">这个收藏夹暂时没有视频</div>';
  } catch (e) {
    if (stillCurrent()) box.innerHTML = `<div class="empty">${esc(e.message || '加载失败')}</div>`;
  }
}

// ============ 入口 ============
async function renderOther(mid) {
  app.innerHTML = '<div class="loading">正在加载用户信息…</div>';
  try {
    const r = await fetch('/api/user/' + encodeURIComponent(mid));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '用户信息加载失败');
    renderProfile(d, false);
  } catch (e) {
    app.innerHTML = `<div class="panel"><div class="empty">${esc(e.message || '用户信息加载失败')}<br>
      <button class="btn primary" style="margin-top:12px" onclick="load()">重试</button></div></div>`;
  }
}

async function load() {
  let m = { loggedIn: false };
  try { m = await me(); } catch (e) {}
  applyHeaderLogin(m);

  const myMid = m.loggedIn ? Number(m.user?.mid) || 0 : 0;
  if (qMid && qMid !== myMid) {           // 别人的主页：不登录也能看
    renderOther(qMid);
    return;
  }
  if (!m.loggedIn) { renderLogin(); return; }
  renderProfile(m.user || {}, true);
}
load();
</script>
