<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>环境诊断 - B站视频搜索器</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:#f1f2f3; color:#18191c; margin:0; padding:16px; }
  .card { background:#fff; border:1px solid #e3e5e7; border-radius:10px; padding:16px; margin-bottom:12px; max-width:760px; }
  h2 { margin:0 0 6px; font-size:18px; }
  p { font-size:13px; line-height:1.7; color:#61666d; margin:4px 0; }
  .row { font-size:13px; line-height:1.8; font-family: Menlo, Consolas, monospace; word-break:break-all; }
  .ok { color:#00a1d6; font-weight:700; }
  .bad { color:#fb7299; font-weight:700; }
  .tiny { font-size:12px; color:#9499a0; }
  .btn { border:1px solid #e3e5e7; background:#fff; border-radius:16px; padding:8px 18px; cursor:pointer; font-size:13px; color:#18191c; }
  .btn:hover { border-color:#fb7299; color:#fb7299; }
</style>
</head>
<body>
<div class="card">
  <h2>环境诊断</h2>
  <p>在出问题的设备（如平板 WebView）上打开本页，点下方按钮，把"测试结果"区域的内容发回来，即可判断登录失败的具体原因。</p>
</div>

<div class="card">
  <h2>基本信息</h2>
  <div class="row" id="info">加载中…</div>
</div>

<div class="card">
  <h2>存储与 Cookie 能力</h2>
  <div class="row" id="cap">检查中…</div>
</div>

<div class="card">
  <h2>测试结果</h2>
  <button class="btn" id="run">运行测试</button>
  <div class="row" id="result" style="margin-top:10px">（点击按钮后显示）</div>
  <p class="tiny">说明：</p>
  <p class="tiny">· Cookie 写入 → 回读：验证该浏览器能否存放 Cookie（旧方案依赖它）；</p>
  <p class="tiny">· 令牌请求头：验证新方案（X-Bili-Session）是否可用；</p>
  <p class="tiny">· sessionStorage / localStorage：验证令牌的持久保存位置是否可用。</p>
</div>

<script>
const $ = id => document.getElementById(id);

$('info').textContent =
  "User-Agent: " + navigator.userAgent + "\n" +
  "页面地址: " + location.href + "\n" +
  "协议: " + location.protocol + "（http 且非 localhost 时，Secure Cookie 不可用，必须走令牌方案）";

function cap() {
  const lines = [];
  lines.push("cookieEnabled: " + navigator.cookieEnabled);
  try { document.cookie = "diag_probe=1"; lines.push("document.cookie 可写: " + (document.cookie.indexOf("diag_probe") >= 0)); }
  catch (e) { lines.push("document.cookie 可写: 异常 " + e.message); }
  try { sessionStorage.setItem("diag_s", "1"); lines.push("sessionStorage: 可用（" + (sessionStorage.getItem("diag_s") === "1" ? "读写正常" : "异常") + "）"); sessionStorage.removeItem("diag_s"); }
  catch (e) { lines.push("sessionStorage: 不可用 - " + e.message + "（令牌将退化为仅当前页面内存）"); }
  try { localStorage.setItem("diag_l", "1"); lines.push("localStorage: 可用（" + (localStorage.getItem("diag_l") === "1" ? "读写正常" : "异常") + "）"); localStorage.removeItem("diag_l"); }
  catch (e) { lines.push("localStorage: 不可用 - " + e.message); }
  return lines.join("\n");
}
$('cap').textContent = cap();

$('run').onclick = async () => {
  $('result').textContent = "运行中…";
  const lines = [];
  try {
    await fetch("/api/diag/set-cookie", { credentials: "same-origin" });
    const w1 = await (await fetch("/api/diag/whoami", { credentials: "same-origin" })).json();
    lines.push("① Cookie 写入 → 回读: " + (w1.cookie_received ? "成功" : "失败（被拦截/禁用，旧登录方案在此设备上必然失效）"));
  } catch (e) {
    lines.push("① Cookie 测试请求失败: " + e.message);
  }
  try {
    const w2 = await (await fetch("/api/diag/whoami", { headers: { "X-Bili-Session": "diag-token" } })).json();
    lines.push("② 令牌请求头 X-Bili-Session: " + (w2.token_received ? "成功（新登录方案依赖此通道）" : "失败"));
  } catch (e) {
    lines.push("② 令牌测试请求失败: " + e.message);
  }
  const sess = (() => { try { sessionStorage.setItem("diag_t", "1"); const v = sessionStorage.getItem("diag_t"); sessionStorage.removeItem("diag_t"); return v === "1"; } catch (e) { return false; } })();
  const loc = (() => { try { localStorage.setItem("diag_t", "1"); const v = localStorage.getItem("diag_t"); localStorage.removeItem("diag_t"); return v === "1"; } catch (e) { return false; } })();
  lines.push("③ sessionStorage: " + (sess ? "可用" : "不可用") + "，localStorage: " + (loc ? "可用" : "不可用"));
  $('result').textContent = lines.join("\n");
};
</script>
</body>
</html>
