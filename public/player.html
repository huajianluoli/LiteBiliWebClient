<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B站视频解析器</title>
    <style>
        :root {
            --header-h: 60px;
            /* 顶栏背景与顶栏图标色互为反色：深色主题 黑底 + 白图标；接入浅色主题时两者一起对调 */
            --header-bg: #000000;
            --header-icon-color: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: calc(var(--header-h) + 32px) 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            color: #ffffff;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }
        .container {
            width: 100%;
            max-width: 850px;
        }

        /* ============ 顶栏（不透明、固定，不随页面滚动） ============ */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: var(--header-h);
            background: var(--header-bg);
            border-bottom: 1px solid #1a1a1a;
            color: var(--header-icon-color);
        }
        /* 顶栏图标（右侧图标群 + 搜索按钮）统一为"与背景相反的颜色"。
           除了设置 color，还强制 stroke/fill 跟随 currentColor，避免个别 SVG 自带颜色而不一致。 */
        .site-header .user-icon svg,
        .site-header .header-search-box button svg {
            color: var(--header-icon-color);
        }
        .site-header .user-icon svg [stroke]:not([stroke="none"]),
        .site-header .header-search-box button svg [stroke]:not([stroke="none"]) {
            stroke: currentColor;
        }
        .site-header .user-icon svg [fill]:not([fill="none"]) {
            fill: currentColor;
        }
        .header-inner {
            max-width: 1400px;
            height: 100%;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .logo {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            white-space: nowrap;
            user-select: none;
            color: #FB7299;
            text-decoration: none;
        }
        .logo-svg {
            display: block;
            height: 26px;
            width: auto;
            color: #FB7299;
        }
        .logo-svg path { fill: #FB7299; }
        .top-nav {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .top-nav-item {
            display: inline-flex;
            align-items: center;
            height: 32px;
            padding: 0 12px;
            border: none;
            background: none;
            border-radius: 8px;
            color: #dddddd;
            font-size: 14px;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background .15s ease, color .15s ease;
        }
        .top-nav-item:hover {
            background: rgba(255, 255, 255, .08);
            color: #ffffff;
        }
        .top-nav-item.active {
            color: #ffffff;
            font-weight: 650;
        }
        .header-search-wrap {
            position: relative;
            flex: 1 1 auto;
            min-width: 0;
            max-width: 420px;
            margin: 0 auto;
        }
        .header-search-box {
            display: flex;
            width: 100%;
            height: 38px;
            background: #141414;
            border-radius: 19px;
            overflow: hidden;
            border: 1px solid #232323;
            transition: border-color .15s ease;
        }
        .header-search-box:focus-within {
            border-color: #3a3a3a;
        }
        .header-search-box input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            padding: 0 16px;
            font-size: 13px;
            color: #ffffff;
            background: transparent;
        }
        .header-search-box input::placeholder { color: #666666; }
        .header-search-box button {
            border: none;
            background: #FB7299;
            color: #fff;
            padding: 0 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            transition: filter .15s ease;
        }
        .header-search-box button:hover { background: #FB7299; color: #fff; filter: brightness(.94); }
        .user-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .user-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: none;
            background: none;
            border-radius: 50%;
            padding: 0;
            color: var(--header-icon-color);
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: background .15s ease, color .15s ease;
        }
        .user-icon:hover {
            background: rgba(255, 255, 255, .08);
            color: var(--header-icon-color);
        }
        .user-icon svg { display: block; }
        .login-btn {
            height: 32px;
            padding: 0 16px;
            border-radius: 16px;
            background: #FB7299;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: filter .15s ease;
        }
        .login-btn:hover { filter: brightness(.94); }
        .avatar-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 50%;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #222222;
            color: #ffffff;
            font-weight: 600;
            font-size: 13px;
            text-decoration: none;
        }
        .avatar-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ============ 原有页面内容 ============ */
        #videoTitle {
            flex: 1;
            min-width: 0;
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.4;
            color: #ffffff;
            word-break: break-all;
        }
        /* 视频发布时间（位于大标题下方） */
        .video-meta-line {
            font-size: 12px;
            color: #888888;
            margin: 0 0 10px;
            letter-spacing: .3px;
        }
        /* 视频描述区 */
        .desc-box {
            width: 100%;
            margin: 0 0 12px;
        }
        .desc-text {
            font-size: 12px;
            color: #dddddd;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .desc-text.collapsed {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .desc-toggle {
            display: inline-block;
            margin-top: 6px;
            padding: 0;
            background: none;
            border: none;
            color: #888888;
            font-size: 13px;
            cursor: pointer;
        }
        .desc-toggle:hover {
            background: none;
            color: #ffffff;
        }
        /* 播放器容器 */
        .player-wrap {
            position: relative;
            width: 100%;
        }
        #videoPlayer {
            width: 100%;
            height: 450px;
            border: 1px solid #222222;
            border-radius: 8px;
            overflow: hidden;
            background: #000000;
            display: block;
        }
        /* 听视频降级：/api/audio 失败时用 ArtPlayer 继续出声，但把画面藏起来，不占版面 */
        #videoPlayer.audio-fallback {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* ============ 听视频模式：原生 audio 播放器 ============ */
        .audio-player {
            display: none;
            width: 100%;
            height: 450px;
            border: 1px solid #222222;
            border-radius: 8px;
            background: #0a0a0a;
            box-sizing: border-box;
            padding: 28px;
            gap: 28px;
            overflow: hidden;
        }
        .audio-player.show { display: flex; }
        .audio-cover-wrap {
            flex: 0 0 auto;
            width: 320px;
            max-width: 38%;
            height: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #141414;
        }
        .audio-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .audio-main {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 22px;
        }
        .audio-title {
            margin: 0 0 12px;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .audio-up-slot .up-follow {
            margin: 0;
        }
        .audio-progress-row {
            position: relative;
            width: 100%;
            padding-top: 8px;
        }
        /* 自定义进度条（不用原生 input[type=range]）：
           页面里全局的 input{padding:12px 16px;border:1px solid #333;...} 会把原生
           range 撑成一根又粗又带边框的丑条，干脆用 div 自己画，样式完全可控。 */
        .audio-seek-track {
            position: relative;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #333333;
            cursor: pointer;
            touch-action: none;
        }
        .audio-seek-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: #FB7299;
            border-radius: 2px;
            pointer-events: none;
        }
        .audio-seek-thumb {
            position: absolute;
            top: 50%;
            left: 0%;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #FB7299;
            box-shadow: 0 0 0 3px rgba(251, 114, 153, .25);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .audio-seek-tooltip {
            position: absolute;
            top: -20px;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, .95);
            color: #ffffff;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            display: none;
            pointer-events: none;
            white-space: nowrap;
        }
        .audio-time-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #999999;
        }
        .audio-controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 26px;
        }
        /* 页面里全局的 button{padding:12px 30px;background:#fff;...} 优先级比这里的
           class 选择器低，所以背景/颜色/圆角能正常覆盖；但 padding 如果不显式清零，
           40px 的按钮会被那份 padding 撑成一个变形的大椭圆（图标看起来就跟没有一样）。
           这里把盒模型相关的属性全部显式重置一遍，不依赖"多数属性已覆盖"的侥幸。 */
        .audio-ctrl-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            flex: 0 0 auto;
            width: 40px;
            height: 40px;
            padding: 0;
            margin: 0;
            border: none;
            border-radius: 50%;
            background: transparent;
            background-color: transparent;
            color: #ffffff;
            cursor: pointer;
            transition: background .15s ease, color .15s ease, opacity .15s ease;
        }
        .audio-ctrl-btn svg { display: block; flex-shrink: 0; }
        .audio-ctrl-btn:hover { background: rgba(255, 255, 255, .08); }
        .audio-ctrl-btn:disabled,
        .audio-ctrl-btn.disabled {
            opacity: .35;
            cursor: not-allowed;
            pointer-events: none;
        }
        .audio-ctrl-btn.active { color: #FB7299; }
        .audio-play-btn {
            width: 56px;
            height: 56px;
            padding: 0;
            background: #FB7299;
            background-color: #FB7299;
            color: #ffffff;
        }
        .audio-play-btn:hover { background: #FB7299; filter: brightness(1.08); }
        /* ============ 顶栏听视频入口高亮 ============ */
        #audioModeToggleBtn.active,
        #audioModeToggleBtn.active svg {
            color: #FB7299;
        }
        /* 解析栏 */
        .parse-row {
            margin-top: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            flex-wrap: wrap;
        }
        .player-actions {
            display: none;
            gap: 8px;
            flex-shrink: 0;
        }
        .player-actions.show { display: flex; }
        .player-action-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid #292929;
            background: #141414;
            color: #ffffff;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background .15s ease, color .15s ease, border-color .15s ease;
        }
        .player-action-btn svg { flex-shrink: 0; }
        .player-action-btn:hover {
            background: #1f1f1f;
            border-color: #3a3a3a;
        }
        .player-action-btn.like.active { color: #FB7299; border-color: #FB7299; }
        .player-action-btn.coin.active { color: #FFC83D; border-color: #FFC83D; }
        .player-action-btn.fav.active { color: #00AEEC; border-color: #00AEEC; }

        /* UP 主关注组件（头像 + 名字/关注按钮） */
        .up-follow {
            display: none;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .up-follow.show { display: flex; }
        .up-avatar-link {
            display: block;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: #1a1a1a;
            border: 1px solid #222222;
            text-decoration: none;
            transition: border-color .15s ease;
        }
        .up-avatar-link:hover { border-color: #555555; }
        .up-avatar-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .up-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
            height: 40px;
            min-width: 0;
        }
        .up-name {
            font-size: 11px;
            color: #bbbbbb;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 96px;
        }
        .follow-btn {
            padding: 0 10px;
            height: 20px;
            font-size: 11px;
            font-weight: 600;
            background: #FB7299;
            color: #ffffff;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: filter .15s ease, background .15s ease, color .15s ease;
            white-space: nowrap;
        }
        .follow-btn:hover { background: #FB7299; color: #ffffff; filter: brightness(.92); }
        .follow-btn:disabled { opacity: .6; cursor: default; }
        /* 已关注：灰底 + 深灰字 */
        .follow-btn.followed,
        .follow-btn.followed:hover {
            background: #c8c8c8;
            color: #4a4a4a;
            filter: none;
        }
        .follow-btn.followed:hover { background: #d6d6d6; }

        /* 解析输入框（宽度压缩，给 UP 主关注组件让位） */
        .search-box {
            display: flex;
            gap: 12px;
            flex: 1;
            min-width: 150px;
        }
        /* 小标题 */
        .section-title {
            font-size: 13px;
            color: #666666;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        /* 选集控制栏样式 */
        .episode-box {
            display: none;
            margin-top: 25px;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        .episode-box.show {
            display: flex;
        }
        /* 分P列表 */
        .episode-list {
            display: none;
            width: 100%;
            max-height: 240px;
            overflow-y: auto;
            border: 1px solid #222222;
            border-radius: 6px;
            background: #0a0a0a;
            scrollbar-color: #333333 #000000;
        }
        .episode-list.show {
            display: block;
        }
        .episode-item {
            padding: 10px 16px;
            font-size: 14px;
            color: #aaaaaa;
            cursor: pointer;
            border-bottom: 1px solid #1a1a1a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .episode-item:last-child {
            border-bottom: none;
        }
        .episode-item:hover {
            background: #161616;
            color: #ffffff;
        }
        .episode-item.active {
            background: #ffffff;
            color: #000000;
        }
        /* 输入框 */
        input {
            flex: 1;
            padding: 12px 16px;
            background: #000000;
            border: 1px solid #333333;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #ffffff;
        }
        /* 按钮 */
        button {
            padding: 12px 30px;
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
        }
        button:hover {
            background-color: #000000;
            color: #ffffff;
        }
        /* JSON 结果展示区 */
        .json-box {
            margin-top: 25px;
            width: 100%;
        }
        #jsonOutput {
            margin: 0;
            padding: 16px;
            background: #0a0a0a;
            border: 1px solid #222222;
            border-radius: 6px;
            color: #cccccc;
            font-family: "SF Mono", Menlo, Consolas, monospace;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 260px;
            overflow-y: auto;
            scrollbar-color: #333333 #000000;
        }

        /* 强制覆盖 ArtPlayer 的部分高亮逻辑为纯白极简 */
        .art-video-player .art-control-playtime {
            color: #ffffff !important;
        }
        .art-video-player .artplayer-plugin-danmuku {
            font-family: inherit;
        }
        video::-webkit-media-controls-panel {
            background-color: rgba(0, 0, 0, 0.6);
        }
        /* 相关推荐 */
        .related-list {
            display: none;
            margin-top: 25px;
            width: 100%;
        }
        .related-list.show {
            display: block;
        }
        .related-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-color: #333333 #000000;
        }
        .related-card {
            flex: 0 0 180px;
            width: 180px;
            cursor: pointer;
        }
        .related-thumb {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 6px;
            overflow: hidden;
            background: #111111;
            border: 1px solid #222222;
        }
        .related-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .related-duration {
            position: absolute;
            right: 5px;
            bottom: 5px;
            background: rgba(0, 0, 0, .7);
            color: #ffffff;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 3px;
        }
        .related-title {
            margin: 8px 0 4px;
            font-size: 13px;
            line-height: 1.4;
            height: 2.8em;
            color: #cccccc;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            transition: color 0.15s ease;
        }
        .related-card:hover .related-title {
            color: #ffffff;
        }
        .related-meta {
            font-size: 11px;
            color: #666666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .related-card.related-skeleton {
            cursor: default;
        }
        .related-skeleton .related-thumb {
            background: linear-gradient(90deg, #111111, #1c1c1c, #111111);
            background-size: 200% 100%;
            animation: relatedShimmer 1.2s infinite;
        }
        @keyframes relatedShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .related-empty, .related-error {
            color: #555555;
            font-size: 13px;
            padding: 6px 0;
        }

        /* ============ 评论区（与其他框对齐：无外框，COMMENT 标题在框外左上角） ============ */
        .comment-list {
            display: none;
            margin-top: 25px;
            width: 100%;
        }
        .comment-list.show { display: block; }
        .comment-count {
            color: #555555;
            font-weight: 400;
            margin-left: 6px;
        }
        /* 发评论输入栏 */
        .comment-composer {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            position: relative;
        }
        .comment-composer input {
            flex: 1;
            min-width: 0;
        }
        .comment-composer button {
            flex-shrink: 0;
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 评论滚动区（带边框，视觉上与 JSON 框内层一致） */
        .comment-scroll {
            max-height: 460px;
            overflow-y: auto;
            border: 1px solid #222222;
            border-radius: 6px;
            background: #0a0a0a;
            padding: 4px 16px;
            scrollbar-color: #333333 #0a0a0a;
        }
        .comment-like-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            border: none;
            background: none;
            padding: 0;
            color: #666666;
            font-size: 12px;
            cursor: pointer;
            transition: color .15s ease;
        }
        .comment-like-btn:hover { color: #aaaaaa; background: none; }
        .comment-like-btn.active { color: #FB7299; }
        /* 子回复点赞（SVG 风格，与主评论一致） */
        .sub-reply-like-btn {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            border: none;
            background: none;
            padding: 0;
            color: #666666;
            font-size: 11px;
            margin-left: 6px;
            cursor: pointer;
            vertical-align: middle;
            transition: color .15s ease;
        }
        .sub-reply-like-btn svg { flex-shrink: 0; display: block; }
        .sub-reply-like-btn:hover { color: #aaaaaa; background: none; }
        .sub-reply-like-btn.active { color: #FB7299; }
        .comment-item {
            display: flex;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid #1a1a1a;
        }
        .comment-item:last-child { border-bottom: none; }
        .comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #1a1a1a;
            flex-shrink: 0;
        }
        .comment-main { flex: 1; min-width: 0; }
        .comment-user {
            font-size: 13px;
            color: #00A1D6;
            margin-bottom: 4px;
        }
        .comment-text {
            font-size: 14px;
            color: #eeeeee;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .comment-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 6px;
            font-size: 12px;
            color: #666666;
        }
        .comment-replies {
            margin-top: 10px;
            padding: 10px 12px;
            background: #0d0d0d;
            border-radius: 6px;
        }
        .sub-reply {
            font-size: 13px;
            line-height: 1.6;
            color: #bbbbbb;
            margin-bottom: 6px;
        }
        .sub-reply:last-of-type { margin-bottom: 0; }
        .sub-reply-user {
            color: #00A1D6;
            margin-right: 4px;
        }
        .sub-reply-like {
            color: #666666;
            margin-left: 6px;
            font-size: 11px;
        }
        .reply-toggle {
            margin-top: 8px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 400;
            background: transparent;
            border: 1px solid #333333;
            color: #999999;
            border-radius: 4px;
        }
        .reply-toggle:hover {
            background: transparent;
            color: #ffffff;
            border-color: #666666;
        }
        /* 评论里的用户名 / 头像可点进主页 */
        .comment-user a, .sub-reply-user a {
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }
        .comment-user a:hover, .sub-reply-user a:hover { text-decoration: underline; }
        .comment-avatar-link { flex-shrink: 0; line-height: 0; }
        /* 评论正文：点击进入回复模式 */
        .comment-text { cursor: pointer; }
        .comment-text:hover { color: #dddddd; }
        /* 评论里的表情图 */
        .comment-emoji {
            width: 1.5em;
            height: 1.5em;
            vertical-align: -0.35em;
            margin: 0 1px;
        }
        .comment-emoji.big { width: 2.2em; height: 2.2em; }
        /* 评论里的附图 */
        .comment-pics {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .comment-pic {
            max-width: 220px;
            max-height: 200px;
            border-radius: 6px;
            border: 1px solid #222222;
            cursor: zoom-in;
            background: #0d0d0d;
        }
        /* 删除自己评论的垃圾桶 */
        .comment-del-btn {
            display: inline-flex;
            align-items: center;
            border: none;
            background: none;
            padding: 2px;
            color: #666666;
            cursor: pointer;
            transition: color .15s ease;
        }
        .comment-del-btn:hover { color: #FB7299; background: none; }
        .sub-reply .comment-del-btn { margin-left: 6px; }
        /* 回复某人时的提示条 */
        .reply-bar {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #999999;
            background: #0d0d0d;
            border: 1px solid #222222;
            border-radius: 6px;
            padding: 5px 10px;
            margin-bottom: 8px;
        }
        .reply-bar b { color: #00A1D6; font-weight: 400; }
        .reply-cancel {
            margin-left: auto;
            cursor: pointer;
            color: #666666;
            font-size: 14px;
        }
        .reply-cancel:hover { color: #fff; }
        /* 表情按钮 + 悬浮表情面板 */
        .emote-btn {
            flex-shrink: 0;
            width: 34px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            line-height: 1;
        }
        .emote-panel {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0;
            width: 340px;
            max-height: 280px;
            overflow-y: auto;
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 10px;
            z-index: 50;
            box-shadow: 0 6px 24px rgba(0,0,0,.5);
        }
        .emote-pkg-name {
            font-size: 11px;
            color: #777777;
            margin: 6px 2px 4px;
        }
        .emote-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
        }
        .emote-item {
            width: 34px;
            height: 34px;
            padding: 3px;
            border-radius: 4px;
            cursor: pointer;
            object-fit: contain;
        }
        .emote-item:hover { background: #2a2a2a; }
        .emote-loading { font-size: 12px; color: #777; padding: 10px; text-align: center; }
        /* 评论区底部提示：登录提示 / 加载中 / 没有更多 / 失败重试 */
        .comment-footer {
            text-align: center;
            padding: 14px 0 10px;
            font-size: 13px;
            color: #666666;
        }
        .comment-footer a { color: inherit; text-decoration: none; cursor: pointer; }
        .comment-footer.login,
        .comment-footer.login a { color: #FB7299; }
        .comment-footer.login a:hover { text-decoration: underline; }
        .comment-footer.error a { color: #aaaaaa; }
        .comment-footer.error a:hover { color: #ffffff; }
        .comment-empty, .comment-error {
            color: #555555;
            font-size: 13px;
            padding: 6px 0;
        }
        .comment-skeleton {
            height: 60px;
            border-radius: 6px;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #111111, #1c1c1c, #111111);
            background-size: 200% 100%;
            animation: relatedShimmer 1.2s infinite;
        }

        /* ============ 响应式 ============ */
        @media (max-width: 900px) {
            .top-nav { display: none; }
            .header-search-wrap { display: none; }
        }
        @media (max-width: 640px) {
            :root { --header-h: 56px; }
            body { padding: calc(var(--header-h) + 20px) 14px 40px; }
            .header-inner { padding: 0 14px; gap: 10px; }
            .logo-svg { height: 22px; }
            .user-actions { gap: 0; }
            .user-icon { width: 32px; height: 32px; }
            .user-actions .user-icon:not(.always-show) { display: none; }
            .avatar-btn { width: 30px; height: 30px; }
            #videoPlayer { height: 260px; }
            .audio-player { flex-direction: column; height: auto; padding: 18px; gap: 16px; }
            .audio-cover-wrap { width: 100%; max-width: 100%; height: 180px; }
            .audio-main { gap: 14px; }
            .audio-title { font-size: 17px; }
            .audio-controls-row { gap: 18px; }
        }
    </style>
