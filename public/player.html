    <script>
        // —— 主题切换接口（暂未接入设置页，先留好） ——
        window.setTheme = function(theme) {
            // 目前只实现了深色主题；后续在设置页中接入 light 主题时，在这里扩展 CSS 变量即可。
            document.documentElement.setAttribute('data-theme', theme || 'dark');
            try { localStorage.setItem('bili_theme', theme || 'dark'); } catch (e) {}
        };
        (function initTheme() {
            let saved = 'dark';
            try { saved = localStorage.getItem('bili_theme') || 'dark'; } catch (e) {}
            window.setTheme(saved);
        })();

        // —— 登录凭证：完整 B 站 cookies 存 localStorage，请求时用 X-Bili-Cookie 头带给服务端 ——
        // 服务端不落盘，换电脑/换服务器只要浏览器有这份 localStorage，登录态就不丢。
        let _credsMem = {};
        try {
            const raw = localStorage.getItem('bili_creds');
            if (raw) _credsMem = JSON.parse(raw) || {};
        } catch (e) {}

        function _getCreds() { return _credsMem || {}; }
        function _setCreds(obj) {
            _credsMem = obj || {};
            try {
                if (obj && Object.keys(obj).length) localStorage.setItem('bili_creds', JSON.stringify(obj));
                else localStorage.removeItem('bili_creds');
            } catch (e) {}
        }
        function _clearCreds() { _setCreds(null); }
        function _cookieHeader() {
            const c = _getCreds();
            return Object.keys(c).map(k => `${k}=${c[k]}`).join('; ');
        }

        const _origFetch = window.fetch.bind(window);
        window.fetch = (input, opts) => {
            opts = opts || {};
            const ch = _cookieHeader();
            if (opts.headers instanceof Headers) {
                if (ch) opts.headers.set('X-Bili-Cookie', ch);
            } else {
                opts.headers = Object.assign({}, opts.headers);
                if (ch) opts.headers['X-Bili-Cookie'] = ch;
            }
            return _origFetch(input, opts);
        };

        // —— 简单 toast ——
        function showToast(text) {
            let t = document.getElementById('__toast');
            if (!t) {
                t = document.createElement('div');
                t.id = '__toast';
                t.style.cssText = 'position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);background:rgba(24,25,28,.92);color:#fff;font-size:14px;padding:10px 18px;border-radius:8px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;white-space:nowrap;';
                document.body.appendChild(t);
            }
            t.textContent = text;
            requestAnimationFrame(() => {
                t.style.opacity = '1';
                t.style.transform = 'translateX(-50%) translateY(0)';
            });
            clearTimeout(t.__timer);
            t.__timer = setTimeout(() => {
                t.style.opacity = '0';
                t.style.transform = 'translateX(-50%) translateY(20px)';
            }, 1800);
        }

        // —— 顶栏：搜索表单 ——
        document.getElementById('headerSearchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const kw = document.getElementById('headerKeyword').value.trim();
            if (!kw) return;
            location.href = '/search?kw=' + encodeURIComponent(kw);
        });

        // —— 顶栏：占位按钮 toast ——
        document.querySelectorAll('.site-header [data-placeholder]').forEach(el => {
            el.addEventListener('click', () => {
                showToast((el.dataset.placeholder || '该功能') + '功能开发中，敬请期待');
            });
        });

        // —— 顶栏：登录态检测（结果同时供评论区 / 关注按钮使用） ——
        let isLoggedIn = false;
        let myMid = 0;
        const authReady = (async function checkHeaderLogin() {
            try {
                const r = await fetch('/api/me');
                const d = await r.json();
                if (d.loggedIn && d.user) {
                    isLoggedIn = true;
                    myMid = Number(d.user.mid) || 0;
                    const loginEntry = document.getElementById('loginEntry');
                    if (!loginEntry) return;
                    const face = d.user.face || '';
                    const uname = d.user.uname || '';
                    const a = document.createElement('a');
                    a.className = 'avatar-btn';
                    a.href = '/account';
                    a.title = uname;
                    if (face) {
                        const img = document.createElement('img');
                        img.src = face.startsWith('//') ? 'https:' + face : face;
                        img.referrerPolicy = 'no-referrer';
                        img.alt = uname;
                        a.appendChild(img);
                    } else {
                        a.textContent = uname.slice(0, 1) || '我';
                    }
                    loginEntry.replaceWith(a);
                }
            } catch (e) {}
        })();

        let currentPage = 1;

        // 登录后把直链播放器的播放进度同步回 B 站历史。
        let historyState = { aid: 0, cid: 0, lastSent: 0, finished: false };

        async function sendHistoryHeartbeat(finished = false) {
            if (!historyState.aid || !historyState.cid || !art || !art.video) return;
            const t = Math.floor(art.video.currentTime || 0);
            if (!finished && t <= 0) return;
            if (!finished && t - historyState.lastSent < 15) return;
            historyState.lastSent = t;

            try {
                await fetch('/api/history/heartbeat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        aid: historyState.aid,
                        cid: historyState.cid,
                        played_time: t,
                        finished: finished
                    }),
                    keepalive: finished
                });
            } catch (e) {}
        }

        let currentAid = 0;
        let currentBvid = '';
        let currentCid = 0;
        let currentVideoPic = '';
        let currentPagesList = [];
        let videoStat = { like: null, coin: null, favorite: null };
        let videoRelation = { liked: false, coin: 0, favorite: false };

        // 当前 UP 主信息（用于关注按钮跳转/关注）
        let currentUpMid = 0;

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // 统一的时间格式化：YYYY-MM-DD HH:mm
        function formatDateTime(ts) {
            if (ts == null || ts === '') return '';
            let d;
            if (typeof ts === 'number') d = new Date(ts * 1000);
            else if (/^\d+$/.test(String(ts))) d = new Date(Number(ts) * 1000);
            else d = new Date(ts);
            if (isNaN(d.getTime())) return '';
            const y = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            const hh = String(d.getHours()).padStart(2, '0');
            const mi = String(d.getMinutes()).padStart(2, '0');
            return `${y}-${mm}-${dd} ${hh}:${mi}`;
        }

        function renderEpisodeBox(pages, activePage) {
            const episodeBox = document.getElementById('episodeBox');
            const episodeList = document.getElementById('episodeList');

            if (!pages || pages.length <= 1) {
                episodeBox.classList.remove('show');
                episodeList.classList.remove('show');
                episodeList.innerHTML = '';
                return;
            }

            episodeBox.classList.add('show');
            episodeList.classList.add('show');

            episodeList.innerHTML = '';
            pages.forEach((item) => {
                const el = document.createElement('div');
                el.className = 'episode-item' + (item.page === activePage ? ' active' : '');
                el.textContent = `P${item.page}  ${item.part}`;
                el.onclick = () => {
                    currentPage = item.page;
                    startPlay();
                };
                episodeList.appendChild(el);
            });
        }

        function toggleDesc() {
            const descText = document.getElementById('descText');
            const descToggle = document.getElementById('descToggle');
            const collapsed = descText.classList.toggle('collapsed');
            descToggle.textContent = collapsed ? '展开' : '收起';
        }

        /* ----------------------------- UP 主关注 ----------------------------- */

        let upFollowed = false;

        function setFollowState(followed) {
            upFollowed = !!followed;
            const btn = document.getElementById('followBtn');
            btn.classList.toggle('followed', upFollowed);
            btn.textContent = upFollowed ? '已关注' : '关注+';
        }

        // 查询当前登录用户是否已关注该 UP 主；自己的视频不显示关注按钮。
        async function loadFollowState(mid) {
            await authReady;
            if (mid !== currentUpMid) return;
            const btn = document.getElementById('followBtn');
            if (isLoggedIn && myMid && myMid === Number(mid)) {
                btn.style.display = 'none';
                return;
            }
            if (!isLoggedIn) return;
            try {
                const res = await fetch(`/api/relation?mid=${encodeURIComponent(mid)}`);
                const d = await res.json();
                if (mid !== currentUpMid) return;
                setFollowState(!!d.following);
            } catch (e) {}
        }

        function renderUpFollow(data) {
            const box = document.getElementById('upFollow');
            const nameEl = document.getElementById('upName');
            const imgEl = document.getElementById('upAvatarImg');
            const linkEl = document.getElementById('upAvatarLink');
            const followBtn = document.getElementById('followBtn');

            if (!data || !data.author) {
                box.classList.remove('show');
                currentUpMid = 0;
                return;
            }

            const mid = data.mid || 0;
            const face = data.face || '';
            currentUpMid = mid;

            nameEl.textContent = data.author;
            nameEl.title = data.author;

            if (face) {
                imgEl.src = face.startsWith('//') ? 'https:' + face : face;
                imgEl.style.display = '';
            } else {
                imgEl.removeAttribute('src');
                imgEl.style.display = 'none';
            }

            // 点头像跳转 UP 主主页（account.html 支持通过 ?mid= 查看别人的主页）
            linkEl.href = mid ? `/account?mid=${encodeURIComponent(mid)}` : 'javascript:void(0)';
            linkEl.title = mid ? `${data.author} 的主页` : data.author;

            // 先重置为"未关注"，再异步查询真实关注状态
            followBtn.style.display = '';
            setFollowState(false);

            box.classList.add('show');
            if (mid) loadFollowState(mid);
        }

        // 关注 / 取消关注
        document.getElementById('followBtn').addEventListener('click', async () => {
            if (!currentUpMid) {
                showToast('UP 主信息不完整，无法关注');
                return;
            }
            const btn = document.getElementById('followBtn');
            if (btn.disabled) return;
            const mid = currentUpMid;
            const willFollow = !upFollowed;
            if (!willFollow) {
                const name = document.getElementById('upName').textContent;
                if (!confirm(`确定不再关注「${name}」吗？`)) return;
            }
            btn.disabled = true;
            try {
                const res = await fetch('/api/follow', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fid: mid, act: willFollow ? 1 : 2 }),
                });
                const data = await res.json().catch(() => ({}));
                if (mid !== currentUpMid) return; // 请求期间已切换到别的视频
                if (!res.ok) {
                    showToast(data.error || (willFollow ? '关注失败' : '取消关注失败'));
                    if (data.code === -101 || data.code === -111) {
                        setTimeout(() => location.href = '/account', 1500);
                    }
                    return;
                }
                setFollowState(willFollow);
                showToast(willFollow ? '关注成功' : '已取消关注');
            } catch (err) {
                showToast('操作失败：' + (err.message || '网络异常'));
            } finally {
                btn.disabled = false;
            }
        });

        /* ----------------------------- 点赞 / 投币 / 收藏 ----------------------------- */

        function renderPlayerActions() {
            const box = document.getElementById('playerActions');
            if (!currentAid) {
                box.classList.remove('show');
                return;
            }
            box.classList.add('show');
            document.getElementById('likeCount').textContent = formatRelatedCount(videoStat.like);
            document.getElementById('coinCount').textContent = formatRelatedCount(videoStat.coin);
            document.getElementById('favCount').textContent = formatRelatedCount(videoStat.favorite);
            document.getElementById('likeActionBtn').classList.toggle('active', !!videoRelation.liked);
            document.getElementById('coinActionBtn').classList.toggle('active', videoRelation.coin > 0);
            document.getElementById('favActionBtn').classList.toggle('active', !!videoRelation.favorite);
            const audioFavBtn = document.getElementById('audioFavBtn');
            if (audioFavBtn) audioFavBtn.classList.toggle('active', !!videoRelation.favorite);
        }

        async function loadVideoRelation() {
            if (!currentAid) return;
            try {
                const res = await fetch(`/api/video/relation?av=${currentAid}`);
                const data = await res.json();
                videoRelation = {
                    liked: !!data.liked,
                    coin: data.coin || 0,
                    favorite: !!data.favorite,
                };
            } catch (err) {
                videoRelation = { liked: false, coin: 0, favorite: false };
            }
            renderPlayerActions();
        }

        async function doLike() {
            if (!currentAid) return;
            const nextLiked = !videoRelation.liked;
            try {
                const res = await fetch('/api/video/like', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ aid: currentAid, bvid: currentBvid, like: nextLiked }),
                });
                const data = await res.json();
                if (!res.ok) {
                    alert(data.error || '点赞失败');
                    if (data.code === -101 || data.code === -111) {
                        setTimeout(() => location.href = '/account', 1500);
                    }
                    return;
                }
                videoRelation.liked = nextLiked;
                videoStat.like = Math.max(0, (videoStat.like || 0) + (nextLiked ? 1 : -1));
                renderPlayerActions();
            } catch (err) {
                alert('点赞失败：' + (err.message || '网络异常'));
            }
        }

        async function doCoin() {
            if (!currentAid) return;
            if (videoRelation.coin >= 2) {
                alert('已经投过 2 个硬币啦，每人最多 2 个~');
                return;
            }
            if (!_getCreds().SESSDATA) {
                alert('请先登录 B 站账号');
                location.href = '/account';
                return;
            }

            const before = videoRelation.coin;
            try {
                const res = await fetch('/api/video/coin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        aid: currentAid,
                        bvid: currentBvid,
                        multiply: 1,
                        select_like: videoRelation.liked,
                    }),
                });
                const data = await res.json();
                if (!res.ok) {
                    alert(data.error || '投币失败');
                    if (data.code === -101 || data.code === -111) {
                        setTimeout(() => location.href = '/account', 1500);
                    }
                    return;
                }

                videoRelation.coin = before + 1;
                videoStat.coin = (videoStat.coin || 0) + 1;
                renderPlayerActions();

                if (videoRelation.coin === 1) {
                    alert('已投 1 个硬币，再点一次可投第 2 个~');
                } else if (videoRelation.coin === 2) {
                    alert('已投满 2 个硬币，感谢支持！');
                }
            } catch (err) {
                alert('投币失败：' + (err.message || '网络异常'));
            }
        }

        async function doFavorite() {
            if (!currentAid) return;
            const nextFav = !videoRelation.favorite;
            try {
                const res = await fetch('/api/video/favorite', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ aid: currentAid, action: nextFav ? 'add' : 'remove' }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '收藏失败');
                videoRelation.favorite = nextFav;
                videoStat.favorite = (videoStat.favorite || 0) + (nextFav ? 1 : -1);
                renderPlayerActions();
            } catch (err) {
                alert(err.message || '收藏失败,请先登录 B 站账号');
            }
        }

        /* ----------------------------- 评论区 ----------------------------- */

        let commentNextCursor = 0;
        let commentLoading = false;
        let commentIsEnd = false;
        const commentRepliesCache = {};

        function formatCommentDate(ts) {
            return formatDateTime(ts);
        }

        function escapeRegExp(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

        const TRASH_SVG = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 7h14M10 7V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2m3 0v12a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;

        // 渲染评论正文：把 [微笑] 之类占位符换成表情图，并附上评论图片。
        function renderCommentContent(item) {
            let html = esc(item.message || '');
            const emoji = item.emoji || {};
            const names = Object.keys(emoji).sort((a, b) => b.length - a.length);
            if (names.length) {
                const re = new RegExp('\\[(' + names.map(escapeRegExp).join('|') + ')\\]', 'g');
                html = html.replace(re, (m, name) =>
                    `<img class="comment-emoji" src="${emoji[name]}" alt="${esc(name)}" loading="lazy" referrerpolicy="no-referrer" />`);
            }
            let pics = '';
            if (item.pictures && item.pictures.length) {
                pics = '<div class="comment-pics">' + item.pictures.map(p =>
                    `<img class="comment-pic" src="${esc(p.src)}" referrerpolicy="no-referrer" loading="lazy" />`
                ).join('') + '</div>';
            }
            return html + pics;
        }

        function userLinkHTML(mid, name) {
            if (!mid) return esc(name);
            return `<a href="/account?mid=${mid}">${esc(name)}</a>`;
        }

        // 子回复的点赞按钮（与主评论一致，使用 SVG 而非 emoji）
        function subReplyHTML(sub) {
            const own = myMid && Number(sub.mid) === Number(myMid);
            const delBtn = own ? `<button class="comment-del-btn" data-rpid="${sub.rpid}" title="删除这条回复">${TRASH_SVG}</button>` : '';
            return `
                <div class="sub-reply">
                    <span class="sub-reply-user">${userLinkHTML(sub.mid, sub.uname)}:</span>
                    <span class="sub-reply-text comment-text" data-rpid="${sub.rpid}" data-uname="${esc(sub.uname)}">${renderCommentContent(sub)}</span>
                    <button class="sub-reply-like-btn${sub.liked ? ' active' : ''}" data-rpid="${sub.rpid}" data-liked="${sub.liked ? '1' : '0'}">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3Zm0 0l4.5-8a2 2 0 0 1 3.5 1.5V9h4.2a2 2 0 0 1 1.97 2.3l-1.1 7A2 2 0 0 1 18.1 20H10a3 3 0 0 1-3-3v-6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                        </svg>
                        <span class="sub-reply-like-count">${formatRelatedCount(sub.like)}</span>
                    </button>
                    ${delBtn}
                </div>
            `;
        }

        function commentHTML(item) {
            const shown = (item.replies || []).slice(0, 3);
            commentRepliesCache[item.rpid] = shown;
            const hasMore = item.rcount > shown.length;

            const repliesBlock = shown.length ? `
                <div class="comment-replies" data-root="${item.rpid}" data-expanded="0">
                    <div class="sub-reply-list">${shown.map(subReplyHTML).join('')}</div>
                    ${hasMore ? `<button class="reply-toggle" data-root="${item.rpid}" data-total="${item.rcount}">展开全部 ${item.rcount} 条回复</button>` : ''}
                </div>
            ` : '';

            const own = myMid && Number(item.mid) === Number(myMid);
            const delBtn = own ? `<button class="comment-del-btn" data-rpid="${item.rpid}" title="删除这条评论">${TRASH_SVG}</button>` : '';
            const avatar = `<img class="comment-avatar" src="${esc(item.avatar)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.opacity=0" />`;
            const avatarBox = item.mid ? `<a class="comment-avatar-link" href="/account?mid=${item.mid}">${avatar}</a>` : avatar;

            return `
                <div class="comment-item">
                    ${avatarBox}
                    <div class="comment-main">
                        <div class="comment-user">${userLinkHTML(item.mid, item.uname)}</div>
                        <div class="comment-text" data-rpid="${item.rpid}" data-uname="${esc(item.uname)}">${renderCommentContent(item)}</div>
                        <div class="comment-meta">
                            <button class="comment-like-btn${item.liked ? ' active' : ''}" data-rpid="${item.rpid}" data-liked="${item.liked ? '1' : '0'}">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3Zm0 0l4.5-8a2 2 0 0 1 3.5 1.5V9h4.2a2 2 0 0 1 1.97 2.3l-1.1 7A2 2 0 0 1 18.1 20H10a3 3 0 0 1-3-3v-6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                                </svg>
                                <span class="comment-like-count-num">${formatRelatedCount(item.like)}</span>
                            </button>
                            <span class="comment-time">${formatCommentDate(item.ctime)}</span>
                            ${delBtn}
                        </div>
                        ${repliesBlock}
                    </div>
                </div>
            `;
        }

        async function toggleCommentLike(btn) {
            if (!currentAid) return;
            const rpid = btn.dataset.rpid;
            const wasLiked = btn.dataset.liked === '1';
            const nextLiked = !wasLiked;
            const countEl = btn.querySelector('.comment-like-count-num, .sub-reply-like-count');
            const prevCount = countEl ? countEl.textContent : '';
            try {
                const res = await fetch('/api/comments/like', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ aid: currentAid, rpid, like: nextLiked }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '操作失败');
                btn.dataset.liked = nextLiked ? '1' : '0';
                btn.classList.toggle('active', nextLiked);
                const rawPrev = parseInt(prevCount, 10);
                if (!isNaN(rawPrev) && countEl) {
                    countEl.textContent = formatRelatedCount(rawPrev + (nextLiked ? 1 : -1));
                }
            } catch (err) {
                alert(err.message || '点赞失败,请先登录 B 站账号');
            }
        }

        // 回复目标：点别人评论正文后，发评论变成回复那条
        let replyTarget = null; // {root, parent, uname}
        function setReplyTarget(target) {
            replyTarget = target;
            const bar = document.getElementById('replyBar');
            const input = document.getElementById('commentInput');
            if (target) {
                document.getElementById('replyBarName').textContent = '@' + target.uname;
                bar.style.display = 'flex';
                input.placeholder = '回复 @' + target.uname + '：';
                input.focus();
            } else {
                bar.style.display = 'none';
                input.placeholder = '发一条友善的评论';
            }
        }
        document.addEventListener('click', (e) => {
            if (e.target.closest('#replyCancel')) setReplyTarget(null);
        });

        async function deleteComment(btn) {
            const rpid = btn.dataset.rpid;
            if (!rpid || !currentAid) return;
            if (!confirm('确定删除这条评论吗？')) return;
            try {
                const res = await fetch('/api/comments/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ aid: currentAid, rpid }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '删除失败');
                const node = btn.closest('.comment-item') || btn.closest('.sub-reply');
                if (node) node.remove();
                showToast('已删除');
            } catch (err) {
                alert(err.message || '删除失败，请先登录');
            }
        }

        // —— 表情面板 ——
        let emotesCache = null;
        async function loadEmotes() {
            if (emotesCache) return emotesCache;
            const res = await fetch('/api/emotes');
            const data = await res.json();
            emotesCache = (data && data.list) || [];
            return emotesCache;
        }

        async function toggleEmotePanel() {
            const existing = document.getElementById('emotePanel');
            if (existing) { existing.remove(); return; }
            const composer = document.querySelector('.comment-composer');
            const panel = document.createElement('div');
            panel.id = 'emotePanel';
            panel.className = 'emote-panel';
            panel.innerHTML = '<div class="emote-loading">加载表情…</div>';
            composer.appendChild(panel);
            try {
                const list = await loadEmotes();
                if (!panel.isConnected) return;
                panel.innerHTML = list.map(pkg => `
                    <div class="emote-pkg">
                        <div class="emote-pkg-name">${esc(pkg.name)}</div>
                        <div class="emote-grid">${pkg.emojis.map(e =>
                            `<img class="emote-item" src="${esc(e.url)}" data-text="${esc(e.text)}" title="${esc(e.text)}" loading="lazy" />`
                        ).join('')}</div>
                    </div>`).join('') || '<div class="emote-loading">暂无表情</div>';
            } catch (e) {
                panel.innerHTML = '<div class="emote-loading">表情加载失败</div>';
            }
        }
        document.getElementById('emoteBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            toggleEmotePanel();
        });
        document.addEventListener('click', (e) => {
            const panel = document.getElementById('emotePanel');
            if (!panel) return;
            const item = e.target.closest('.emote-item');
            if (item) {
                const input = document.getElementById('commentInput');
                input.value += item.dataset.text;
                input.focus();
                return;
            }
            if (!e.target.closest('.comment-composer')) panel.remove();
        });

        async function sendComment() {
            if (!currentAid) { alert('请先解析一个视频'); return; }
            const input = document.getElementById('commentInput');
            const message = input.value.trim();
            if (!message) return;
            const btn = document.getElementById('sendCommentBtn');
            btn.disabled = true;
            const originalText = btn.textContent;
            btn.textContent = '发送中…';
            try {
                const res = await fetch('/api/comments/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        aid: currentAid,
                        message,
                        root: replyTarget ? replyTarget.root : '',
                        parent: replyTarget ? replyTarget.parent : '',
                    }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '发送失败');
                input.value = '';
                setReplyTarget(null);
                const scroll = document.getElementById('commentScroll');
                if (data.reply) {
                    const empty = scroll.querySelector('.comment-empty');
                    if (empty) empty.remove();
                    scroll.insertAdjacentHTML('afterbegin', commentHTML(data.reply));
                } else if (currentBvid || currentAid) {
                    loadComments('av', currentAid);
                }
            } catch (err) {
                alert(err.message || '发送失败,请先登录 B 站账号');
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }

        function commentSkeletonHTML(count) {
            return Array.from({ length: count }).map(() => `<div class="comment-skeleton"></div>`).join('');
        }

        let commentSeq = 0;         // 切换视频后丢弃过期的评论请求
        let commentFailed = false;  // 自动加载失败后停止自动重试，等用户点"重试"

        // 评论滚动区底部的提示行（始终保持在最后一个子节点）
        function setCommentFooter(kind) {
            const scroll = document.getElementById('commentScroll');
            let f = document.getElementById('commentFooter');
            if (!kind) {
                if (f) f.remove();
                return;
            }
            if (!f) {
                f = document.createElement('div');
                f.id = 'commentFooter';
            }
            f.className = 'comment-footer ' + kind;
            if (kind === 'login') f.innerHTML = '<a href="/account">登录后查看更多评论</a>';
            else if (kind === 'loading') f.textContent = '加载中…';
            else if (kind === 'end') f.textContent = '没有更多评论了';
            else if (kind === 'error') f.innerHTML = '<a id="commentRetry">加载失败，点击重试</a>';
            scroll.appendChild(f);
        }

        // 已登录时：评论区滚到底部自动加载下一页
        function maybeLoadMoreComments() {
            if (!isLoggedIn || commentLoading || commentIsEnd || commentFailed || !currentAid) return;
            const el = document.getElementById('commentScroll');
            if (el.scrollTop + el.clientHeight >= el.scrollHeight - 120) loadMoreComments();
        }

        async function loadComments(paramType, cleanId) {
            const box = document.getElementById('commentBox');
            const scroll = document.getElementById('commentScroll');
            const countEl = document.getElementById('commentCount');

            const seq = ++commentSeq;
            box.classList.add('show');
            scroll.innerHTML = commentSkeletonHTML(4);
            countEl.textContent = '';
            commentNextCursor = 0;
            commentIsEnd = false;
            commentLoading = false;
            commentFailed = false;

            try {
                const url = `/api/comments?${paramType}=${encodeURIComponent(cleanId)}&next=0`;
                // 同时等登录态，保证渲染页脚时已知道是否登录
                const [res] = await Promise.all([fetch(url), authReady]);
                const data = await res.json();
                if (seq !== commentSeq) return;

                if (!res.ok) {
                    scroll.innerHTML = `<div class="comment-error">${data.error || '评论加载失败,请稍后再试'}</div>`;
                    return;
                }

                if (!data.list || data.list.length === 0) {
                    scroll.innerHTML = `<div class="comment-empty">暂无评论,快来抢沙发吧</div>`;
                    return;
                }

                countEl.textContent = `(${formatRelatedCount(data.count)})`;
                scroll.innerHTML = data.list.map(commentHTML).join('');
                commentNextCursor = data.next;
                commentIsEnd = data.isEnd;

                if (!isLoggedIn) {
                    // 未登录：B 站只放出前几条评论
                    const hasMore = !data.isEnd || (data.count || 0) > data.list.length;
                    setCommentFooter(hasMore ? 'login' : 'end');
                } else if (commentIsEnd) {
                    setCommentFooter('end');
                } else {
                    maybeLoadMoreComments(); // 首屏没填满评论区时继续加载
                }
            } catch (err) {
                if (seq !== commentSeq) return;
                scroll.innerHTML = `<div class="comment-error">评论加载失败,请稍后再试</div>`;
            }
        }

        async function loadMoreComments() {
            if (commentLoading || commentIsEnd || !currentAid || !isLoggedIn) return;
            commentLoading = true;
            commentFailed = false;
            const seq = commentSeq;
            setCommentFooter('loading');

            try {
                const res = await fetch(`/api/comments?av=${currentAid}&next=${commentNextCursor}`);
                const data = await res.json();
                if (seq !== commentSeq) return;
                if (res.ok) {
                    if (data.list && data.list.length) {
                        setCommentFooter(null);
                        document.getElementById('commentScroll').insertAdjacentHTML('beforeend', data.list.map(commentHTML).join(''));
                        commentNextCursor = data.next;
                        commentIsEnd = data.isEnd;
                    } else {
                        commentIsEnd = true; // 空页视为到底，避免反复请求
                    }
                } else {
                    commentFailed = true;
                }
            } catch (err) {
                if (seq === commentSeq) commentFailed = true;
            } finally {
                if (seq === commentSeq) {
                    commentLoading = false;
                    if (commentFailed) setCommentFooter('error');
                    else if (commentIsEnd) setCommentFooter('end');
                    else {
                        setCommentFooter(null);
                        requestAnimationFrame(maybeLoadMoreComments);
                    }
                }
            }
        }

        document.getElementById('commentScroll').addEventListener('scroll', maybeLoadMoreComments, { passive: true });

        document.getElementById('commentScroll').addEventListener('click', async (e) => {
            if (e.target.closest('#commentRetry')) {
                loadMoreComments();
                return;
            }
            const likeBtn = e.target.closest('.comment-like-btn, .sub-reply-like-btn');
            if (likeBtn) {
                toggleCommentLike(likeBtn);
                return;
            }

            // 删除自己的评论 / 回复
            const delBtn = e.target.closest('.comment-del-btn');
            if (delBtn) {
                deleteComment(delBtn);
                return;
            }

            // 点评论正文 = 回复这条；点用户名/头像链接、点图片除外
            if (!e.target.closest('a') && !e.target.closest('.comment-pic')) {
                const textEl = e.target.closest('.comment-text');
                if (textEl && textEl.dataset.rpid) {
                    const isSub = !!textEl.closest('.sub-reply');
                    const repliesBox = textEl.closest('.comment-replies');
                    const root = isSub && repliesBox ? repliesBox.dataset.root : textEl.dataset.rpid;
                    setReplyTarget({ root, parent: textEl.dataset.rpid, uname: textEl.dataset.uname || '' });
                    return;
                }
            }

            const btn = e.target.closest('.reply-toggle');
            if (!btn || !currentAid) return;

            const root = btn.dataset.root;
            const container = btn.closest('.comment-replies');
            const listEl = container.querySelector('.sub-reply-list');
            const expanded = container.dataset.expanded === '1';

            if (expanded) {
                const original = commentRepliesCache[root] || [];
                listEl.innerHTML = original.map(subReplyHTML).join('');
                container.dataset.expanded = '0';
                btn.textContent = `展开全部 ${btn.dataset.total} 条回复`;
                return;
            }

            btn.textContent = '加载中…';
            try {
                const res = await fetch(`/api/comments/replies?av=${currentAid}&root=${encodeURIComponent(root)}&pn=1`);
                const data = await res.json();
                if (res.ok && data.list && data.list.length) {
                    listEl.innerHTML = data.list.map(subReplyHTML).join('');
                    container.dataset.expanded = '1';
                    btn.textContent = '收起';
                } else {
                    btn.textContent = `展开全部 ${btn.dataset.total} 条回复`;
                }
            } catch (err) {
                btn.textContent = `展开全部 ${btn.dataset.total} 条回复`;
            }
        });

        /* ----------------------------- 相关推荐 ----------------------------- */

        function formatRelatedCount(n) {
            if (n == null) return '';
            if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
            return String(n);
        }

        function formatRelatedDuration(sec) {
            const total = parseInt(sec, 10) || 0;
            const h = Math.floor(total / 3600);
            const m = Math.floor((total % 3600) / 60);
            const s = total % 60;
            if (h > 0) {
                return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
            return `${m}:${String(s).padStart(2, '0')}`;
        }

        function relatedSkeletonHTML(count) {
            return Array.from({ length: count }).map(() => `
                <div class="related-card related-skeleton">
                    <div class="related-thumb"></div>
                </div>
            `).join('');
        }

        function relatedCardHTML(item) {
            const safeTitle = (item.title || '').replace(/"/g, '&quot;');
            const metaParts = [];
            if (item.author) metaParts.push(item.author);
            if (item.play != null) metaParts.push(`${formatRelatedCount(item.play)}播放`);

            return `
                <div class="related-card" data-bvid="${item.bvid}">
                    <div class="related-thumb">
                        <img src="${item.pic}" loading="lazy" alt="" referrerpolicy="no-referrer" onerror="this.style.opacity=0" />
                        <span class="related-duration">${formatRelatedDuration(item.duration)}</span>
                    </div>
                    <p class="related-title" title="${safeTitle}">${item.title || ''}</p>
                    <div class="related-meta">${metaParts.join(' · ')}</div>
                </div>
            `;
        }

        async function loadRelated(paramType, cleanId) {
            const relatedBox = document.getElementById('relatedBox');
            const relatedScroll = document.getElementById('relatedScroll');

            relatedBox.classList.add('show');
            relatedScroll.innerHTML = relatedSkeletonHTML(8);

            try {
                const url = `/api/related?${paramType}=${encodeURIComponent(cleanId)}`;
                const res = await fetch(url);
                const data = await res.json();

                if (!res.ok || !data.list || data.list.length === 0) {
                    relatedScroll.innerHTML = `<div class="related-empty">暂无相关推荐</div>`;
                    return;
                }

                relatedScroll.innerHTML = data.list.map(relatedCardHTML).join('');
            } catch (err) {
                relatedScroll.innerHTML = `<div class="related-error">相关推荐加载失败,请稍后再试</div>`;
            }
        }

        document.getElementById('relatedScroll').addEventListener('click', (e) => {
            const card = e.target.closest('.related-card');
            if (!card || !card.dataset.bvid) return;

            document.getElementById('vidInput').value = card.dataset.bvid;
            currentPage = 1;
            startPlay();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        function renderDescBox(desc) {
            const descBox = document.getElementById('descBox');
            const descText = document.getElementById('descText');
            const descToggle = document.getElementById('descToggle');

            if (!desc || !desc.trim()) {
                descBox.style.display = 'none';
                descText.textContent = '';
                return;
            }

            descBox.style.display = 'block';
            descText.textContent = desc;
            descText.classList.add('collapsed');
            descToggle.textContent = '展开';
            descToggle.style.display = 'none';

            requestAnimationFrame(() => {
                const isOverflowing = descText.scrollHeight > descText.clientHeight;
                descToggle.style.display = isOverflowing ? 'inline-block' : 'none';
            });
        }

        let art = null;

        let dashAudio = null;
        let currentPlayInfo = null;   // 记住当前播放信息，供降级时使用
        let currentDanmakuList = null;
        let dashFallbackTriggered = false;

        // —— 弹幕设置持久化（localStorage）：开关 / 透明度 / 速度 / 字号 / 显示区域 / 类型屏蔽等 ——
        const DM_STORE_KEY = 'bili_danmaku_settings';
        const DM_DEFAULTS = {
            speed: 7.5,
            opacity: 0.75,
            fontSize: 20,
            margin: [10, '75%'],
            antiOverlap: true,
            synchronousPlayback: false,
            visible: true,
        };

        function sanitizeDanmakuSettings(s) {
            const o = {};
            if (!s || typeof s !== 'object') return o;
            if (typeof s.opacity === 'number' && s.opacity >= 0 && s.opacity <= 1) o.opacity = s.opacity;
            if (typeof s.speed === 'number' && s.speed > 0) o.speed = s.speed;
            if ((typeof s.fontSize === 'number' && s.fontSize > 0) ||
                (typeof s.fontSize === 'string' && s.fontSize.trim())) o.fontSize = s.fontSize;
            if (Array.isArray(s.margin) && s.margin.length === 2) o.margin = s.margin;
            if (Array.isArray(s.modes) && s.modes.every((n) => typeof n === 'number')) o.modes = s.modes;
            ['antiOverlap', 'synchronousPlayback', 'visible'].forEach((k) => {
                if (typeof s[k] === 'boolean') o[k] = s[k];
            });
            return o;
        }

        function loadDanmakuSettings() {
            try {
                const raw = localStorage.getItem(DM_STORE_KEY);
                return sanitizeDanmakuSettings(raw ? JSON.parse(raw) : null);
            } catch (e) {
                return {};
            }
        }

        // 只合并传入的字段，不会因为某次只改了一项而丢掉其它设置
        function saveDanmakuSettings(patch) {
            try {
                const merged = Object.assign({}, loadDanmakuSettings(), sanitizeDanmakuSettings(patch));
                localStorage.setItem(DM_STORE_KEY, JSON.stringify(merged));
            } catch (e) {}
        }

        function getDanmakuPlugin() {
            return art && art.plugins ? art.plugins.artplayerPluginDanmuku : null;
        }

        // 读取插件当前配置并保存。opt 为插件 config 事件带出的配置（没有则读插件的 option）
        function snapshotDanmakuSettings(opt) {
            try {
                const dm = getDanmakuPlugin();
                const src = (opt && typeof opt === 'object') ? opt : ((dm && dm.option) || {});
                const patch = {};
                ['opacity', 'speed', 'fontSize', 'margin', 'modes', 'antiOverlap', 'synchronousPlayback'].forEach((k) => {
                    if (src[k] !== undefined) patch[k] = src[k];
                });
                if (dm && typeof dm.isHide === 'boolean') patch.visible = !dm.isHide;
                saveDanmakuSettings(patch);
            } catch (e) {}
        }

        const dashAudioErrorHandler = () => fallbackToDurl('audio error');

        function destroyDashAudio() {
            if (dashAudio) {
                try { dashAudio.pause(); } catch (e) {}
                // 先摘掉错误监听再清空 src：空 src 会让旧音频元素触发 error 事件，
                // 若不在销毁前移除监听，切到下一个视频时会把新视频也误降级成 720P
                dashAudio.removeEventListener('error', dashAudioErrorHandler);
                dashAudio.src = '';
                dashAudio = null;
            }
        }

        // DASH 音频加载失败时：销毁当前播放器，用 720P 兜底从原进度继续
        function fallbackToDurl(reason) {
            if (dashFallbackTriggered) return;
            if (!currentPlayInfo || !currentPlayInfo.fallbackUrl) {
                console.warn('DASH 失败且无兜底地址，无法降级:', reason);
                return;
            }
            dashFallbackTriggered = true;

            const resumeAt = art ? art.currentTime : 0;
            const wasMuted = art ? art.muted : false;
            const prevVolume = art ? art.volume : 1;
            const wasPlaying = art ? !art.paused : false;

            console.warn('DASH 播放失败，自动降级到 720P:', reason);

            // 用 durl 重新初始化
            initPlayer(
                { url: currentPlayInfo.fallbackUrl, quality: 64, accept_quality: [], accept_description: [] },
                currentDanmakuList || []
            );

            // 恢复进度 / 音量 / 播放状态
            if (art && art.video) {
                const restore = () => {
                    try {
                        if (resumeAt > 0) art.currentTime = resumeAt;
                        art.muted = wasMuted;
                        art.volume = prevVolume;
                        if (wasPlaying) art.play().catch(() => {});
                    } catch (e) {}
                    art.video.removeEventListener('loadedmetadata', restore);
                };
                if (art.video.readyState >= 1) restore();
                else art.video.addEventListener('loadedmetadata', restore);
            }
        }

        function initPlayer(playInfo, danmakuList) {
            if (art) {
                art.destroy(false);
                art = null;
            }
            destroyDashAudio();

            // 记住本次播放信息，供 fallbackToDurl 使用
            currentPlayInfo = playInfo;
            currentDanmakuList = danmakuList || [];
            dashFallbackTriggered = false;

            const isDash = !!(playInfo.dash && playInfo.dash.video);
            // 非 DASH 时兼容两种来源：显式 url（降级时）或 fallbackUrl（纯 durl 视频）
            const videoUrl = isDash ? playInfo.dash.video : (playInfo.url || playInfo.fallbackUrl);

            const dmOpt = Object.assign({}, DM_DEFAULTS, loadDanmakuSettings());

            art = new Artplayer({
                container: '#videoPlayer',
                url: videoUrl,
                autoplay: false,
                autoSize: false,
                autoMini: false,
                setting: true,
                playbackRate: true,
                fullscreen: true,
                fullscreenWeb: true,
                pip: true,
                screenshot: true,
                theme: '#ffffff',
                moreVideoAttr: { crossOrigin: 'anonymous' },
                plugins: [
                    artplayerPluginDanmuku({
                        danmuku: currentDanmakuList,
                        ...dmOpt,
                        color: '#ffffff',
                        mode: 0,
                        heatmap: false,
                        emitter: false,
                    }),
                ],
            });

            art.on('error', (err) => {
                console.warn('播放器加载出错:', err);
                // 视频流本身失败 → 触发降级
                if (isDash) fallbackToDurl('video error');
            });

            // 清晰度选择器：数据来自 accept_quality / accept_description，一一对应
            if (Array.isArray(playInfo.accept_quality) && playInfo.accept_quality.length && art.setting) {
                const qualities = playInfo.accept_quality;
                const descs = playInfo.accept_description || [];
                art.setting.add({
                    html: '清晰度',
                    tooltip: descs[qualities.indexOf(playInfo.quality)] || '清晰度',
                    icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M9 15V9l6 3-6 3Z" fill="currentColor"/></svg>',
                    selector: qualities.map((qn, i) => ({
                        html: descs[i] || String(qn),
                        value: qn,
                        default: qn === playInfo.quality,
                    })),
                    onSelect: function (item) {
                        switchQuality(item.value);
                        return item.html;
                    },
                });
            }

            // DASH：创建隐藏的 Audio 同步音频流
            if (isDash && playInfo.dash.audio) {
                dashAudio = new Audio(playInfo.dash.audio);
                dashAudio.preload = 'auto';
                dashAudio.crossOrigin = 'anonymous';

                // 音频加载失败 → 触发降级
                dashAudio.addEventListener('error', dashAudioErrorHandler);

                art.on('play', () => {
                    if (!dashAudio) return;
                    dashAudio.currentTime = art.currentTime;
                    dashAudio.play().catch(() => {});
                });
                art.on('pause', () => {
                    if (dashAudio) dashAudio.pause();
                });
                art.on('video:seeked', () => {
                    if (dashAudio) dashAudio.currentTime = art.currentTime;
                });
                art.on('video:volumechange', () => {
                    if (!dashAudio) return;
                    dashAudio.volume = art.volume;
                    dashAudio.muted = art.muted;
                });
                art.on('video:ratechange', () => {
                    if (!dashAudio) return;
                    dashAudio.playbackRate = art.playbackRate;
                });
                art.on('video:ended', () => {
                    if (dashAudio) { dashAudio.pause(); dashAudio.currentTime = 0; }
                });

                // 额外保险：若 5 秒内音频仍未 canplay，视为加载失败
                let audioReady = false;
                dashAudio.addEventListener('canplay', () => { audioReady = true; });
                setTimeout(() => {
                    if (!audioReady && dashAudio && isDash && !dashFallbackTriggered) {
                        fallbackToDurl('audio timeout');
                    }
                }, 5000);
            }

            // 弹幕设置持久化（与之前一致）
            const applySavedVisible = () => {
                try {
                    const dm = getDanmakuPlugin();
                    if (dm && dmOpt.visible === false && !dm.isHide) dm.hide();
                } catch (e) {}
            };
            applySavedVisible();
            art.on('ready', applySavedVisible);
            art.on('artplayerPluginDanmuku:config', snapshotDanmakuSettings);
            art.on('artplayerPluginDanmuku:hide', () => saveDanmakuSettings({ visible: false }));
            art.on('artplayerPluginDanmuku:show', () => saveDanmakuSettings({ visible: true }));

            const dmRoot = art.template && art.template.$player;
            if (dmRoot) {
                let dmTimer = null;
                const scheduleSnapshot = () => {
                    clearTimeout(dmTimer);
                    dmTimer = setTimeout(() => snapshotDanmakuSettings(), 400);
                };
                ['pointerup', 'change', 'input'].forEach((ev) => dmRoot.addEventListener(ev, scheduleSnapshot));
            }

            if (art.video) {
                art.video.addEventListener('timeupdate', () => sendHistoryHeartbeat(false));
                art.video.addEventListener('ended', () => sendHistoryHeartbeat(true));
            }
        }

        // 切换清晰度：带 qn 重新请求 /api/play，重建播放器后尽量还原到原来的播放进度/播放状态
        async function switchQuality(qn) {
            if (!currentAid && !currentBvid) return;
            const resumeAt = art && art.video ? art.currentTime : 0;
            const wasPlaying = art && art.video ? !art.video.paused : false;
            try {
                const paramKey = currentBvid ? 'bv' : 'av';
                const paramVal = currentBvid || currentAid;
                const url = `/api/play?${paramKey}=${encodeURIComponent(paramVal)}&p=${currentPage || 1}&qn=${encodeURIComponent(qn)}`;
                const res = await fetch(url);
                const data = await res.json();
                if (!res.ok || data.code !== 0) throw new Error(data.message || '切换清晰度失败');

                initPlayer(data, currentDanmakuList || []);

                if (art && art.video) {
                    const restore = () => {
                        try {
                            if (resumeAt > 0) art.currentTime = resumeAt;
                            if (wasPlaying) art.play().catch(() => {});
                        } catch (e) {}
                        art.video.removeEventListener('loadedmetadata', restore);
                    };
                    if (art.video.readyState >= 1) restore();
                    else art.video.addEventListener('loadedmetadata', restore);
                }
            } catch (err) {
                alert('切换清晰度失败：' + (err.message || '未知错误'));
            }
        }

        async function fetchDanmaku(cid) {
            if (!cid) return [];
            try {
                const res = await fetch(`/api/danmaku?cid=${encodeURIComponent(cid)}`);
                if (!res.ok) return [];
                const data = await res.json();
                return Array.isArray(data.list) ? data.list : [];
            } catch (err) {
                console.warn('弹幕加载失败:', err);
                return [];
            }
        }

        /* ============================================================
         * 听视频模式（原生 <audio> 播放器）
         * 降级路径：/api/audio 请求失败、返回无直链、或 <audio> 播放报错时，
         * 一律回退到已经在后台跑着的 ArtPlayer（画面用 CSS 藏起来，只出声音）。
         * ============================================================ */
        const AUDIO_LOOP_KEY = 'bili_audio_loop_mode';
        const AUDIO_LOOP_LABELS = { random: '随机播放', single: '单曲循环', sequential: '顺序播放' };
        const AUDIO_PLAY_ICON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 5.5v13l11-6.5-11-6.5Z" fill="currentColor"/></svg>';
        const AUDIO_PAUSE_ICON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>';

        let audioModeActive = false;
        let audioEl = null;
        let audioResumeTime = 0;

        function loadAudioLoopMode() {
            try {
                const v = localStorage.getItem(AUDIO_LOOP_KEY);
                if (v === 'random' || v === 'single' || v === 'sequential') return v;
            } catch (e) {}
            return 'sequential';
        }
        function saveAudioLoopMode(mode) {
            try { localStorage.setItem(AUDIO_LOOP_KEY, mode); } catch (e) {}
        }
        let audioLoopMode = loadAudioLoopMode();

        // 复用同一个 #upFollow 节点（避免另起一套关注状态/逻辑），
        // 记住它原本挂在哪里，好在切回视频模式时挪回去。
        const upFollowEl = document.getElementById('upFollow');
        const upFollowOriginalParent = upFollowEl ? upFollowEl.parentNode : null;
        const upFollowOriginalNextSibling = upFollowEl ? upFollowEl.nextSibling : null;

        function renderAudioLoopBtn() {
            const btn = document.getElementById('audioShuffleBtn');
            if (!btn) return;
            btn.classList.toggle('active', audioLoopMode !== 'sequential');
            btn.title = AUDIO_LOOP_LABELS[audioLoopMode];
        }

        function renderAudioEpisodeButtons() {
            const prevBtn = document.getElementById('audioPrevBtn');
            const nextBtn = document.getElementById('audioNextBtn');
            if (!prevBtn || !nextBtn) return;
            const total = currentPagesList.length || 0;
            const page = currentPage || 1;
            const atFirst = total <= 1 || page <= 1;
            const atLast = total <= 1 || page >= total;
            prevBtn.disabled = atFirst;
            nextBtn.disabled = atLast;
            prevBtn.classList.toggle('disabled', atFirst);
            nextBtn.classList.toggle('disabled', atLast);
        }

        function renderAudioMeta() {
            const coverImg = document.getElementById('audioCoverImg');
            const titleEl = document.getElementById('audioTitle');
            const upSlot = document.getElementById('audioUpSlot');
            if (coverImg) coverImg.src = currentVideoPic || '';
            if (titleEl) titleEl.textContent = document.getElementById('videoTitle').textContent || '';
            if (upSlot && upFollowEl && audioModeActive && upFollowEl.parentNode !== upSlot) {
                upSlot.appendChild(upFollowEl);
            }
        }

        function formatAudioTime(sec) {
            if (!isFinite(sec) || sec < 0) sec = 0;
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${String(s).padStart(2, '0')}`;
        }

        let audioSeekDragging = false;

        function setAudioSeekVisual(ratio) {
            const pct = Math.min(1, Math.max(0, ratio)) * 100;
            const fill = document.getElementById('audioSeekFill');
            const thumb = document.getElementById('audioSeekThumb');
            if (fill) fill.style.width = pct + '%';
            if (thumb) thumb.style.left = pct + '%';
        }

        function updateAudioProgressUI() {
            if (!audioEl) return;
            const dur = audioEl.duration || 0;
            const cur = audioEl.currentTime || 0;
            if (!audioSeekDragging) setAudioSeekVisual(dur > 0 ? cur / dur : 0);
            const curEl = document.getElementById('audioCurTime');
            const durEl = document.getElementById('audioDurTime');
            if (curEl) curEl.textContent = formatAudioTime(cur);
            if (durEl) durEl.textContent = formatAudioTime(dur);
        }

        function setAudioPlayIcon(playing) {
            const btn = document.getElementById('audioPlayBtn');
            if (btn) btn.innerHTML = playing ? AUDIO_PAUSE_ICON : AUDIO_PLAY_ICON;
        }

        // 销毁旧的 audio 对象：摘掉所有监听 + 清空 src，避免残留引用 / 后台继续拉流。
        function destroyAudioPlayer() {
            if (!audioEl) return;
            try { audioEl.pause(); } catch (e) {}
            audioEl.oncanplay = null;
            audioEl.onerror = null;
            audioEl.removeAttribute('src');
            try { audioEl.load(); } catch (e) {}
            audioEl = null;
        }

        function handleAudioEnded() {
            const total = currentPagesList.length || 1;
            if (audioLoopMode === 'single') {
                if (audioEl) {
                    audioEl.currentTime = 0;
                    audioEl.play().catch(() => {});
                }
                return;
            }
            if (audioLoopMode === 'random' && total > 1) {
                let nextPage = currentPage;
                while (nextPage === currentPage) {
                    nextPage = 1 + Math.floor(Math.random() * total);
                }
                currentPage = nextPage;
                startPlay();
                return;
            }
            // 顺序播放（或随机但只有一 P）：有下一集就接着播，到头就停
            if (currentPage < total) {
                currentPage += 1;
                startPlay();
            }
        }

        function setPlayerModeUI(mode) {
            const videoPlayerEl = document.getElementById('videoPlayer');
            const audioPlayerEl = document.getElementById('audioPlayer');
            const toggleBtn = document.getElementById('audioModeToggleBtn');
            if (mode === 'audio') {
                videoPlayerEl.classList.remove('audio-fallback');
                videoPlayerEl.style.display = 'none';
                audioPlayerEl.classList.add('show');
                toggleBtn.classList.add('active');
                toggleBtn.title = '返回视频模式';
            } else {
                videoPlayerEl.style.display = '';
                videoPlayerEl.classList.remove('audio-fallback');
                audioPlayerEl.classList.remove('show');
                toggleBtn.classList.remove('active');
                toggleBtn.title = '听视频';
                if (upFollowEl && upFollowOriginalParent && upFollowEl.parentNode !== upFollowOriginalParent) {
                    upFollowOriginalParent.insertBefore(upFollowEl, upFollowOriginalNextSibling);
                }
            }
        }

        // 降级：/api/audio 拿不到直链，或原生 <audio> 播放报错 → 改用后台的 ArtPlayer 出声，画面隐藏。
        function audioFallbackToVideo(reason) {
            console.warn('听视频降级为视频静音播放:', reason);
            destroyAudioPlayer();
            document.getElementById('audioPlayer').classList.remove('show');
            const videoPlayerEl = document.getElementById('videoPlayer');
            videoPlayerEl.style.display = '';
            videoPlayerEl.classList.add('audio-fallback');
            showToast('听视频加载失败，已切换为后台播放');
            if (art && art.video) {
                try {
                    if (audioResumeTime > 0) art.currentTime = audioResumeTime;
                    art.play().catch(() => {});
                } catch (e) {}
            }
        }

        async function loadAudioForCurrent(resumeAt) {
            if (!audioModeActive) return;
            if (!currentAid && !currentBvid) return;
            destroyAudioPlayer();
            renderAudioMeta();
            renderAudioEpisodeButtons();
            renderAudioLoopBtn();
            setAudioPlayIcon(false);

            try {
                const params = new URLSearchParams();
                if (currentBvid) params.set('bvid', currentBvid);
                if (currentAid) params.set('aid', String(currentAid));
                if (currentCid) params.set('cid', String(currentCid));
                const res = await fetch(`/api/audio?${params.toString()}`);
                const data = await res.json();
                if (!res.ok || data.code !== 0 || !data.audioUrl) {
                    throw new Error(data.message || '获取音频失败');
                }

                audioEl = new Audio();
                audioEl.preload = 'auto';
                audioEl.src = `/api/audio/proxy?src=${encodeURIComponent(data.audioUrl)}`;
                audioEl.addEventListener('loadedmetadata', () => {
                    if (resumeAt > 0) {
                        try { audioEl.currentTime = resumeAt; } catch (e) {}
                    }
                    updateAudioProgressUI();
                });
                audioEl.addEventListener('timeupdate', updateAudioProgressUI);
                audioEl.addEventListener('play', () => setAudioPlayIcon(true));
                audioEl.addEventListener('pause', () => setAudioPlayIcon(false));
                audioEl.addEventListener('ended', handleAudioEnded);
                audioEl.addEventListener('error', () => {
                    if (audioModeActive) audioFallbackToVideo('audio element error');
                });

                await audioEl.play().catch(() => { setAudioPlayIcon(false); });
            } catch (err) {
                audioFallbackToVideo(err.message || 'fetch failed');
            }
        }

        function toggleAudioMode() {
            if (audioModeActive) {
                audioModeActive = false;
                audioResumeTime = audioEl ? (audioEl.currentTime || 0) : audioResumeTime;
                destroyAudioPlayer();
                setPlayerModeUI('video');
                if (art && art.video) {
                    try {
                        if (audioResumeTime > 0) art.currentTime = audioResumeTime;
                        art.play().catch(() => {});
                    } catch (e) {}
                }
            } else {
                audioModeActive = true;
                audioResumeTime = art && art.video ? art.currentTime : 0;
                if (art) { try { art.pause(); } catch (e) {} }
                setPlayerModeUI('audio');
                loadAudioForCurrent(audioResumeTime);
            }
        }

        document.getElementById('audioModeToggleBtn').addEventListener('click', toggleAudioMode);
        document.getElementById('audioPlayBtn').addEventListener('click', () => {
            if (!audioEl) return;
            if (audioEl.paused) audioEl.play().catch(() => {});
            else audioEl.pause();
        });
        document.getElementById('audioPrevBtn').addEventListener('click', () => {
            if (currentPage <= 1) return;
            currentPage -= 1;
            startPlay();
        });
        document.getElementById('audioNextBtn').addEventListener('click', () => {
            if (currentPage >= (currentPagesList.length || 1)) return;
            currentPage += 1;
            startPlay();
        });
        document.getElementById('audioShuffleBtn').addEventListener('click', () => {
            const order = ['sequential', 'random', 'single'];
            audioLoopMode = order[(order.indexOf(audioLoopMode) + 1) % order.length];
            saveAudioLoopMode(audioLoopMode);
            renderAudioLoopBtn();
            showToast('循环模式：' + AUDIO_LOOP_LABELS[audioLoopMode]);
        });
        document.getElementById('audioFavBtn').addEventListener('click', () => doFavorite());

        const audioSeekTrack = document.getElementById('audioSeekTrack');
        const audioSeekTooltip = document.getElementById('audioSeekTooltip');

        function audioSeekRatioFromEvent(e) {
            const rect = audioSeekTrack.getBoundingClientRect();
            if (!rect.width) return 0;
            return Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
        }

        audioSeekTrack.addEventListener('pointerdown', (e) => {
            audioSeekDragging = true;
            try { audioSeekTrack.setPointerCapture(e.pointerId); } catch (err) {}
            const ratio = audioSeekRatioFromEvent(e);
            setAudioSeekVisual(ratio);
            if (audioEl && audioEl.duration) {
                document.getElementById('audioCurTime').textContent = formatAudioTime(ratio * audioEl.duration);
            }
        });
        audioSeekTrack.addEventListener('pointermove', (e) => {
            if (audioSeekDragging) {
                const ratio = audioSeekRatioFromEvent(e);
                setAudioSeekVisual(ratio);
                if (audioEl && audioEl.duration) {
                    document.getElementById('audioCurTime').textContent = formatAudioTime(ratio * audioEl.duration);
                }
                return;
            }
            if (!audioEl || !audioEl.duration) return;
            const ratio = audioSeekRatioFromEvent(e);
            audioSeekTooltip.textContent = formatAudioTime(ratio * audioEl.duration);
            audioSeekTooltip.style.left = `${ratio * 100}%`;
            audioSeekTooltip.style.display = 'block';
        });
        audioSeekTrack.addEventListener('pointerup', (e) => {
            if (!audioSeekDragging) return;
            audioSeekDragging = false;
            const ratio = audioSeekRatioFromEvent(e);
            if (audioEl && audioEl.duration) {
                audioEl.currentTime = ratio * audioEl.duration;
            }
        });
        audioSeekTrack.addEventListener('pointerleave', () => {
            if (!audioSeekDragging) audioSeekTooltip.style.display = 'none';
        });

        renderAudioLoopBtn();

        async function startPlay() {
            const input = document.getElementById('vidInput').value.trim();
            const p = currentPage || 1;

            if (!input) {
                alert('请输入有效的视频号！');
                return;
            }

            let paramType = input.toLowerCase().startsWith('av') ? 'av' : 'bv';
            let cleanId = input.replace(/av/i, '');

            const apiUrl = `/api/play?${paramType}=${cleanId}&p=${p}`;
            const infoUrl = `/api/info?${paramType}=${cleanId}`;

            fetch(infoUrl)
                .then((r) => r.json())
                .then((data) => {
                    document.getElementById('videoTitle').textContent =
                        data.code === 0 ? data.title : '';

                    // 视频发布时间（需要 /api/info 返回 pubdate 字段）
                    const pubEl = document.getElementById('videoPubdate');
                    if (data.code === 0 && data.pubdate) {
                        pubEl.textContent = formatDateTime(data.pubdate);
                        pubEl.style.display = 'block';
                    } else {
                        pubEl.textContent = '';
                        pubEl.style.display = 'none';
                    }

                    renderDescBox(data.code === 0 ? data.desc : '');
                    renderEpisodeBox(data.code === 0 ? data.pages : [], p);

                    // UP 主信息（mid / face 需要 /api/info 返回；缺失时按钮仍显示但无法跳转）
                    renderUpFollow(data.code === 0 ? {
                        author: data.author,
                        mid: data.mid || data.owner?.mid || 0,
                        face: data.face || data.owner?.face || '',
                    } : null);

                    currentAid = data.code === 0 ? (data.aid || 0) : 0;
                    currentBvid = data.code === 0 ? (data.bvid || '') : '';
                    currentVideoPic = data.code === 0 ? (data.pic || '') : '';
                    currentPagesList = data.code === 0 ? (data.pages || []) : [];
                    videoStat = data.code === 0 ? (data.stat || {}) : {};
                    videoRelation = { liked: false, coin: 0, favorite: false };
                    renderPlayerActions();
                    loadVideoRelation();
                    renderAudioMeta();
                    renderAudioEpisodeButtons();
                })
                .catch(() => {
                    document.getElementById('videoTitle').textContent = '';
                    const pubEl = document.getElementById('videoPubdate');
                    pubEl.textContent = '';
                    pubEl.style.display = 'none';
                    renderDescBox('');
                    renderEpisodeBox([], p);
                    renderUpFollow(null);
                    currentAid = 0;
                    currentBvid = '';
                    currentVideoPic = '';
                    currentPagesList = [];
                    renderPlayerActions();
                    renderAudioEpisodeButtons();
                });

            loadRelated(paramType, cleanId);
            loadComments(paramType, cleanId);

            try {
                const response = await fetch(apiUrl);
                let jsonData;
                try {
                    jsonData = await response.json();
                } catch (parseErr) {
                    throw new Error(`接口返回 HTTP ${response.status}`);
                }

                document.getElementById('jsonOutput').textContent = JSON.stringify(jsonData, null, 2);

                if (jsonData.code !== 0) {
                    alert(`解析失败：${jsonData.message || '未知错误'}`);
                    return;
                }

                const hasPlayable = !!(
                    jsonData.url ||
                    jsonData.fallbackUrl ||
                    (jsonData.dash && jsonData.dash.video)
                );

                if (hasPlayable) {
                    try {
                        currentCid = Number(jsonData.cid || 0);
                        historyState = {
                            aid: Number(jsonData.aid || 0),
                            cid: Number(jsonData.cid || 0),
                            lastSent: 0,
                            finished: false
                        };
                        const danmakuList = await fetchDanmaku(jsonData.cid);
                        initPlayer(jsonData, danmakuList);
                        renderAudioEpisodeButtons();
                        if (audioModeActive) {
                            loadAudioForCurrent(0);
                        }
                    } catch (playerError) {
                        console.error('播放器初始化失败:', playerError);
                        alert('播放器初始化失败：' + playerError.message);
                    }
                } else {
                    alert('解析失败：返回结果中缺少可播放的直链');
                }
            } catch (error) {
                console.error('请求接口失败:', error);
                document.getElementById('jsonOutput').textContent = '请求失败：' + error.message;
                alert('请求解析接口失败：' + error.message);
            }
        }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const bv = params.get('bv');
            const av = params.get('av');
            const p = params.get('p');

            if (bv || av) {
                document.getElementById('vidInput').value = bv || `av${av}`;
                if (p) currentPage = parseInt(p, 10) || 1;
                startPlay();
            }
        }

        window.addEventListener('pagehide', () => {
            sendHistoryHeartbeat(false);
        });
    </script>
</body>
</html>
