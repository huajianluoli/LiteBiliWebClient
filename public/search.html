<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>B站视频搜索器</title>
<style>
  :root {
    --pink: #FB7299;
    --pink-dark: #FB7299;
    --blue: #00A1D6;
    --bg: #F1F2F3;
    --card: #FFFFFF;
    --text: #18191C;
    --text-2: #61666D;
    --text-3: #9499A0;
    --border: #E3E5E7;
    --header-h: 64px;
    --banner-h: clamp(240px, 42vh, 560px);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
      "Segoe UI", Roboto, sans-serif;
    padding-top: var(--banner-h);
  }

  a { color: inherit; text-decoration: none; }

  /* ============ 顶栏 ============ */
  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    height: var(--header-h);
    color: #fff;
    background: transparent;
    transition: background .25s ease, color .25s ease, box-shadow .25s ease;
  }
  .site-header.scrolled {
    background: #fff;
    color: var(--text);
    box-shadow: 0 1px 8px rgba(0, 0, 0, .06);
  }

  .header-inner {
    max-width: 1400px;
    height: 100%;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  /* logo：内联 SVG，fill=currentColor 跟随 header 变色 */
  .logo {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    white-space: nowrap;
    user-select: none;
    color: #fff;                   /* 未滚动：白 */
    transition: color .25s ease;
  }
  .site-header.scrolled .logo {
    color: var(--pink);            /* 滚动后：粉 */
  }
  .logo-svg {
    display: block;
    height: 28px;
    width: auto;                   /* 按 viewBox 52:24 自动算宽度 */
  }

  /* 顶部导航 */
  .top-nav {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .top-nav-item {
    display: inline-flex;
    align-items: center;
    height: 32px;
    padding: 0 12px;
    border: none;
    background: none;
    border-radius: 8px;
    color: inherit;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
    opacity: .9;
  }
  .top-nav-item:hover {
    background: rgba(255, 255, 255, .15);
    opacity: 1;
  }
  .site-header.scrolled .top-nav-item:hover {
    background: rgba(0, 0, 0, .05);
  }
  .top-nav-item.active { opacity: 1; font-weight: 650; }

  /* 搜索框 */
  .search-wrap {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    max-width: 480px;
    margin: 0 auto;
  }
  .search-box {
    display: flex;
    width: 100%;
    height: 40px;
    background: rgba(255, 255, 255, .95);
    border-radius: 20px;
    overflow: hidden;
    transition: background .2s ease, box-shadow .15s ease;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
  }
  .search-box:focus-within {
    box-shadow: 0 2px 12px rgba(0, 0, 0, .14);
  }
  .site-header.scrolled .search-box {
    background: var(--bg);
    box-shadow: none;
  }
  .search-box input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    padding: 0 18px;
    font-size: 14px;
    color: var(--text);
    background: transparent;
  }
  .search-box input::placeholder { color: var(--text-3); }
  .search-box button {
    border: none;
    background: var(--pink);
    color: #fff;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: filter .15s ease;
    flex-shrink: 0;
  }
  .search-box button:hover { filter: brightness(.94); }

  /* 搜索历史下拉 */
  .history-dropdown {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
    padding: 6px;
    display: none;
    z-index: 20;
    max-height: 300px;
    overflow-y: auto;
    text-align: left;
    color: var(--text);
  }
  .history-dropdown.show { display: block; }
  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px 8px;
    font-size: 12px;
    color: var(--text-3);
  }
  .history-clear {
    border: none;
    background: none;
    color: var(--text-3);
    font-size: 12px;
    cursor: pointer;
    padding: 0;
  }
  .history-clear:hover { color: var(--pink); }
  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
  }
  .history-item:hover { background: var(--bg); }
  .history-item:hover .history-text { color: var(--pink); }
  .history-text {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }
  .history-text svg { flex-shrink: 0; color: var(--text-3); }
  .history-remove {
    border: none;
    background: none;
    color: var(--text-3);
    font-size: 16px;
    line-height: 1;
    padding: 2px 6px;
    cursor: pointer;
    border-radius: 4px;
  }
  .history-remove:hover { color: var(--pink); }
  .history-empty {
    padding: 20px 10px;
    text-align: center;
    color: var(--text-3);
    font-size: 13px;
  }

  /* 右上角图标群 */
  .user-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .user-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border: none;
    background: none;
    border-radius: 50%;
    color: inherit;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s ease;
  }
  .user-icon:hover { background: rgba(255, 255, 255, .18); }
  .site-header.scrolled .user-icon:hover { background: rgba(0, 0, 0, .05); }
  .user-icon svg { display: block; }

  .login-btn {
    width: auto;
    height: 34px;
    padding: 0 16px;
    border-radius: 17px;
    background: var(--pink);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: filter .15s ease;
  }
  .login-btn:hover { filter: brightness(.94); }

  .avatar-btn {
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 50%;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, .2);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
  }
  .avatar-btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ============ Banner ============ */
  .banner {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: var(--banner-h);
    overflow: hidden;
    background: #d8dde2;
  }
  .banner-header-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  .banner-header-bg video,
  .banner-header-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }
  .banner-carousel {
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  .banner-slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity .6s ease;
  }
  .banner-slide.active { opacity: 1; }
  .banner-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }
  .banner-overlay {
    position: absolute;
    inset: 0 0 auto 0;
    height: 55%;
    z-index: 2;
    background: linear-gradient(to bottom, rgba(0, 0, 0, .48), rgba(0, 0, 0, 0));
    pointer-events: none;
  }
  .banner::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 32px;
    z-index: 3;
    background: linear-gradient(to bottom, rgba(241, 242, 243, 0), var(--bg));
    pointer-events: none;
  }
  .banner-dots {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    z-index: 4;
    display: none;
    gap: 8px;
  }
  .banner-dots.show { display: flex; }
  .banner-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .45);
    border: none;
    padding: 0;
    cursor: pointer;
    transition: background .2s ease, transform .2s ease;
  }
  .banner-dot:hover { background: rgba(255, 255, 255, .7); }
  .banner-dot.active {
    background: #fff;
    transform: scale(1.2);
  }

  /* ============ 内容区 ============ */
  .content {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 24px 60px;
  }

  .meta-row {
    color: var(--text-2);
    font-size: 13px;
    margin: 4px 0 16px;
    min-height: 18px;
  }
  .meta-row b { color: var(--pink); font-weight: 600; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px 16px;
  }

  .card {
    background: var(--card);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .12s ease;
    display: block;
    color: inherit;
  }
  .card:hover { transform: translateY(-3px); }
  .card:hover .title { color: var(--pink); }

  .thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #e7e8ea;
    overflow: hidden;
  }
  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb-wrap::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 40%;
    background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0));
    pointer-events: none;
  }
  .duration {
    position: absolute;
    right: 6px;
    bottom: 6px;
    background: rgba(0,0,0,.6);
    color: #fff;
    font-size: 11px;
    padding: 1px 5px;
    border-radius: 3px;
    z-index: 1;
  }
  .thumb-stats {
    position: absolute;
    left: 6px;
    bottom: 6px;
    display: flex;
    gap: 8px;
    color: #fff;
    font-size: 12px;
    z-index: 1;
  }
  .stat-item {
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .stat-item svg { flex-shrink: 0; }

  .card-body { padding: 8px 2px 6px; }
  .title {
    font-size: 14px;
    line-height: 1.4;
    height: 2.8em;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    color: var(--text);
    margin: 0 0 6px;
  }
  .title em {
    color: var(--pink);
    font-style: normal;
  }
  .author {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .author svg { flex-shrink: 0; color: var(--text-3); }
  .author span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .placeholder, .error-box {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-3);
    font-size: 14px;
  }
  .error-box { color: var(--pink); }

  .skeleton-card .thumb-wrap {
    background: linear-gradient(90deg,#eee,#f5f5f5,#eee);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
  }
  .skeleton-line { height: 12px; background: #eee; border-radius: 4px; margin-top: 8px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* 筛选栏 */
  .filter-bar {
    display: none;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    padding: 10px 0 16px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .filter-bar.show { display: flex; }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .sort-tab {
    border: none;
    background: transparent;
    color: var(--text-2);
    font-size: 14px;
    padding: 5px 12px;
    border-radius: 14px;
    cursor: pointer;
    transition: color .15s ease, background .15s ease;
    white-space: nowrap;
    font-family: inherit;
  }
  .sort-tab:hover { color: var(--pink); }
  .sort-tab.active {
    color: #fff;
    background: var(--pink);
    font-weight: 600;
  }

  /* 分页 */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 28px;
    flex-wrap: wrap;
  }
  .page-btn {
    min-width: 32px;
    height: 32px;
    padding: 0 8px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text-2);
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color .15s ease, color .15s ease;
    font-family: inherit;
  }
  .page-btn:hover:not(:disabled):not(.active) {
    border-color: var(--pink);
    color: var(--pink);
  }
  .page-btn.active {
    background: var(--pink);
    border-color: var(--pink);
    color: #fff;
    cursor: default;
  }
  .page-btn:disabled:not(.active) {
    color: var(--text-3);
    cursor: not-allowed;
    opacity: .5;
  }
  .page-ellipsis {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-3);
    font-size: 13px;
  }

  /* 推荐头 */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin: 0;
  }
  .refresh-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text-2);
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 16px;
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease;
    font-family: inherit;
  }
  .refresh-btn:hover {
    color: var(--pink);
    border-color: var(--pink);
  }
  .refresh-btn svg { transition: transform .4s ease; }
  .refresh-btn.spinning svg { transform: rotate(360deg); }
  #recommendSection { margin-bottom: 24px; }

  /* toast */
  .bvid-toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(24, 25, 28, .9);
    color: #fff;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 8px;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    white-space: nowrap;
  }
  .bvid-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .bvid-toast b { color: var(--pink); }

  /* ============ 移动端 ============ */
  @media (max-width: 900px) {
    .top-nav { display: none; }
  }

  @media (max-width: 640px) {
    :root {
      --header-h: 56px;
      --banner-h: clamp(120px, 18vh, 200px);
    }
    .header-inner { padding: 0 14px; gap: 10px; }
    .logo-svg { height: 24px; }
    .user-actions { gap: 0; }
    .user-icon { width: 34px; height: 34px; }
    .user-actions .user-icon:not(.always-show) { display: none; }
    .content { padding: 16px 14px 40px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
  }
</style>
</head>

  <div class="header-inner">

<script>
// ============ 令牌会话 ============
let _sidMem = '';
let _buvid3Mem = '';
try {
  _sidMem = sessionStorage.getItem('bili_sid') || localStorage.getItem('bili_sid') || '';
  _buvid3Mem = sessionStorage.getItem('bili_buvid3') || localStorage.getItem('bili_buvid3') || '';
} catch (e) {}

const _origFetch = window.fetch.bind(window);
window.fetch = (input, opts) => {
  opts = opts || {};
  if (opts.headers instanceof Headers) {
    if (_sidMem) opts.headers.set('X-Bili-Session', _sidMem);
    if (_buvid3Mem) opts.headers.set('X-Bili-Buvid3', _buvid3Mem);
  } else {
    opts.headers = Object.assign({}, opts.headers);
    if (_sidMem) opts.headers['X-Bili-Session'] = _sidMem;
    if (_buvid3Mem) opts.headers['X-Bili-Buvid3'] = _buvid3Mem;
  }
  return _origFetch(input, opts);
};

// ============ 顶栏滚动状态 ============
const siteHeader = document.getElementById('siteHeader');
function updateHeaderState() {
  const bannerH = document.getElementById('bannerSection')?.offsetHeight || 180;
  const threshold = Math.max(40, bannerH * 0.5);
  if (window.scrollY > threshold) {
    siteHeader.classList.add('scrolled');
  } else {
    siteHeader.classList.remove('scrolled');
  }
}
window.addEventListener('scroll', updateHeaderState, { passive: true });
window.addEventListener('resize', updateHeaderState);
updateHeaderState();

// ============ 登录态检测 ============
(async function checkLogin() {
  const loginEntry = document.getElementById('loginEntry');
  try {
    const r = await fetch('/api/me');
    const d = await r.json();
    if (d.loggedIn && d.user) {
      const face = d.user.face || '';
      const uname = d.user.uname || '';
      const a = document.createElement('a');
      a.className = 'avatar-btn';
      a.href = '/account';
      a.title = uname;
      if (face) {
        const img = document.createElement('img');
        img.src = face.startsWith('//') ? 'https:' + face : face;
        img.referrerPolicy = 'no-referrer';
        img.alt = uname;
        a.appendChild(img);
      } else {
        a.textContent = uname.slice(0, 1) || '我';
      }
      loginEntry.replaceWith(a);
    }
  } catch (e) {}
})();

// ============ 占位按钮 toast ============
let toastTimer = null;
function showToast(text) {
  const toast = document.getElementById('bvidToast');
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}
document.querySelectorAll('[data-placeholder]').forEach(el => {
  el.addEventListener('click', () => {
    showToast((el.dataset.placeholder || '该功能') + '功能开发中，敬请期待');
  });
});

// ============ 搜索历史 ============
const HISTORY_KEY = 'bili_search_history';
const HISTORY_MAX = 10;
const historyDropdown = document.getElementById('historyDropdown');
const input = document.getElementById('keyword');
const form = document.getElementById('searchForm');

function getHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  } catch { return []; }
}
function saveHistory(list) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch {}
}
function addHistory(kw) {
  kw = String(kw).trim();
  if (!kw) return;
  let list = getHistory().filter(k => k !== kw);
  list.unshift(kw);
  if (list.length > HISTORY_MAX) list = list.slice(0, HISTORY_MAX);
  saveHistory(list);
}
function removeHistory(kw) {
  saveHistory(getHistory().filter(k => k !== kw));
  renderHistory();
}
function clearHistory() {
  saveHistory([]);
  renderHistory();
}
function escapeAttr(s) {
  return String(s).replace(/"/g, '&quot;').replace(/&/g, '&amp;').replace(/</g, '&lt;');
}
function renderHistory() {
  const list = getHistory();
  if (!list.length) {
    historyDropdown.innerHTML = `<div class="history-empty">暂无搜索记录</div>`;
    return;
  }
  const items = list.map(kw => `
    <div class="history-item" data-keyword="${escapeAttr(kw)}">
      <span class="history-text">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>${escapeAttr(kw)}</span>
      </span>
      <button type="button" class="history-remove" data-remove="${escapeAttr(kw)}" title="删除">×</button>
    </div>
  `).join('');
  historyDropdown.innerHTML = `
    <div class="history-header">
      <span>搜索历史</span>
      <button type="button" class="history-clear" id="historyClearBtn">清空</button>
    </div>
    ${items}
  `;
}
function showHistoryDropdown() { renderHistory(); historyDropdown.classList.add('show'); }
function hideHistoryDropdown() { historyDropdown.classList.remove('show'); }

input.addEventListener('focus', showHistoryDropdown);

const searchWrap = document.querySelector('.search-wrap');
document.addEventListener('click', (e) => {
  if (!searchWrap.contains(e.target)) hideHistoryDropdown();
});

historyDropdown.addEventListener('click', (e) => {
  const removeBtn = e.target.closest('[data-remove]');
  if (removeBtn) { e.stopPropagation(); removeHistory(removeBtn.dataset.remove); return; }
  const clearBtn = e.target.closest('#historyClearBtn');
  if (clearBtn) { clearHistory(); return; }
  const item = e.target.closest('.history-item');
  if (item) {
    const kw = item.dataset.keyword;
    input.value = kw;
    hideHistoryDropdown();
    addHistory(kw);
    doSearch(kw, 1);
  }
});

// ============ 结果 / 推荐 / 分页 ============
const results = document.getElementById('results');
const metaRow = document.getElementById('metaRow');
const pagination = document.getElementById('pagination');
const filterBar = document.getElementById('filterBar');
const sortGroup = document.getElementById('sortGroup');
const recommendSection = document.getElementById('recommendSection');
const recommendResults = document.getElementById('recommendResults');
const refreshRecommendBtn = document.getElementById('refreshRecommendBtn');
const recommendTitle = document.getElementById('recommendTitle');

let currentKeyword = '';
let currentPage = 1;
let totalPages = 1;
let currentOrder = '';

function formatCount(n) {
  if (n == null) return '-';
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  return String(n);
}
function formatDate(pubdate) {
  if (pubdate == null || pubdate === '') return '';
  let d;
  if (typeof pubdate === 'number' || /^\d+$/.test(pubdate)) d = new Date(Number(pubdate) * 1000);
  else d = new Date(pubdate);
  if (isNaN(d.getTime())) return '';
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${mm}-${dd}`;
}
function formatDuration(sec) {
  let totalSeconds;
  if (typeof sec === 'string' && sec.includes(':')) {
    const parts = sec.split(':').map(p => parseInt(p, 10) || 0);
    if (parts.length === 3) totalSeconds = parts[0] * 3600 + parts[1] * 60 + parts[2];
    else if (parts.length === 2) totalSeconds = parts[0] * 60 + parts[1];
    else totalSeconds = parts[0] || 0;
  } else {
    totalSeconds = parseInt(sec, 10) || 0;
  }
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function skeletonCardsHTML(count) {
  return Array.from({ length: count }).map(() => `
    <div class="card skeleton-card">
      <div class="thumb-wrap"></div>
      <div class="card-body">
        <div class="skeleton-line" style="width:90%"></div>
        <div class="skeleton-line" style="width:60%"></div>
      </div>
    </div>
  `).join('');
}
function renderSkeleton() {
  results.innerHTML = `<div class="grid">${skeletonCardsHTML(12)}</div>`;
  pagination.innerHTML = '';
}
function renderError(msg) {
  results.innerHTML = `<div class="error-box">${msg}</div>`;
  pagination.innerHTML = '';
}
function renderEmpty(kw) {
  results.innerHTML = `<div class="placeholder">没有找到与「${kw}」相关的视频</div>`;
  pagination.innerHTML = '';
}

function stripHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}

function cardHTML(item) {
  return `
    <div class="card" data-bvid="${item.bvid}">
      <div class="thumb-wrap">
        <img src="${item.pic}" loading="lazy" alt="" referrerpolicy="no-referrer" onerror="this.style.opacity=0" />
        <span class="thumb-stats">
          <span class="stat-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="4" width="20" height="16" rx="4" stroke="currentColor" stroke-width="1.6"/>
              <path d="M4 4.5C4 3.6 4.99 3.05 5.75 3.52L19.5 12L5.75 20.48C4.99 20.95 4 20.4 4 19.5V4.5Z" fill="currentColor" transform="translate(6.6,6) scale(0.5)"/>
            </svg>
            ${formatCount(item.play)}
          </span>
          <span class="stat-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="4" width="20" height="16" rx="4" stroke="currentColor" stroke-width="1.6"/>
              <line x1="6" y1="9.5" x2="15" y2="9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              <line x1="6" y1="14.5" x2="18" y2="14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            ${formatCount(item.danmaku)}
          </span>
        </span>
        <span class="duration">${formatDuration(item.duration)}</span>
      </div>
      <div class="card-body">
        <p class="title" title="${stripHtml(item.title).replace(/"/g, '&quot;')}">${item.title}</p>
        <div class="author">
          <svg width="16" height="13" viewBox="0 0 24 20" xmlns="http://www.w3.org/2000/svg">
            <rect x="0.5" y="0.5" width="23" height="19" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <text x="12" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', Roboto, sans-serif">UP</text>
          </svg>
          <span>${item.author}</span>${item.pubdate ? ` · ${formatDate(item.pubdate)}` : ''}
        </div>
      </div>
    </div>
  `;
}

function renderResults(list) {
  results.innerHTML = `<div class="grid">${list.map(cardHTML).join('')}</div>`;
}

function buildPageNumbers(current, total) {
  const pages = [];
  const windowSize = 2;
  const add = p => pages.push(p);
  add(1);
  if (current - windowSize > 2) add('...');
  for (let p = Math.max(2, current - windowSize); p <= Math.min(total - 1, current + windowSize); p++) add(p);
  if (current + windowSize < total - 1) add('...');
  if (total > 1) add(total);
  return pages;
}
function renderPagination() {
  if (!currentKeyword || totalPages <= 1) { pagination.innerHTML = ''; return; }
  const pages = buildPageNumbers(currentPage, totalPages);
  const btns = pages.map(p => {
    if (p === '...') return `<span class="page-ellipsis">…</span>`;
    const active = p === currentPage ? 'active' : '';
    return `<button class="page-btn ${active}" data-page="${p}" ${p === currentPage ? 'disabled' : ''}>${p}</button>`;
  }).join('');
  pagination.innerHTML = `
    <button class="page-btn" data-page="${currentPage - 1}" ${currentPage <= 1 ? 'disabled' : ''}>‹</button>
    ${btns}
    <button class="page-btn" data-page="${currentPage + 1}" ${currentPage >= totalPages ? 'disabled' : ''}>›</button>
  `;
}

sortGroup.addEventListener('click', (e) => {
  const btn = e.target.closest('.sort-tab');
  if (!btn || btn.classList.contains('active')) return;
  sortGroup.querySelectorAll('.sort-tab').forEach(el => el.classList.remove('active'));
  btn.classList.add('active');
  currentOrder = btn.dataset.order || '';
  if (currentKeyword) doSearch(currentKeyword, 1);
});
pagination.addEventListener('click', (e) => {
  const btn = e.target.closest('.page-btn');
  if (!btn || btn.disabled) return;
  const page = parseInt(btn.dataset.page, 10);
  if (!page || page < 1 || page > totalPages || page === currentPage) return;
  doSearch(currentKeyword, page);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

let recommendLoading = false;
async function loadRecommend() {
  if (recommendLoading) return;
  recommendLoading = true;
  refreshRecommendBtn.classList.add('spinning');
  recommendResults.innerHTML = `<div class="grid">${skeletonCardsHTML(12)}</div>`;
  try {
    const res = await fetch('/api/recommend');
    const data = await res.json();
    if (recommendTitle) recommendTitle.textContent = data.personalized ? '为你推荐' : '热门推荐';
    if (!res.ok || !data.list || data.list.length === 0) {
      recommendResults.innerHTML = `<div class="error-box">${data.error || '推荐加载失败,请稍后再试'}</div>`;
      return;
    }
    recommendResults.innerHTML = `<div class="grid">${data.list.map(cardHTML).join('')}</div>`;
  } catch (err) {
    recommendResults.innerHTML = `<div class="error-box">网络请求失败,请确认代理服务是否正在运行</div>`;
  } finally {
    recommendLoading = false;
    setTimeout(() => refreshRecommendBtn.classList.remove('spinning'), 400);
  }
}
refreshRecommendBtn.addEventListener('click', loadRecommend);

recommendResults.addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (!card) return;
  const bvid = card.dataset.bvid;
  if (bvid) window.location.href = `/player?bv=${encodeURIComponent(bvid)}`;
});

async function doSearch(keyword, page = 1) {
  if (!keyword) return;
  currentKeyword = keyword;
  currentPage = page;
  metaRow.textContent = '';
  filterBar.classList.add('show');
  recommendSection.style.display = 'none';
  renderSkeleton();
  try {
    const params = new URLSearchParams({ keyword, page: String(page), order: currentOrder });
    const res = await fetch(`/api/search?${params.toString()}`);
    const data = await res.json();
    if (!res.ok) { renderError(data.error || '搜索失败,请稍后再试'); totalPages = 1; return; }
    if (!data.list || data.list.length === 0) { renderEmpty(keyword); totalPages = 1; return; }
    totalPages = data.totalPages || 1;
    metaRow.innerHTML = `找到 <b>${formatCount(data.total)}</b> 条结果`;
    renderResults(data.list);
    renderPagination();
  } catch (err) {
    renderError('网络请求失败,请确认代理服务是否正在运行');
    totalPages = 1;
  }
}

results.addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (!card) return;
  const bvid = card.dataset.bvid;
  if (bvid) window.location.href = `/player?bv=${encodeURIComponent(bvid)}`;
});

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const kw = input.value.trim();
  if (!kw) return;
  addHistory(kw);
  hideHistoryDropdown();
  doSearch(kw, 1);
});

// ============ Banner：季节头图视频优先 / 轮播兜底 ============
// 优先级：
//   1) 季节头图里有视频素材（webm/mp4）→ 直接播视频，视频加载失败降级为静态封面图
//   2) 有轮播 → 5s 自动切换 + 圆点
//   3) 都没有 → 保留灰底占位（即 CSS 里的 #d8dde2）
let bannerTimer = null;

async function loadBanner() {
  let d;
  try {
    const r = await fetch("/api/banner");
    if (!r.ok) return;
    d = await r.json();
  } catch (e) {
    console.warn("banner 加载失败:", e && e.message);
    return;
  }

  const headerVideo = d.header?.layers?.find(l => l.type === "video");
  if (headerVideo) {
    renderBannerVideo(headerVideo.src, d.header.pic || headerVideo.src);
    return;
  }
  if (Array.isArray(d.carousel) && d.carousel.length) {
    renderBannerCarousel(d.carousel);
    return;
  }
  if (d.header?.pic) {
    renderBannerImage(d.header.pic);
  }
}

// 视频 banner：静音自动循环，加载失败自动降级为静态封面
function renderBannerVideo(videoSrc, posterSrc) {
  const bg = document.getElementById("bannerHeaderBg");
  const carousel = document.getElementById("bannerCarousel");
  const dots = document.getElementById("bannerDots");

  if (bannerTimer) { clearInterval(bannerTimer); bannerTimer = null; }
  carousel.replaceChildren();
  dots.classList.remove("show");
  dots.replaceChildren();

  const video = document.createElement("video");
  video.src = videoSrc;
  video.autoplay = true;
  video.muted = true;         // 必须静音才能自动播放
  video.loop = true;
  video.playsInline = true;
  video.setAttribute("playsinline", "");
  video.setAttribute("webkit-playsinline", "");
  if (posterSrc) video.poster = posterSrc;

  // 视频加载失败（CORS、404、解码失败等）→ 退回静态图
  video.addEventListener("error", () => {
    if (posterSrc) {
      const img = document.createElement("img");
      img.src = posterSrc;
      img.alt = "";
      img.referrerPolicy = "no-referrer";
      bg.replaceChildren(img);
    }
  });

  bg.replaceChildren(video);
}

function renderBannerImage(src) {
  const bg = document.getElementById("bannerHeaderBg");
  const img = document.createElement("img");
  img.src = src;
  img.alt = "";
  img.referrerPolicy = "no-referrer";
  bg.replaceChildren(img);
}

// 轮播 banner：5s 自动切 + 圆点 + 悬停暂停
function renderBannerCarousel(items) {
  const bg = document.getElementById("bannerHeaderBg");
  const carousel = document.getElementById("bannerCarousel");
  const dots = document.getElementById("bannerDots");

  bg.replaceChildren();  // 轮播自己就是主视觉，不需要背景层

  carousel.innerHTML = items.map((it, i) => `
    <div class="banner-slide${i === 0 ? " active" : ""}" data-index="${i}">
      <img src="${it.pic}" alt="" referrerpolicy="no-referrer" loading="${i === 0 ? "eager" : "lazy"}" />
    </div>
  `).join("");

  dots.innerHTML = items.map((_, i) =>
    `<button class="banner-dot${i === 0 ? " active" : ""}" data-index="${i}" aria-label="第 ${i + 1} 张"></button>`
  ).join("");
  dots.classList.add("show");

  let current = 0;
  const slides = carousel.querySelectorAll(".banner-slide");
  const dotEls = dots.querySelectorAll(".banner-dot");

  function go(idx) {
    idx = ((idx % items.length) + items.length) % items.length;
    slides.forEach((el, i) => el.classList.toggle("active", i === idx));
    dotEls.forEach((el, i) => el.classList.toggle("active", i === idx));
    current = idx;
  }

  function start() {
    if (bannerTimer) clearInterval(bannerTimer);
    if (items.length > 1) {
      bannerTimer = setInterval(() => go(current + 1), 5000);
    }
  }
  function stop() {
    if (bannerTimer) { clearInterval(bannerTimer); bannerTimer = null; }
  }

  dots.addEventListener("click", (e) => {
    const dot = e.target.closest(".banner-dot");
    if (!dot) return;
    go(parseInt(dot.dataset.index, 10));
    start();
  });

  carousel.addEventListener("mouseenter", stop);
  carousel.addEventListener("mouseleave", start);

  start();
}

loadBanner();

loadRecommend();
</script>
