<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>图文 - B站视频搜索器</title>
<style>
  :root {
    --pink: #FB7299;
    --blue: #00A1D6;
    --bg: #F1F2F3;
    --card: #FFFFFF;
    --text: #18191C;
    --text-2: #61666D;
    --text-3: #9499A0;
    --border: #E3E5E7;
    --header-h: 64px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--card); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* ============ 顶栏（同其它页面，无搜索框） ============ */
  .site-header { position: sticky; top: 0; z-index: 100; height: var(--header-h); background: var(--card); color: var(--text); box-shadow: 0 1px 8px rgba(0,0,0,.06); }
  .header-inner { max-width: 1400px; height: 100%; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 20px; }
  .logo { display: flex; align-items: center; flex-shrink: 0; user-select: none; color: var(--pink); }
  .logo-svg { display: block; height: 28px; width: auto; }
  .top-nav { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .top-nav-item { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: none; background: none; border-radius: 8px; color: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s ease; opacity: .9; }
  .top-nav-item:hover { background: rgba(0,0,0,.05); opacity: 1; }
  .user-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .user-icon { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; padding: 0; border: none; background: none; border-radius: 50%; color: inherit; cursor: pointer; transition: background .15s ease; position: relative; }
  .user-icon:hover { background: rgba(0,0,0,.05); }
  .user-icon.active { color: var(--pink); }
  .user-icon svg { display: block; }
  .login-btn { height: 34px; padding: 0 16px; border-radius: 17px; background: var(--pink); color: #fff; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }
  .avatar-btn { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text-2); font-weight: 600; font-size: 14px; }
  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ============ 图文详情 ============ */
  .op-wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }
  .op-title { margin: 0 0 8px; font-size: 26px; font-weight: 700; line-height: 1.4; word-break: break-all; }
  .op-meta { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-3); margin-bottom: 16px; }
  .op-meta .op-views { color: var(--text-2); }
  .op-author { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .op-avatar { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--bg); }
  .op-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .op-name { font-size: 15px; font-weight: 600; }
  .op-name:hover { color: var(--pink); }
  .op-time { margin-top: 3px; font-size: 12px; color: var(--text-3); }
  .op-body { padding: 18px 0 8px; font-size: 16px; line-height: 1.85; }
  .op-body p { margin: 0 0 16px; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
  .op-body a { color: var(--blue); }
  .op-body a:hover { text-decoration: underline; }
  .op-body blockquote { margin: 0 0 16px; padding: 4px 0 4px 14px; border-left: 3px solid var(--border); color: var(--text-2); white-space: pre-wrap; }
  .op-body ul { margin: 0 0 16px; padding-left: 22px; }
  .op-body hr { border: none; border-top: 1px solid var(--border); margin: 22px 0; }
  .op-pics { display: flex; flex-direction: column; gap: 10px; margin: 0 0 16px; }
  .op-pic { padding: 0; border: none; background: var(--bg); border-radius: 8px; overflow: hidden; cursor: zoom-in; display: block; }
  .op-pic img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  .dy-emote { height: 22px; width: auto; vertical-align: -5px; margin: 0 1px; }
  .op-foot { display: flex; align-items: center; gap: 6px; padding: 10px 0 14px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .op-stat { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px 6px 0; margin-right: 12px; border: none; background: none; color: var(--text-3); font-size: 14px; cursor: pointer; }
  .op-cmt-txt { padding: 6px 8px 6px 0; margin-right: 8px; font-size: 14px; color: var(--text-3); }
  .op-stat svg { width: 20px; height: 20px; display: block; }
  .op-stat:hover, .op-stat.active { color: var(--pink); }
  .op-stat.active svg path { fill: currentColor; }
  .op-stat.busy { opacity: .5; pointer-events: none; }
  /* 投币弹窗 */
  .coin-mask { position: fixed; inset: 0; z-index: 1100; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
  .coin-dialog { position: relative; background: var(--card); color: var(--text); border-radius: 12px; width: min(320px, calc(100vw - 48px)); padding: 22px 22px 14px; box-shadow: 0 12px 40px rgba(0,0,0,.2); }
  .coin-close { position: absolute; right: 10px; top: 8px; width: 32px; height: 32px; border: none; background: none; color: var(--text-3); font-size: 22px; line-height: 1; cursor: pointer; border-radius: 50%; }
  .coin-close:hover { color: var(--text); background: rgba(0,0,0,.05); }
  .coin-title { text-align: center; font-size: 16px; font-weight: 600; margin: 4px 0 16px; }
  .coin-title .coin-num { color: var(--pink); font-size: 24px; margin: 0 4px; vertical-align: -2px; }
  .coin-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .coin-card { position: relative; height: 64px; border: 2px solid var(--border); border-radius: 10px; background: none; color: var(--text-2); font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .coin-card svg { width: 22px; height: 22px; }
  .coin-card:hover { color: var(--text); }
  .coin-card.selected { border-color: var(--pink); color: var(--pink); }
  .coin-card.disabled { opacity: .35; cursor: not-allowed; }
  .coin-like { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--text-2); cursor: pointer; user-select: none; }
  .coin-like input { width: 16px; height: 16px; accent-color: var(--pink); }
  .coin-footer { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .coin-ok { width: 100%; height: 38px; border: none; border-radius: 19px; background: var(--pink); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .coin-ok:disabled { opacity: .6; cursor: default; }
  .coin-ok:hover:not(:disabled) { filter: brightness(.94); }
  .op-state { padding: 80px 0; text-align: center; color: var(--text-3); font-size: 14px; }
  .op-state a { color: var(--blue); }
  .bvid-toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px); background: rgba(24,25,28,.9); color: #fff; font-size: 14px; padding: 10px 18px; border-radius: 8px; z-index: 1200; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; }
  .bvid-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 640px) {
    :root { --header-h: 56px; }
    .header-inner { padding: 0 14px; gap: 10px; }
    .logo-svg { height: 24px; }
    .user-actions .user-icon:not(.always-show) { display: none; }
    .op-wrap { padding: 16px 12px 70px; }
    .op-title { font-size: 21px; }
  }

  /* ============ 深色模式 ============ */
  :root[data-theme="dark"] { --bg: #141414; --card: #1f2022; --text: #e6e6e8; --text-2: #9a9da3; --text-3: #6f7278; --border: #2c2d30; }
  :root[data-theme="dark"] .top-nav-item:hover, :root[data-theme="dark"] .user-icon:hover { background: rgba(255,255,255,.08); }
  :root[data-theme="dark"] .avatar-btn { background: var(--card); }
</style>

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
          <path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.5-2.4.6a7.4 7.4 0 0 0-1.7-1L14.8 3h-4l-.5 2.6a7.4 7.4 0 0 0-1.7 1l-2.4-.6-2 3.5L6.2 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.5 2.4-.6a7.4 7.4 0 0 0 1.7 1l.5 2.6h4l.5-2.6a7.4 7.4 0 0 0 1.7-1l2.4.6 2-3.5-2-1.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>

</header>

<div class="op-wrap" id="opWrap"><div class="op-state">正在加载图文…</div></div>
<div class="bvid-toast" id="bvidToast"></div>

<script src="/lightbox.js"></script>
<script src="/dyn-comments.js"></script>
<script>
// ============ 登录凭证 / 设备 ID（与其它页面一致） ============
let _credsMem = {};
try { const raw = localStorage.getItem('bili_creds'); if (raw) _credsMem = JSON.parse(raw) || {}; } catch (e) {}
function _cookieHeader() { return Object.keys(_credsMem || {}).map(k => `${k}=${_credsMem[k]}`).join('; '); }
let _deviceId = '';
try { _deviceId = localStorage.getItem('bili_device_id') || ''; if (!_deviceId) { _deviceId = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('bili_device_id', _deviceId); } } catch (e) {}
const _origFetch = window.fetch.bind(window);
window.fetch = (input, opts) => {
  opts = opts || {};
  const ch = _cookieHeader();
  const setH = (k, v) => { if (opts.headers instanceof Headers) opts.headers.set(k, v); else opts.headers = Object.assign({}, opts.headers), opts.headers[k] = v; };
  if (_deviceId) setH('X-Device-Id', _deviceId);
  if (ch) setH('X-Bili-Cookie', ch);
  return _origFetch(input, opts);
};

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function faceUrl(f) { f = String(f || ''); return f.startsWith('//') ? 'https:' + f : f; }
function fmtCount(n) {
  n = Number(n) || 0;
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, '') + '亿';
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  return String(n);
}
let toastTimer = null;
function showToast(text) {
  const t = document.getElementById('bvidToast');
  t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}
function fmtDate(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000), p = (n) => String(n).padStart(2, '0');
  const y = d.getFullYear(), now = new Date().getFullYear();
  return (y === now ? '' : y + '-') + `${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function absTime(ts) {  if (!ts) return '';
  const d = new Date(ts * 1000), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// 把正文里服务端拼好的 <a> 改成站内路由：
//   space.bilibili.com/{mid} → /account?mid= ；bilibili.com/video/BV… → /player?bv=… ；
//   bilibili.com/opus/{id} → /opus?id=… 。其余指向 B 站（及 b23.tv 短链）的链接没有
//   对应站内页面，直接替换成纯文本，避免跳出本站。
function internalizeLinks(root) {
  root.querySelectorAll('a[href]').forEach((a) => {
    const href = (a.getAttribute('href') || '').trim();
    let m;
    if ((m = href.match(/^https?:\/\/space\.bilibili\.com\/(\d+)(?:[/?#]|$)/))) {
      a.setAttribute('href', '/account?mid=' + m[1]);
    } else if ((m = href.match(/^https?:\/\/www\.bilibili\.com\/video\/(BV[0-9A-Za-z]{10})/i))) {
      a.setAttribute('href', '/player?bv=' + m[1]);
    } else if ((m = href.match(/^https?:\/\/www\.bilibili\.com\/opus\/(\d+)(?:[/?#]|$)/))) {
      a.setAttribute('href', '/opus?id=' + m[1]);
    } else if (/^(https?:)?\/\/(www\.|m\.)?bilibili\.com|^https?:\/\/b23\.tv/i.test(href)) {
      const txt = document.createTextNode(a.textContent || '');
      a.replaceWith(txt);
      return;
    } else {
      return; // 非 B 站链接（如普通网页）保持原样
    }
    a.removeAttribute('target');
    a.removeAttribute('rel');
  });
}

function applyHeaderLogin(m) {
  const cur = document.getElementById('loginEntry');
  if (!cur) return;
  const a = document.createElement('a');
  a.id = 'loginEntry'; a.href = '/account';
  if (m.loggedIn && m.user) {
    a.className = 'avatar-btn'; a.title = m.user.uname || '';
    if (m.user.face) {
      const img = document.createElement('img');
      img.src = faceUrl(m.user.face); img.referrerPolicy = 'no-referrer'; img.alt = m.user.uname || '';
      a.appendChild(img);
    } else { a.textContent = (m.user.uname || '我').slice(0, 1); }
  } else { a.className = 'login-btn'; a.textContent = '登录'; }
  cur.replaceWith(a);
}


// 三个操作图标取自 player.html（点赞 36 / 硬币 28 / 星标 28），缩放到 20px 显示
const IC_LIKE = '<svg viewBox="0 0 36 36" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M9.77234 30.8573V11.7471H7.54573C5.50932 11.7471 3.85742 13.3931 3.85742 15.425V27.1794C3.85742 29.2112 5.50932 30.8573 7.54573 30.8573H9.77234ZM11.9902 30.8573V11.7054C14.9897 10.627 16.6942 7.8853 17.1055 3.33591C17.2666 1.55463 18.9633 0.814421 20.5803 1.59505C22.1847 2.36964 23.243 4.32583 23.243 6.93947C23.243 8.50265 23.0478 10.1054 22.6582 11.7471H29.7324C31.7739 11.7471 33.4289 13.402 33.4289 15.4435C33.4289 15.7416 33.3928 16.0386 33.3215 16.328L30.9883 25.7957C30.2558 28.7683 27.5894 30.8573 24.528 30.8573H11.9911H11.9902Z" fill="currentColor"/></svg>';
const IC_COIN = '<svg viewBox="0 0 28 28" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M14.045 25.5454C7.69377 25.5454 2.54504 20.3967 2.54504 14.0454C2.54504 7.69413 7.69377 2.54541 14.045 2.54541C20.3963 2.54541 25.545 7.69413 25.545 14.0454C25.545 17.0954 24.3334 20.0205 22.1768 22.1771C20.0201 24.3338 17.095 25.5454 14.045 25.5454ZM9.66202 6.81624H18.2761C18.825 6.81624 19.27 7.22183 19.27 7.72216C19.27 8.22248 18.825 8.62807 18.2761 8.62807H14.95V10.2903C17.989 10.4444 20.3766 12.9487 20.3855 15.9916V17.1995C20.3854 17.6997 19.9799 18.1052 19.4796 18.1052C18.9793 18.1052 18.5738 17.6997 18.5737 17.1995V15.9916C18.5667 13.9478 16.9882 12.2535 14.95 12.1022V20.5574C14.95 21.0577 14.5444 21.4633 14.0441 21.4633C13.5437 21.4633 13.1382 21.0577 13.1382 20.5574V12.1022C11.1 12.2535 9.52148 13.9478 9.51448 15.9916V17.1995C9.5144 17.6997 9.10883 18.1052 8.60856 18.1052C8.1083 18.1052 7.70273 17.6997 7.70265 17.1995V15.9916C7.71158 12.9487 10.0992 10.4444 13.1382 10.2903V8.62807H9.66202C9.11309 8.62807 8.66809 8.22248 8.66809 7.72216C8.66809 7.22183 9.11309 6.81624 9.66202 6.81624Z" fill="currentColor"/></svg>';
const IC_FAV = '<svg viewBox="0 0 28 28" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M19.8071 9.26152C18.7438 9.09915 17.7624 8.36846 17.3534 7.39421L15.4723 3.4972C14.8998 2.1982 13.1004 2.1982 12.4461 3.4972L10.6468 7.39421C10.1561 8.36846 9.25639 9.09915 8.19315 9.26152L3.94016 9.91102C2.63155 10.0734 2.05904 11.6972 3.04049 12.6714L6.23023 15.9189C6.96632 16.6496 7.29348 17.705 7.1299 18.7605L6.39381 23.307C6.14844 24.6872 7.62063 25.6614 8.84745 25.0119L12.4461 23.0634C13.4276 22.4951 14.6544 22.4951 15.6359 23.0634L19.2345 25.0119C20.4614 25.6614 21.8518 24.6872 21.6882 23.307L20.8703 18.7605C20.7051 17.705 21.0339 16.6496 21.77 15.9189L24.9597 12.6714C25.9412 11.6972 25.3687 10.0734 24.06 9.91102L19.8071 9.26152Z" fill="currentColor"/></svg>';
const wrap = document.getElementById('opWrap');
let myMid = 0;

// 服务端已转义并拼好 HTML（文字/表情/链接），这里按 HTML 输出
function blocksHTML(blocks, allImages) {
  return blocks.map(b => {
    if (b.type === 'text') return `<p>${b.html}</p>`;
    if (b.type === 'quote') return `<blockquote>${b.html}</blockquote>`;
    if (b.type === 'line') return '<hr>';
    if (b.type === 'list') return `<ul>${b.items.map(i => `<li>${i}</li>`).join('')}</ul>`;
    if (b.type === 'images') {
      return '<div class="op-pics">' + b.images.map(im => {
        const idx = allImages.length; allImages.push(im.url);
        return `<button type="button" class="op-pic" data-i="${idx}"><img src="${esc(im.url)}" alt="" loading="lazy" referrerpolicy="no-referrer"></button>`;
      }).join('') + '</div>';
    }
    return '';
  }).join('');
}

async function init() {
  const id = new URLSearchParams(location.search).get('id') || '';
  if (!/^\d{1,20}$/.test(id)) { wrap.innerHTML = '<div class="op-state">缺少图文 id</div>'; return; }
  let m = { loggedIn: false };
  try { const r = await fetch('/api/me'); m = await r.json(); } catch (e) {}
  applyHeaderLogin(m);
  myMid = Number(m.user && m.user.mid) || 0;

  let d;
  try {
    const r = await fetch('/api/opus?id=' + id);
    d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || '图文加载失败');
  } catch (e) {
    wrap.innerHTML = `<div class="op-state">${esc(e.message || '图文加载失败')}<br><a href="https://www.bilibili.com/opus/${id}" target="_blank" rel="noreferrer noopener">去 B 站查看</a></div>`;
    return;
  }
  document.title = (d.title ? d.title.replace(/<[^>]+>/g, '') : '图文') + ' - B站视频搜索器';
  const a = d.author || {};
  // 专栏型图文（comment_type=12）才支持投币/收藏，aid=专栏 id；纯动态型没有对应通道
  const triple = !!(d.comment && d.comment.type === 12);
  if (d.stat == null) d.stat = {};
  ['like', 'coin', 'fav', 'comment'].forEach((k) => { if (d.stat[k] == null) d.stat[k] = 0; });
  const images = [];
  const body = blocksHTML(d.blocks || [], images);
  // 大标题下方的元信息：浏览数 + 日期（日期从作者行挪过来）
  const metaDate = fmtDate(a.ts) || esc(a.time || '');
  wrap.innerHTML = `
    ${d.title ? `<h1 class="op-title">${d.title}</h1>` : ''}
    <div class="op-meta"><span class="op-views">${fmtCount(d.stat.view || 0)} 浏览</span><span>${metaDate}</span></div>
    <div class="op-author">
      <a class="op-avatar" href="/account?mid=${esc(a.mid)}">${a.face ? `<img src="${esc(a.face)}" alt="" referrerpolicy="no-referrer">` : ''}</a>
      <div><a class="op-name" href="/account?mid=${esc(a.mid)}">${a.name || '未知用户'}</a></div>
    </div>
    <div class="op-body">${body || '<p style="color:var(--text-3)">这篇图文暂时没有可显示的内容</p>'}</div>
    <div class="op-foot">
      <span class="op-cmt-txt" id="opCmtCount" title="评论数">${d.stat.comment ? fmtCount(d.stat.comment) : '评论'}</span>
      <button type="button" class="op-stat${d.stat.liked ? ' active' : ''}" id="opLike">${IC_LIKE}<span>${d.stat.like ? fmtCount(d.stat.like) : '点赞'}</span></button>
      <button type="button" class="op-stat${d.stat.coined ? ' active' : ''}" id="opCoin"${triple ? '' : ' title="该图文暂不支持投币" disabled style="opacity:.45;cursor:not-allowed"'}>${IC_COIN}<span>${d.stat.coin ? fmtCount(d.stat.coin) : '投币'}</span></button>
      <button type="button" class="op-stat${d.stat.faved ? ' active' : ''}" id="opFav"${triple ? '' : ' title="该图文暂不支持收藏" disabled style="opacity:.45;cursor:not-allowed"'}>${IC_FAV}<span>${d.stat.fav ? fmtCount(d.stat.fav) : '收藏'}</span></button>
    </div>
    <div id="opComments"></div>`;

  // 正文里的站内链接：跳主页/视频/图文的改成自家路由；其它指向 B 站的外链直接退化成纯文本
  internalizeLinks(wrap);

  BiliLightbox.bind(wrap, '.op-pic', (el) => ({ list: images, index: Number(el.dataset.i) }));

  // 点赞：图文 id 通常就是它背后那条动态的 id，直接走动态点赞接口
  const likeBtn = document.getElementById('opLike');
  const setLikeUI = (on) => {
    d.stat.liked = on; d.stat.like = Math.max(0, d.stat.like + (on ? 1 : -1));
    likeBtn.classList.toggle('active', on);
    likeBtn.querySelector('span').textContent = d.stat.like ? fmtCount(d.stat.like) : '点赞';
  };
  likeBtn.addEventListener('click', async () => {
    if (likeBtn.classList.contains('busy')) return;
    const want = !d.stat.liked;
    const apply = setLikeUI;
    apply(want); likeBtn.classList.add('busy');
    try {
      const r = await fetch('/api/dynamics/like', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dynId: d.id, like: want }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { apply(!want); showToast(j.error || '点赞失败'); if (r.status === 401) setTimeout(() => location.href = '/account', 1200); }
    } catch (e) { apply(!want); showToast('网络异常，请重试'); }
    finally { likeBtn.classList.remove('busy'); }
  });

  // 投币 + 收藏：只对专栏型图文（comment_type=12）开放，aid=专栏 id（comment_id_str）
  const oid = d.comment && d.comment.oid;
  if (triple && oid) {
    const coinBtn = document.getElementById('opCoin');
    const favBtn = document.getElementById('opFav');
    const upid = a.mid || 0;

    // 投币弹窗（结构参考 player.html 的 coin-dialog，精简版）
    const openCoinDialog = () => {
      const already = d.stat.coined;
      const mask = document.createElement('div');
      mask.className = 'coin-mask';
      mask.innerHTML = `
        <div class="coin-dialog" role="dialog" aria-modal="true">
          <button type="button" class="coin-close" aria-label="关闭">&times;</button>
          <div class="coin-title">给UP主投<span class="coin-num">1</span>枚硬币</div>
          <div class="coin-cards">
            <button type="button" class="coin-card selected" data-n="1">${IC_COIN}1 硬币</button>
            <button type="button" class="coin-card${already ? ' disabled' : ''}" data-n="2"${already ? ' disabled title="已投过币，每人最多投 2 枚，不能再投"' : ''}>${IC_COIN}2 硬币</button>
          </div>
          <label class="coin-like"><input type="checkbox" checked>同时点赞内容</label>
          <div class="coin-footer"><button type="button" class="coin-ok">确定</button></div>
        </div>`;
      document.body.appendChild(mask);
      let num = 1;
      const numEl = mask.querySelector('.coin-num');
      const close = () => mask.remove();
      mask.addEventListener('click', (ev) => { if (ev.target === mask) close(); });
      mask.querySelector('.coin-close').addEventListener('click', close);
      mask.querySelectorAll('.coin-card').forEach((c) => c.addEventListener('click', () => {
        if (c.classList.contains('disabled')) return;
        num = Number(c.dataset.n) || 1;
        mask.querySelectorAll('.coin-card').forEach((x) => x.classList.toggle('selected', x === c));
        numEl.textContent = num;
      }));
      mask.querySelector('.coin-ok').addEventListener('click', async () => {
        const okBtn = mask.querySelector('.coin-ok');
        if (okBtn.disabled) return;
        okBtn.disabled = true;
        const selectLike = mask.querySelector('.coin-like input').checked;
        try {
          const r = await fetch('/api/opus/coin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ oid, upid, multiply: num, select_like: selectLike }) });
          const j = await r.json().catch(() => ({}));
          if (!r.ok) { showToast(j.error || '投币失败'); if (r.status === 401) setTimeout(() => location.href = '/account', 1200); okBtn.disabled = false; return; }
          d.stat.coin = (d.stat.coin || 0) + num;
          d.stat.coined = true;
          coinBtn.classList.add('active');
          coinBtn.querySelector('span').textContent = d.stat.coin ? fmtCount(d.stat.coin) : '投币';
          if (selectLike && !d.stat.liked) setLikeUI(true);
          showToast(`已投 ${num} 枚硬币`);
          close();
        } catch (e) { showToast('网络异常，请重试'); okBtn.disabled = false; }
      });
    };
    coinBtn.addEventListener('click', () => {
      if (d.stat.coined) { showToast('已经投过币啦'); return; }
      openCoinDialog();
    });

    // 收藏/取消收藏
    favBtn.addEventListener('click', async () => {
      if (favBtn.classList.contains('busy')) return;
      const want = !d.stat.faved;
      const apply = (on) => {
        d.stat.faved = on; d.stat.fav = Math.max(0, d.stat.fav + (on ? 1 : -1));
        favBtn.classList.toggle('active', on);
        favBtn.querySelector('span').textContent = d.stat.fav ? fmtCount(d.stat.fav) : '收藏';
      };
      apply(want); favBtn.classList.add('busy');
      try {
        const r = await fetch('/api/opus/fav', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ oid, on: want }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) { apply(!want); showToast(j.error || '收藏失败'); if (r.status === 401) setTimeout(() => location.href = '/account', 1200); return; }
        showToast(want ? '已收藏' : '已取消收藏');
      } catch (e) { apply(!want); showToast('网络异常，请重试'); }
      finally { favBtn.classList.remove('busy'); }
    });
  }

  if (d.comment && d.comment.oid) {
    let count = d.stat.comment;
    DynComments.mount(document.getElementById('opComments'), {
      oid: d.comment.oid, type: d.comment.type, myMid, toast: showToast,
      onCountDelta: (x) => { count = Math.max(0, count + x); document.getElementById('opCmtCount').textContent = count ? fmtCount(count) : '评论'; },
    });
  }
}
init();
</script>
