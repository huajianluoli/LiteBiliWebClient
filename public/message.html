<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>消息中心 - B站视频搜索器</title>
<style>
  :root {
    --pink: #FB7299;
    --blue: #00A1D6;
    --bg: #F1F2F3;
    --card: #FFFFFF;
    --text: #18191C;
    --text-2: #61666D;
    --text-3: #9499A0;
    --border: #E3E5E7;
    --header-h: 64px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* ============ 顶栏（与 account.html 一致，不含搜索框） ============ */
  .site-header { position: sticky; top: 0; z-index: 100; height: var(--header-h); background: #fff; color: var(--text); box-shadow: 0 1px 8px rgba(0, 0, 0, .06); }
  .header-inner { max-width: 1400px; height: 100%; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 20px; }
  .logo { display: flex; align-items: center; flex-shrink: 0; white-space: nowrap; user-select: none; color: var(--pink); }
  .logo-svg { display: block; height: 28px; width: auto; }
  .top-nav { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .top-nav-item { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border: none; background: none; border-radius: 8px; color: inherit; font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer; transition: background .15s ease, color .15s ease; opacity: .9; }
  .top-nav-item:hover { background: rgba(0, 0, 0, .05); opacity: 1; }
  .top-nav-item.active { opacity: 1; font-weight: 650; }
  .user-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .user-icon { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; padding: 0; border: none; background: none; border-radius: 50%; color: inherit; font-family: inherit; cursor: pointer; transition: background .15s ease; }
  .user-icon:hover { background: rgba(0, 0, 0, .05); }
  .user-icon svg { display: block; }
  .login-btn { width: auto; height: 34px; padding: 0 16px; border-radius: 17px; background: var(--pink); color: #fff; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; transition: filter .15s ease; }
  .login-btn:hover { filter: brightness(.94); }
  .avatar-btn { width: 34px; height: 34px; padding: 0; border-radius: 50%; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text-2); font-weight: 600; font-size: 14px; }
  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ============ 布局：左侧导航 + 右侧内容 ============ */
  .msg-layout { max-width: 1200px; margin: 0 auto; padding: 20px 24px 40px; display: flex; gap: 20px; align-items: flex-start; }
  .msg-nav { flex: 0 0 220px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .msg-nav-title { padding: 16px 18px 10px; font-size: 15px; font-weight: 700; }
  .msg-nav-item { display: flex; align-items: center; justify-content: space-between; padding: 11px 18px; font-size: 14px; color: var(--text-2); cursor: pointer; transition: background .12s ease, color .12s ease; }
  .msg-nav-item:hover { background: var(--bg); }
  .msg-nav-item.active { color: var(--pink); font-weight: 600; background: #fdeef2; }
  .nav-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--pink); color: #fff; font-size: 11px; font-weight: 700; }
  .nav-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pink); }

  .msg-content { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; min-height: 560px; }

  /* ---- 我的消息（私信）：会话列表 + 聊天窗口 ---- */
  .im-wrap { display: flex; height: 640px; }
  .im-sessions { flex: 0 0 300px; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; }
  .im-sessions-header { padding: 14px 16px; font-size: 14px; font-weight: 700; border-bottom: 1px solid var(--border); }
  .im-session-list { flex: 1; overflow-y: auto; }
  .im-session-item { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f5f5f5; position: relative; }
  .im-session-item:hover { background: var(--bg); }
  .im-session-item.active { background: #fdeef2; }
  .im-session-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #e7e8ea; flex-shrink: 0; }
  .im-session-body { min-width: 0; flex: 1; }
  .im-session-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .im-session-preview { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
  .im-session-unread { position: absolute; right: 14px; top: 14px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--pink); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

  .im-chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .im-chat-header { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 700; }
  .im-chat-messages { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
  .im-msg-row { display: flex; gap: 8px; max-width: 78%; }
  .im-msg-row.mine { align-self: flex-end; flex-direction: row-reverse; }
  .im-msg-content { display: flex; flex-direction: column; gap: 2px; }
  .im-msg-row.mine .im-msg-content { align-items: flex-end; }
  .im-msg-time { font-size: 10px; color: #999; }
  .im-msg-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #e7e8ea; flex-shrink: 0; }
  .im-msg-bubble { background: var(--bg); color: var(--text); padding: 9px 13px; border-radius: 10px; font-size: 13px; line-height: 1.6; word-break: break-all; }
  .im-msg-row.mine .im-msg-bubble { background: var(--pink); color: #fff; }
  .im-msg-bubble img { max-width: 180px; border-radius: 8px; display: block; }
  .im-msg-bubble.revoked { color: var(--text-3); font-style: italic; background: transparent; padding: 0; }
  .im-chat-input-wrap { border-top: 1px solid var(--border); padding: 8px 18px 12px; }
  .im-chat-toolbar { display: flex; gap: 8px; margin-bottom: 6px; }
  .im-chat-toolbar button { background: none; border: none; font-size: 18px; cursor: pointer; padding: 2px 4px; }
  .im-emote-panel { display: flex; flex-wrap: wrap; gap: 4px; max-height: 200px; overflow-y: auto; margin-bottom: 6px; padding: 6px; background: var(--bg); border-radius: 8px; }
  .im-emote-pkg-name { font-size: 11px; color: var(--text-3); padding: 4px 2px; }
  .im-emote-grid { display: flex; flex-wrap: wrap; gap: 2px; }
  .im-emote-panel img { width: 32px; height: 32px; object-fit: contain; cursor: pointer; }
  .inline-emote { width: 22px; height: 22px; vertical-align: middle; object-fit: contain; }
  .im-msg-bubble img { max-width: 200px; border-radius: 8px; display: block; }
  .im-chat-input { width: 100%; height: 64px; resize: none; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; outline: none; }
  .im-chat-input:focus { border-color: var(--pink); }
  .im-chat-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .im-char-count { font-size: 12px; color: var(--text-3); }
  .im-send-btn { background: var(--pink); color: #fff; border: none; border-radius: 8px; padding: 7px 22px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .im-send-btn:hover { filter: brightness(.95); }
  .im-send-btn:disabled { opacity: .5; cursor: default; }
  .im-empty-chat { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 13px; }

  /* ---- 回复我的 / @我的 / 收到的赞 / 系统通知：单列列表 ---- */
  .feed-list { padding: 4px 0; }
  .feed-item { display: flex; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #f5f5f5; }
  .feed-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #e7e8ea; flex-shrink: 0; display: block; }
  .feed-avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #e7e8ea; display: block; }
  .feed-body { flex: 1; min-width: 0; }
  .feed-line1 { font-size: 14px; }
  .feed-actor { font-weight: 600; color: inherit; }
  .feed-actor:hover { color: var(--pink); }
  .feed-action { color: var(--text-2); margin-left: 4px; }
  .feed-content { margin-top: 6px; font-size: 13px; color: var(--text-2); background: var(--bg); border-radius: 8px; padding: 8px 12px; line-height: 1.6; word-break: break-all; display: block; }
  .feed-content:hover { color: var(--text); background: #e8e9ea; }
  .feed-meta { margin-top: 8px; display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--text-3); }
  .feed-meta a { color: var(--text-3); }
  .feed-meta a:hover { color: var(--pink); }
  .feed-thumb { width: 64px; height: 64px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: #e7e8ea; }
  .feed-row { display: flex; gap: 12px; align-items: flex-start; }
  .feed-row .feed-body { flex: 1; }

  .msg-loading, .msg-empty { text-align: center; color: var(--text-3); font-size: 13px; padding: 60px 0; }
  .msg-more-wrap { text-align: center; padding: 16px 0; }
  .msg-more-btn { border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 16px; padding: 7px 20px; font-size: 13px; cursor: pointer; }
  .msg-more-btn:hover { border-color: var(--pink); color: var(--pink); }

  /* ---- 未登录 ---- */
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 500px; }
  .login-card { text-align: center; max-width: 340px; }
  .login-card h2 { font-size: 18px; margin-bottom: 8px; }
  .login-card .hint { font-size: 13px; color: var(--text-2); line-height: 1.7; margin-bottom: 18px; }
  .btn.primary { background: var(--pink); color: #fff; border: none; border-radius: 18px; padding: 10px 26px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .qr { width: 180px; height: 180px; margin: 16px 0 10px; border: 1px solid var(--border); border-radius: 8px; }
  .status { font-size: 13px; color: var(--text-2); }
  .login-url { font-size: 11px; color: var(--text-3); margin-top: 6px; word-break: break-all; }

  @media (max-width: 860px) {
    .msg-layout { flex-direction: column; }
    .msg-nav { flex: 0 0 auto; width: 100%; }
    .im-wrap { flex-direction: column; height: 70vh; }
    .im-sessions { border-right: none; border-bottom: 1px solid var(--border); max-height: 30vh; }
  }
</style>
</head>

<script>
// ============ 登录凭证（与其它页面一致） ============
let _credsMem = {};
try { const raw = localStorage.getItem('bili_creds'); if (raw) _credsMem = JSON.parse(raw) || {}; } catch (e) {}
function _setCreds(obj) {
  _credsMem = obj || {};
  try { if (obj && Object.keys(obj).length) localStorage.setItem('bili_creds', JSON.stringify(obj)); else localStorage.removeItem('bili_creds'); } catch (e) {}
}
function _cookieHeader() { return Object.keys(_credsMem || {}).map(k => `${k}=${_credsMem[k]}`).join('; '); }
const _origFetch = window.fetch.bind(window);
window.fetch = (input, opts) => {
  opts = opts || {};
  const ch = _cookieHeader();
  if (opts.headers instanceof Headers) { if (ch) opts.headers.set('X-Bili-Cookie', ch); }
  else { opts.headers = Object.assign({}, opts.headers); if (ch) opts.headers['X-Bili-Cookie'] = ch; }
  return _origFetch(input, opts);
};

const app = document.getElementById('app');
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function faceUrl(f) { f = String(f || ''); return f.startsWith('//') ? 'https:' + f : f; }
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(Number(ts) * 1000);
  if (isNaN(d.getTime())) return '';
  const now = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0'), mi = String(d.getMinutes()).padStart(2, '0');
  if (d.toDateString() === now.toDateString()) return `${hh}:${mi}`;
  return d.getFullYear() === now.getFullYear() ? `${mm}-${dd} ${hh}:${mi}` : `${d.getFullYear()}-${mm}-${dd} ${hh}:${mi}`;
}

let toastTimer = null;
function showToast(text) {
  const t = document.getElementById('bvidToast');
  t.textContent = text;
  t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 1800);
}

function applyHeaderLogin(m) {
  const cur = document.getElementById('loginEntry');
  if (!cur) return;
  const a = document.createElement('a');
  a.id = 'loginEntry';
  a.href = '/account';
  if (m.loggedIn && m.user) {
    a.className = 'avatar-btn';
    a.title = m.user.uname || '';
    if (m.user.face) {
      const img = document.createElement('img');
      img.src = faceUrl(m.user.face);
      img.referrerPolicy = 'no-referrer';
      a.appendChild(img);
    } else {
      a.textContent = (m.user.uname || '我').slice(0, 1);
    }
  } else {
    a.className = 'login-btn';
    a.textContent = '登录';
  }
  cur.replaceWith(a);
}

async function me() { const r = await fetch('/api/me'); return r.json(); }

// ============ 未登录：复用扫码登录流程 ============
function renderLogin() {
  app.innerHTML = `<div class="login-wrap"><section class="login-card">
    <h2>登录 B 站账号</h2>
    <p class="hint">消息中心需要登录后才能查看。使用哔哩哔哩 App 扫描二维码登录。</p>
    <button class="btn primary" id="getQr">生成二维码</button>
    <div id="qrArea"></div>
  </section></div>`;
  document.getElementById('getQr').onclick = startQR;
}
async function startQR() {
  const btn = document.getElementById('getQr'), area = document.getElementById('qrArea');
  btn.disabled = true; btn.textContent = '正在生成…';
  area.innerHTML = '<div class="status">正在生成登录二维码…</div>';
  try {
    const r = await fetch('/api/auth/qr'); const d = await r.json();
    if (!r.ok || !d.qr) throw new Error(d.error || '二维码生成失败');
    area.innerHTML = `<img class="qr" src="${d.qr}" alt="B站登录二维码">
      <div class="status" id="qrStatus">等待扫码…（二维码 180 秒后失效）</div>`;
    pollQR(d.login_id);
  } catch (e) {
    area.innerHTML = `<div class="status">${esc(e.message || '二维码生成失败')}<br>
      <button class="btn primary" style="margin-top:12px" onclick="location.reload()">重新尝试</button></div>`;
  }
}
async function pollQR(id) {
  const el = document.getElementById('qrStatus');
  for (let i = 0; i < 60; i++) {
    await new Promise(r => setTimeout(r, 3000));
    if (!document.getElementById('qrStatus')) return;
    try {
      const r = await fetch('/api/auth/poll?login_id=' + encodeURIComponent(id));
      const d = await r.json();
      if (d.status === 'waiting') el.textContent = '等待扫码…';
      else if (d.status === 'scanned') el.textContent = '已扫码，请在手机上确认登录…';
      else if (d.status === 'success') { _setCreds(d.cookies); el.textContent = '登录成功，正在进入消息中心…'; setTimeout(load, 500); return; }
      else if (d.status === 'expired') { el.innerHTML = '二维码已过期。<button class="btn primary" style="margin-left:8px" onclick="startQR()">重新生成</button>'; return; }
      else if (d.status === 'error') { el.textContent = d.message || '登录失败'; return; }
    } catch (e) { el.textContent = '网络请求失败，正在重试…'; }
  }
}

// ============ 消息中心主界面 ============
const NAV_ITEMS = [
  { key: 'im', label: '我的消息' },
  { key: 'reply', label: '回复我的' },
  { key: 'at', label: '@我的' },
  { key: 'like', label: '收到的赞' },
  { key: 'sys', label: '未关注人消息' },
];
let unread = { chat: 0, reply: 0, at: 0, like: 0, sysMsg: 0 };
let activeTab = 'im';
let myFace = '';

function navBadgeHTML(key) {
  if (key === 'im') return unread.chat > 0 ? `<span class="nav-badge">${unread.chat > 99 ? '99+' : unread.chat}</span>` : '';
  if (key === 'reply') return unread.reply > 0 ? `<span class="nav-badge">${unread.reply > 99 ? '99+' : unread.reply}</span>` : '';
  if (key === 'at') return unread.at > 0 ? `<span class="nav-badge">${unread.at > 99 ? '99+' : unread.at}</span>` : '';
  if (key === 'like') return unread.like > 0 ? `<span class="nav-badge">${unread.like > 99 ? '99+' : unread.like}</span>` : '';
  if (key === 'sys') return unread.sysMsg > 0 ? '<span class="nav-dot"></span>' : '';
  return '';
}

function renderShell() {
  app.innerHTML = `<div class="msg-layout">
    <div class="msg-nav">
      <div class="msg-nav-title">消息中心</div>
      ${NAV_ITEMS.map(it => `<div class="msg-nav-item" data-key="${it.key}">${it.label}<span id="badge-${it.key}">${navBadgeHTML(it.key)}</span></div>`).join('')}
    </div>
    <div class="msg-content" id="msgContent"></div>
  </div>`;
  app.querySelectorAll('.msg-nav-item').forEach(el => {
    el.addEventListener('click', () => switchTab(el.dataset.key));
  });
  updateNavActive();
}

function updateNavActive() {
  app.querySelectorAll('.msg-nav-item').forEach(el => el.classList.toggle('active', el.dataset.key === activeTab));
}

function switchTab(key) {
  activeTab = key;
  updateNavActive();
  const box = document.getElementById('msgContent');
  box.innerHTML = '<div class="msg-loading">正在加载…</div>';
  if (key === 'im') loadIm();
  else if (key === 'sys') loadFeedLike('sys');
  else loadFeedLike(key);
}

async function refreshUnread() {
  try {
    const r = await fetch('/api/message/unread');
    const d = await r.json();
    if (r.ok) unread = d;
    else console.error('[消息] 获取未读数失败', r.status, d);
  } catch (e) { console.error('[消息] 获取未读数异常', e); }
  NAV_ITEMS.forEach(it => {
    const el = document.getElementById('badge-' + it.key);
    if (el) el.innerHTML = navBadgeHTML(it.key);
  });
}

/* ---------------- 我的消息（私信） ---------------- */
let currentTalker = 0;
async function loadIm() {
  const box = document.getElementById('msgContent');
  box.innerHTML = `<div class="im-wrap">
    <div class="im-sessions">
      <div class="im-sessions-header">最近消息</div>
      <div class="im-session-list" id="imSessionList"><div class="msg-loading">正在加载…</div></div>

    <div class="im-chat" id="imChat"><div class="im-empty-chat">选择左侧的会话开始聊天</div></div>
  </div>`;
  try {
    const r = await fetch('/api/message/sessions?type=1');
    const d = await r.json().catch(() => ({}));
    const listEl = document.getElementById('imSessionList');
    if (!r.ok) {
      console.error('[消息] 获取会话列表失败', r.status, d);
      listEl.innerHTML = `<div class="msg-empty">${esc(d.error || ('加载失败（' + r.status + '）'))}<br>

      document.getElementById('imSessionsRetry').onclick = loadIm;
      return;
    }
    if (!d.list?.length) { listEl.innerHTML = '<div class="msg-empty">暂无私信</div>'; return; }
    listEl.innerHTML = d.list.map(s => `
      <div class="im-session-item" data-talker="${s.talkerId}" data-uname="${esc(s.uname)}" data-face="${esc(s.face)}">
        <img class="im-session-avatar" src="${esc(faceUrl(s.face))}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
        <div class="im-session-body">
          <div class="im-session-name">${esc(s.uname)}</div>
          <div class="im-session-preview">${esc(s.lastMsgPreview || '')}</div>
        </div>
        ${s.unreadCount > 0 ? `<span class="im-session-unread">${s.unreadCount > 99 ? '99+' : s.unreadCount}</span>` : ''}
      </div>`).join('');
    listEl.querySelectorAll('.im-session-item').forEach(el => {
      el.addEventListener('click', () => {
        listEl.querySelectorAll('.im-session-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        openChat(Number(el.dataset.talker), el.dataset.uname, el.dataset.face);
      });
    });
    // 默认打开第一个会话（与 B 站官方消息中心一致，避免右侧一直是空占位）
    const first = listEl.querySelector('.im-session-item');
    if (first) first.click();
  } catch (e) {
    console.error('[消息] 获取会话列表异常', e);
    document.getElementById('imSessionList').innerHTML = `<div class="msg-empty">${esc(e.message || '加载失败')}<br>
      <button class="msg-more-btn" style="margin-top:10px" id="imSessionsRetry">重试</button></div>`;
    document.getElementById('imSessionsRetry').onclick = loadIm;
  }
}

          <div class="im-emote-pkg"><div class="im-emote-pkg-name">${esc(pkg.name)}</div>
          <div class="im-emote-grid">${pkg.emojis.map(e => `<img src="${esc(e.url)}" alt="${esc(e.text)}" title="${esc(e.text)}" class="im-emote-item" data-text="${esc(e.text)}" referrerpolicy="no-referrer">`).join('')}</div></div>
        `).join('') || '<div class="msg-empty">无表情</div>';
        panel.dataset.loaded = '1';
        panel.querySelectorAll('.im-emote-item').forEach(el => {
          el.onclick = () => {
            const input = document.getElementById('imInput');
            input.value += el.dataset.text;
            panel.style.display = 'none';
            input.focus();
          };
        });
      } catch { panel.innerHTML = '<div class="msg-empty">表情加载失败</div>'; }
    }
  };
  imgBtn.onclick = () => fileInput.click();
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if (!file) return;
    imgBtn.disabled = true;
    try {
      const up = await fetch('/api/message/upload-image', { method: 'POST', body: file });
      const d = await up.json();
      if (!up.ok) { showToast(d.error || '图片上传失败'); return; }
      await sendMsg(talkerId, face, d);
    } finally { imgBtn.disabled = false; fileInput.value = ''; }
  };
}

function renderMsgRow(m, otherFace) {
  const mine = m.isMine;
  let bubble;
  if (m.type === 'image' && m.url) {
    bubble = `<div class="im-msg-bubble"><img src="${esc(m.url)}" referrerpolicy="no-referrer"></div>`;
  } else if (m.type === 'revoke') {
    bubble = `<div class="im-msg-bubble revoked">对方撤回了一条消息</div>`;
  } else {
    bubble = `<div class="im-msg-bubble">${renderEmojiText(m.text || '')}</div>`;
  }
  const face = mine ? myFace : otherFace;
  const ts = m.timestamp ? `<div class="im-msg-time">${formatMsgTime(m.timestamp)}</div>` : '';
  return `<div class="im-msg-row ${mine ? 'mine' : ''}">
    <img class="im-msg-avatar" src="${faceUrl(face)}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
    <div class="im-msg-content">${bubble}${ts}</div>
  </div>`;
}

function formatMsgTime(ts) {
  const d = new Date(ts * 1000);
  const now = new Date();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  if (d.toDateString() === now.toDateString()) return `${hh}:${mm}`;
  return `${d.getMonth()+1}/${d.getDate()} ${hh}:${mm}`;
}

// 把 [doge] 这类表情文本替换成图片
const EMOTE_RE = /\[[^\[\]\n]{1,20}\]/g;
function renderEmojiText(text) {
  const escd = esc(text);
  if (!emoteCache) return escd;
  const map = {};
  emoteCache.forEach(pkg => (pkg.emojis || []).forEach(e => { if (e.text && e.url) map[e.text] = e.url; }));
  return escd.replace(EMOTE_RE, (t) => map[t] ? `<img src="${esc(map[t])}" class="inline-emote" referrerpolicy="no-referrer">` : t);
}

let chatSeq = 0;
async function openChat(talkerId, uname, face, sessionType) {
  currentTalker = talkerId;
  if (!emoteCache) loadEmotePanel();
  // 清除会话未读角标
  document.querySelectorAll(`.session-item[data-talker="${talkerId}"] .unread-badge`).forEach(b => b.remove());
  const mySeq = ++chatSeq;
  sessionType = sessionType || 1;
  const chat = document.getElementById('imChat');
  chat.innerHTML = `
    <div class="im-chat-header">${esc(uname)}</div>
    <div class="im-chat-messages" id="imMessages"><div class="msg-loading">正在加载…</div></div>
    <div class="im-chat-input-wrap">
      <div class="im-chat-toolbar">
        <button type="button" id="imEmoteBtn" title="表情"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="10" r="1.1" fill="currentColor"/><circle cx="15" cy="10" r="1.1" fill="currentColor"/><path d="M8.5 14.5c1 1.2 2.2 1.8 3.5 1.8s2.5-.6 3.5-1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        <button type="button" id="imImageBtn" title="图片"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="10" r="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M21 16l-5-5-9 9" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
        <input type="file" id="imImageFile" accept="image/*" hidden>
      </div>
      <div class="im-emote-panel" id="imEmotePanel" style="display:none"></div>
      <textarea class="im-chat-input" id="imInput" maxlength="500" placeholder="请输入消息内容"></textarea>
      <div class="im-chat-footer">
        <span class="im-char-count" id="imCharCount">0/500</span>
        <button class="im-send-btn" id="imSendBtn">发送</button>
      </div>
    </div>`;
  const input = document.getElementById('imInput');
  input.addEventListener('input', () => {
    document.getElementById('imCharCount').textContent = `${input.value.length}/500`;
  });
  document.getElementById('imSendBtn').addEventListener('click', () => sendMsg(talkerId, face));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(talkerId, face); }
  });
  setupChatToolbar(talkerId, face);
  try {
    const r = await fetch(`/api/message/history?talker_id=${talkerId}&type=${sessionType}`);
    if (mySeq !== chatSeq) return; // 已切换到别的会话，丢弃旧结果
    const d = await r.json().catch(() => ({}));
    const box = document.getElementById('imMessages');
    if (!r.ok) {
      console.error('[消息] 获取消息记录失败', r.status, d);
      box.innerHTML = `<div class="msg-empty">${esc(d.error || ('加载失败（' + r.status + '）'))}<br>
        <button class="msg-more-btn" style="margin-top:10px" id="imHistoryRetry">重试</button></div>`;
      const btn = document.getElementById('imHistoryRetry');
      if (btn) btn.onclick = () => openChat(talkerId, uname, face, sessionType);
      return;
    }
    if (!d.list?.length) { box.innerHTML = '<div class="msg-empty">暂无消息记录</div>'; return; }
    box.innerHTML = d.list.map(m => renderMsgRow(m, face)).join('');
    box.scrollTop = box.scrollHeight;
  } catch (e) {
    if (mySeq !== chatSeq) return;
    console.error('[消息] 获取消息记录异常', e);
    const box = document.getElementById('imMessages');
    box.innerHTML = `<div class="msg-empty">${esc(e.message || '加载失败')}<br>
      <button class="msg-more-btn" style="margin-top:10px" id="imHistoryRetry">重试</button></div>`;
    const btn = document.getElementById('imHistoryRetry');
    if (btn) btn.onclick = () => openChat(talkerId, uname, face, sessionType);
  }
}

async function sendMsg(talkerId, face, imageData) {
  const input = document.getElementById('imInput');
  const text = input.value.trim();
  if (!text && !imageData) return;
  const btn = document.getElementById('imSendBtn');
  btn.disabled = true;
  try {
    const params = new URLSearchParams({ talker_id: talkerId });
    if (imageData) {
      params.set('image_url', imageData.url);
      params.set('image_width', imageData.width || 0);
      params.set('image_height', imageData.height || 0);
    } else {
      params.set('content', text);
    }
    const r = await fetch('/api/message/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: params,
    });
    const d = await r.json();
    if (!r.ok) { showToast(d.error || '发送失败'); return; }
    const box = document.getElementById('imMessages');
    if (box.querySelector('.msg-empty')) box.innerHTML = '';
    if (imageData) {
      box.insertAdjacentHTML('beforeend', renderMsgRow({ isMine: true, type: 'image', url: imageData.url, width: imageData.width, height: imageData.height }, face));
    } else {
      box.insertAdjacentHTML('beforeend', renderMsgRow({ isMine: true, type: 'text', text }, face));
      input.value = '';
      document.getElementById('imCharCount').textContent = '0/500';
    }
    box.scrollTop = box.scrollHeight;
  } catch (e) {
    showToast('发送失败（网络异常）');
  } finally {
    btn.disabled = false;
  }
}

/* ---------------- 回复我的 / @我的 / 收到的赞 / 系统通知 ---------------- */
const FEED_ACTION_TEXT = { reply: '回复了我的评论', at: '在评论中提到了我', like: '赞了我的内容' };

function feedItemHTML(x, kind) {
  const action = FEED_ACTION_TEXT[kind] || '';
  const mid = x.actorMid || 0;
  const profileLink = mid ? `/account?mid=${encodeURIComponent(mid)}` : 'javascript:void(0)';
  const videoLink = x.bvid ? `/player?bv=${encodeURIComponent(x.bvid)}${x.rpid ? '&highlight_rpid=' + x.rpid : ''}` : '#';
  const actorName = esc(x.actorName || 'B站用户');
  return `<div class="feed-item">
    <a class="feed-avatar" href="${profileLink}"><img class="feed-avatar-img" src="${esc(faceUrl(x.actorFace))}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'"></a>
    <div class="feed-row" style="flex:1">
      <div class="feed-body">
        <div class="feed-line1"><a class="feed-actor" href="${profileLink}">${actorName}</a><span class="feed-action">${esc(action)}</span></div>
        ${x.content ? `<a class="feed-content" href="${videoLink}">${esc(x.content)}</a>` : ''}
        <div class="feed-meta"><span>${esc(fmtTime(x.time))}</span></div>
      </div>
      ${x.thumb ? `<a href="${videoLink}"><img class="feed-thumb" src="${esc(x.thumb)}" referrerpolicy="no-referrer" onerror="this.style.display='none'"></a>` : ''}
    </div>
  </div>`;
}

function sysItemHTML(s) {
  const lastMsg = s.lastMsgPreview || '';
  const tid = s.talkerId || 0;
  return `<div class="feed-item sys-item" data-talker="${tid}" data-uname="${esc(s.uname || '')}" data-face="${esc(s.face || '')}" style="cursor:pointer">
    <img class="feed-avatar" src="${esc(faceUrl(s.face))}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
    <div class="feed-body">
      <div class="feed-line1"><span class="feed-actor">${esc(s.uname || '系统消息')}</span></div>
      ${lastMsg ? `<div class="feed-content">${esc(lastMsg)}</div>` : ''}
      <div class="feed-meta"><span>${esc(fmtTime(s.lastMsgTime))}</span></div>
    </div>
  </div>`;
}

let feedCursor = 0;
async function loadFeedLike(kind) {
  feedCursor = 0;
  const box = document.getElementById('msgContent');
  box.innerHTML = `<div class="feed-list" id="feedList"><div class="msg-loading">正在加载…</div></div><div class="msg-more-wrap" id="feedMore"></div>`;
  await fetchFeedPage(kind, true);
}

async function fetchFeedPage(kind, isFirst) {
  const listEl = document.getElementById('feedList');
  const moreEl = document.getElementById('feedMore');
  try {
    let items, hasMore, nextId, isSys = kind === 'sys';
    if (isSys) {
      const r = await fetch('/api/message/sessions?type=2');
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || '加载失败');
      items = d.list || [];
      hasMore = false;
    } else {
      const r = await fetch(`/api/message/${kind}?cursor=${feedCursor}`);
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || '加载失败');
      items = d.items || [];
      hasMore = d.hasMore;
      nextId = d.nextId;
    }
    if (isFirst) listEl.innerHTML = '';
    if (isFirst && !items.length) { listEl.innerHTML = '<div class="msg-empty">暂时没有相关消息</div>'; moreEl.innerHTML = ''; return; }
    listEl.insertAdjacentHTML('beforeend', items.map(x => isSys ? sysItemHTML(x) : feedItemHTML(x, kind)).join(''));
    if (isSys) {
      listEl.querySelectorAll('.sys-item').forEach(el => {
        el.addEventListener('click', () => openChat(Number(el.dataset.talker), el.dataset.uname, el.dataset.face, 2));
      });
    }
    if (!isSys && hasMore) {
      feedCursor = nextId;
      moreEl.innerHTML = '<button class="msg-more-btn" id="feedMoreBtn">加载更多</button>';
      document.getElementById('feedMoreBtn').onclick = () => {
        moreEl.innerHTML = '<button class="msg-more-btn" disabled>加载中…</button>';
        fetchFeedPage(kind, false);
      };
    } else {
      moreEl.innerHTML = '';
    }
  } catch (e) {
    if (isFirst) listEl.innerHTML = `<div class="msg-empty">${esc(e.message || '加载失败')}</div>`;
    else moreEl.innerHTML = `<button class="msg-more-btn" onclick="fetchFeedPage('${kind}', false)">加载失败，点击重试</button>`;
  }
}

  let m = { loggedIn: false };
  try { m = await me(); } catch (e) {}
  applyHeaderLogin(m);
  if (!m.loggedIn) { renderLogin(); return; }
  myFace = m.user?.face || '';
  renderShell();
  refreshUnread();
  switchTab('im');
}
load();
