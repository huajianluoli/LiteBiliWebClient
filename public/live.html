<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>直播 - B站视频搜索器</title>
<style>
  :root {
    --pink: #FB7299;
    --blue: #00A1D6;
    --bg: #F1F2F3;
    --card: #FFFFFF;
    --text: #18191C;
    --text-2: #61666D;
    --text-3: #9499A0;
    --border: #E3E5E7;
    --header-h: 64px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
      "Segoe UI", Roboto, sans-serif;
  }
  a { color: inherit; text-decoration: none; }

  /* ============ 顶栏（与 search.html 一致，固定为"滚动后"的不透明样式） ============ */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    height: var(--header-h);
    background: #fff;
    color: var(--text);
    box-shadow: 0 1px 8px rgba(0, 0, 0, .06);
  }
  .header-inner {
    max-width: 1400px;
    height: 100%;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .logo { display: flex; align-items: center; flex-shrink: 0; white-space: nowrap; user-select: none; color: var(--pink); }
  .logo-svg { display: block; height: 28px; width: auto; }

  .top-nav { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .top-nav-item {
    display: inline-flex; align-items: center; height: 32px; padding: 0 12px;
    border: none; background: none; border-radius: 8px; color: inherit;
    font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer;
    transition: background .15s ease, color .15s ease; opacity: .9;
  }
  .top-nav-item:hover { background: rgba(0, 0, 0, .05); opacity: 1; }
  .top-nav-item.active { opacity: 1; font-weight: 650; }

  .search-wrap { position: relative; flex: 1 1 auto; min-width: 0; max-width: 480px; margin: 0 auto; }
  .search-box { display: flex; width: 100%; height: 40px; background: var(--bg); border-radius: 20px; overflow: hidden; }
  .search-box input { flex: 1; min-width: 0; border: none; outline: none; padding: 0 18px; font-size: 14px; color: var(--text); background: transparent; }
  .search-box input::placeholder { color: var(--text-3); }
  .search-box button {
    border: none; background: var(--pink); color: #fff; padding: 0 20px; font-size: 14px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 6px; transition: filter .15s ease; flex-shrink: 0;
  }
  .search-box button:hover { filter: brightness(.94); }

  .user-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .user-icon {
    display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px;
    padding: 0; border: none; background: none; border-radius: 50%; color: inherit;
    font-family: inherit; cursor: pointer; transition: background .15s ease;
  }
  .user-icon:hover { background: rgba(0, 0, 0, .05); }
  .user-icon svg { display: block; }
  .login-btn {
    width: auto; height: 34px; padding: 0 16px; border-radius: 17px; background: var(--pink); color: #fff;
    font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center;
    transition: filter .15s ease;
  }
  .login-btn:hover { filter: brightness(.94); }
  .avatar-btn {
    width: 34px; height: 34px; padding: 0; border-radius: 50%; overflow: hidden; display: inline-flex;
    align-items: center; justify-content: center; background: var(--bg); color: var(--text-2);
    font-weight: 600; font-size: 14px;
  }
  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ============ 内容区 ============ */
  .layout {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 24px 60px;
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }
  .col-followed {
    flex: 0 0 300px;
    width: 300px;
  }
  .col-recommend { flex: 1 1 auto; min-width: 0; }
  .col-title {
    font-size: 16px;
    font-weight: 700;
    margin: 4px 0 14px;
    padding-left: 2px;
  }

  /* 关注列表：竖排小卡片 */
  .follow-list { display: flex; flex-direction: column; gap: 10px; }
  .follow-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: box-shadow .15s ease, transform .12s ease;
  }
  .follow-card:hover { box-shadow: 0 2px 10px rgba(0,0,0,.06); transform: translateY(-1px); }
  .follow-avatar-wrap { position: relative; flex-shrink: 0; }
  .follow-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #e7e8ea; display: block; }
  .follow-live-dot {
    position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--pink); border: 2px solid #fff;
  }
  .follow-body { min-width: 0; flex: 1; }
  .follow-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .follow-title { font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .follow-online { font-size: 11px; color: var(--pink); margin-top: 2px; }

  .empty-panel, .login-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 18px;
    text-align: center;
    color: var(--text-3);
    font-size: 13px;
  }
  .login-panel .btn-login {
    display: inline-block;
    margin-top: 14px;
    background: var(--pink);
    color: #fff;
    padding: 8px 20px;
    border-radius: 18px;
    font-size: 13px;
    font-weight: 600;
  }

  /* 推荐直播：网格卡片 */
  .live-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px 14px;
  }
  .live-card { display: block; }
  .live-thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    background: #e7e8ea;
  }
  .live-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
  .live-online-badge {
    position: absolute;
    left: 8px;
    top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(0,0,0,.55);
    color: #fff;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .live-online-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #FB7299; }
  .live-area-badge {
    position: absolute;
    right: 8px;
    top: 8px;
    background: rgba(0,0,0,.45);
    color: #fff;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .live-title {
    margin: 8px 0 0;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .live-owner {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-2);
  }
  .live-owner img { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #e7e8ea; }
  .live-owner span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .loading { text-align: center; color: var(--text-3); font-size: 13px; padding: 30px 0; }

  .bvid-toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px);
    background: rgba(24, 25, 28, .9); color: #fff; font-size: 14px; padding: 10px 18px; border-radius: 8px;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; white-space: nowrap;
  }
  .bvid-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    .col-followed { width: 100%; flex-basis: auto; }
  }
</style>
</head>

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
          <path d="M10.3 8.5L15.8 12L10.3 15.5V8.5Z" fill="currentColor"/>
        </svg>
      </a>

      <button type="button" class="user-icon" title="设置" data-placeholder="设置">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
          <path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.5-2.4.6a7.4 7.4 0 0 0-1.7-1L14.8 3h-4l-.5 2.6a7.4 7.4 0 0 0-1.7 1l-2.4-.6-2 3.5L6.2 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.5 2.4-.6a7.4 7.4 0 0 0 1.7 1l.5 2.6h4l.5-2.6a7.4 7.4 0 0 0 1.7-1l2.4.6 2-3.5-2-1.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<div class="layout">
  <div class="col-followed">
    <div class="col-title">关注的主播</div>
    <div id="followedBox"><div class="loading">正在加载…</div></div>
  </div>
  <div class="col-recommend">
    <div class="col-title">直播推荐</div>
    <div id="recommendBox"><div class="loading">正在加载…</div></div>
  </div>
</div>

<div class="bvid-toast" id="bvidToast"></div>

<script>
// ============ 登录凭证：与其它页面一致 ============
let _credsMem = {};
try {
  const raw = localStorage.getItem('bili_creds');
  if (raw) _credsMem = JSON.parse(raw) || {};
} catch (e) {}
function _cookieHeader() {
  return Object.keys(_credsMem || {}).map(k => `${k}=${_credsMem[k]}`).join('; ');
}
const _origFetch = window.fetch.bind(window);
window.fetch = (input, opts) => {
  opts = opts || {};
  const ch = _cookieHeader();
  if (opts.headers instanceof Headers) { if (ch) opts.headers.set('X-Bili-Cookie', ch); }
  else { opts.headers = Object.assign({}, opts.headers); if (ch) opts.headers['X-Bili-Cookie'] = ch; }
  return _origFetch(input, opts);
};

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function faceUrl(f) { f = String(f || ''); return f.startsWith('//') ? 'https:' + f : f; }
function fmtCount(n) {
  if (n == null) return '';
  n = Number(n) || 0;
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  return String(n);
}

let toastTimer = null;
function showToast(text) {
  const t = document.getElementById('bvidToast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
document.querySelectorAll('[data-placeholder]').forEach(el => {
  el.addEventListener('click', () => showToast((el.dataset.placeholder || '该功能') + '功能开发中，敬请期待'));
});

document.getElementById('searchForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const kw = document.getElementById('keyword').value.trim();
  if (!kw) return;
  location.href = '/search?kw=' + encodeURIComponent(kw);
});

// ============ 登录态 ============
function applyHeaderLogin(m) {
  const cur = document.getElementById('loginEntry');
  if (!cur) return;
  const a = document.createElement('a');
  a.id = 'loginEntry';
  a.href = '/account';
  if (m.loggedIn && m.user) {
    const uname = m.user.uname || '';
    a.className = 'avatar-btn';
    a.title = uname;
    if (m.user.face) {
      const img = document.createElement('img');
      img.src = faceUrl(m.user.face);
      img.referrerPolicy = 'no-referrer';
      img.alt = uname;
      a.appendChild(img);
    } else {
      a.textContent = uname.slice(0, 1) || '我';
    }
  } else {
    a.className = 'login-btn';
    a.textContent = '登录';
  }
  cur.replaceWith(a);
}

// ============ 左栏：关注的主播 ============
function followCardHTML(r) {
  return `
    <a class="follow-card" href="/stream?room_id=${encodeURIComponent(r.roomId)}">
      <div class="follow-avatar-wrap">
        <img class="follow-avatar" src="${esc(faceUrl(r.face))}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">
        <span class="follow-live-dot"></span>
      </div>
      <div class="follow-body">
        <div class="follow-name">${esc(r.uname)}</div>
        <div class="follow-title">${esc(r.title)}</div>
        ${r.online != null ? `<div class="follow-online">${fmtCount(r.online)} 人气</div>` : ''}
      </div>
    </a>`;
}

async function loadFollowed(loggedIn) {
  const box = document.getElementById('followedBox');
  if (!loggedIn) {
    box.innerHTML = `<div class="login-panel">登录后可观看你关注的 UP 主的直播<br><a class="btn-login" href="/account">登录后可观看你关注的up主</a></div>`;
    return;
  }
  try {
    const r = await fetch('/api/live/followed');
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '加载失败');
    if (!d.list?.length) {
      box.innerHTML = '<div class="empty-panel">你关注的 UP 主暂时没有人在直播</div>';
      return;
    }
    box.innerHTML = `<div class="follow-list">${d.list.map(followCardHTML).join('')}</div>`;
  } catch (e) {
    box.innerHTML = `<div class="empty-panel">${esc(e.message || '加载失败')}</div>`;
  }
}

// ============ 右栏：推荐直播 ============
function liveCardHTML(r) {
  return `
    <a class="live-card" href="/stream?room_id=${encodeURIComponent(r.roomId)}">
      <div class="live-thumb-wrap">
        <img class="live-thumb" src="${esc(r.cover)}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.visibility='hidden'">
        ${r.online != null ? `<span class="live-online-badge">${fmtCount(r.online)}</span>` : ''}
        ${r.area ? `<span class="live-area-badge">${esc(r.area)}</span>` : ''}
      </div>
      <p class="live-title" title="${esc(r.title)}">${esc(r.title)}</p>
      <div class="live-owner">
        ${r.face ? `<img src="${esc(faceUrl(r.face))}" referrerpolicy="no-referrer" onerror="this.style.display='none'">` : ''}
        <span>${esc(r.uname)}</span>
      </div>
    </a>`;
}

async function loadRecommend() {
  const box = document.getElementById('recommendBox');
  try {
    const r = await fetch('/api/live/recommend?page=1');
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '加载失败');
    if (!d.list?.length) {
      box.innerHTML = '<div class="empty-panel">暂时没有推荐内容</div>';
      return;
    }
    box.innerHTML = `<div class="live-grid">${d.list.map(liveCardHTML).join('')}</div>`;
  } catch (e) {
    box.innerHTML = `<div class="empty-panel">${esc(e.message || '加载失败')}</div>`;
  }
}

async function init() {
  let m = { loggedIn: false };
  try { const r = await fetch('/api/me'); m = await r.json(); } catch (e) {}
  applyHeaderLogin(m);
  loadFollowed(!!m.loggedIn);
  loadRecommend();
}
init();
</script>
</body>
</html>
